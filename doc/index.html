<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Документы</title>
<meta name="description" content="Служебные документы по образцу: уведомления, рапорты, акты, ориентировки. Данные остаются на устройстве.">
<meta name="robots" content="noindex">
<!-- Скрипты — только свои файлы (никакого встроенного кода); сеть — только ИИ и справочник
     индексов. wasm-unsafe-eval и worker blob: нужны распознаванию фото (Tesseract, WebAssembly). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data: https://gen.pollinations.ai https://suggestions.dadata.ru; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0c2b66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Документы">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* =============================================================================
   «Документы» — служебные документы по образцу прямо на телефоне.
   Строгая сине-белая гамма: белый фон, тёмно-синие шапка, заголовки и кнопки.
   (Имена переменных --gold* оставлены — это просто «акцент».)
   ============================================================================= */
:root{
  --bg:#f3f5f9; --s1:#ffffff; --s2:#f5f7fb; --s3:#ffffff;
  --brd:rgba(16,42,94,.10); --brd2:rgba(16,42,94,.22);
  --txt:#0e1a2f; --txt2:rgba(14,26,47,.74); --dim:rgba(14,26,47,.55);
  --gold:#123c8c; --gold2:#1f4fae; --goldS:rgba(18,60,140,.08); --goldB:rgba(18,60,140,.35);
  --navy:#0c2b66;
  --red:#b3412f; --grn:#2f7a45;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5;
  min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--gold);text-decoration:none}
button{font:inherit;cursor:pointer}

.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));
  background:var(--navy);color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.lg{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;
  font-family:'Times New Roman',Georgia,serif;font-size:19px;color:#fff}
.bn{font-family:'Times New Roman',Georgia,serif;font-size:17px;font-weight:700;letter-spacing:.04em;line-height:1.1;text-transform:uppercase}
.bs{font-size:9.5px;letter-spacing:.3em;color:rgba(255,255,255,.72);text-transform:uppercase;margin-top:2px}
.nav{display:flex;gap:2px}
.nav a{color:rgba(255,255,255,.78);font-size:13px;padding:8px 9px;border-radius:8px}
.nav a.on{color:#fff;background:rgba(255,255,255,.14)}

.wrap{max-width:760px;margin:0 auto;padding:22px 16px 80px}
.eyebrow{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
h1{font-family:'Times New Roman',Georgia,serif;font-weight:700;color:var(--navy);font-size:clamp(30px,7vw,42px);line-height:1.08;margin-bottom:8px}
.lead{color:var(--txt2);font-size:14px;margin-bottom:20px}

.card{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(12,43,102,.05)}
.card-t{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid .full{grid-column:1/-1}
@media(max-width:420px){.grid .half3{grid-column:1/-1}}
label.f{display:block}
label.f span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.02em}
input,select,textarea{width:100%;min-width:0;max-width:100%;background:var(--s2);border:1px solid var(--brd2);border-radius:10px;color:var(--txt);
  font:inherit;font-size:16px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--goldB)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
textarea.big{min-height:150px}
input[type=date],input[type=time]{min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;
  border:1px solid var(--brd2);background:#fff;color:var(--navy);font-size:15px;font-weight:500}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.btn.wide{width:100%}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}

.seg{display:flex;gap:4px;background:var(--s2);border:1px solid var(--brd);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--txt2);padding:9px 10px;border-radius:9px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--goldS);color:var(--gold);box-shadow:inset 0 0 0 1px var(--goldB)}

.case{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--brd)}
.case:last-child{border-bottom:0}
.case-b{flex:1;min-width:0;color:var(--txt)}
.case-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-m{font-size:12px;color:var(--dim)}
.x{border:0;background:transparent;color:var(--dim);font-size:20px;padding:6px 10px}

.note{border:1px solid var(--brd);border-left:2px solid var(--gold);border-radius:4px 12px 12px 4px;padding:12px 14px;
  font-size:13px;color:var(--txt2);background:var(--s1);margin-bottom:12px}
.warn{border-left-color:var(--red)}

.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--brd)}
.photo input{margin-top:6px;font-size:14px;padding:8px 10px}

/* Окна: просмотр документа и подтверждение отправки в ИИ */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,20,45,.92);display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.modal-h{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.modal-t{font-family:'Times New Roman',Georgia,serif;font-size:22px;font-weight:700;color:#fff}
.modal-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.payload{background:var(--s1);border:1px solid var(--brd2);padding:14px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--txt2)}
.payload mark{background:var(--goldS);color:var(--gold);border-radius:4px;padding:0 2px}

/* Лист A4 в предпросмотре: размеры в пунктах, масштаб под ширину экрана */
.paper-wrap{container-type:inline-size;max-width:760px;margin:0 auto}
.paper{background:#fff;color:#000;font-family:'Times New Roman',Times,serif;border-radius:4px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.3);
  --k:calc(100cqw / 595);line-height:1.15;overflow:hidden}
.paper .pg{padding:calc(var(--mt) * var(--k)) calc(var(--mr) * var(--k)) calc(var(--mb) * var(--k)) calc(var(--ml) * var(--k));min-height:calc(842 * var(--k))}
.paper .pg+.pg{border-top:6px solid #333}
.paper p{font-size:calc(var(--s) * var(--k));min-height:1.15em;white-space:pre-wrap}
.paper .t{display:flex}
.paper .t>div{flex:none}
.paper .tab{display:flex;justify-content:space-between}
.paper img{display:block;margin:0 auto}

.toasts{position:fixed;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--s3);border:1px solid var(--brd2);border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 10px 30px rgba(12,43,102,.25);animation:tin .25s ease}
.toast.error{border-color:rgba(217,128,111,.5)}
.toast.success{border-color:rgba(141,187,148,.5)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Печать (PDF): только лист документа, в натуральную величину */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .paper{--k:1pt;border-radius:0;margin:0}
  #printArea .pg{min-height:auto;break-after:page;border:0!important}
  #printArea .pg:last-child{break-after:auto}
}
#printArea{display:none}
@media(max-width:400px){.nav a{padding:8px 6px;font-size:12.5px}.brand{gap:9px}.lg{width:32px;height:32px;font-size:17px}.bs{letter-spacing:.2em}}
/* На узком экране в шапке — только значок, чтобы поместились три пункта меню */
@media(max-width:440px){.brand>div:last-child{display:none}}
@media(max-width:350px){.bn{font-size:15px}.nav a{padding:8px 4px}}
</style>
</head>
<body>

<header class="hdr">
  <a class="brand" href="#list"><div class="lg">Д</div><div><div class="bn">Документы</div><div class="bs">по образцу</div></div></a>
  <nav class="nav">
    <a href="#list" data-r="list">Материалы</a>
    <a href="#laws" data-r="laws">Нормы</a>
    <a href="#settings" data-r="settings">Настройки</a>
  </nav>
</header>

<main class="wrap" id="app"></main>
<div class="toasts" id="toasts"></div>
<div id="printArea"></div>
<input type="file" id="importFile" accept=".doc,.docx,.pdf,.txt,image/*" multiple style="display:none">
<input type="file" id="photoFile" accept="image/*" multiple style="display:none">

<script src="app.js"></script>
</body>
</html>
