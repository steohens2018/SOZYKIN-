}

// =============================================================================
// TOAST-УВЕДОМЛЕНИЯ. Показываем мягкие всплывающие сообщения вместо alert().
// Это премиум-паттерн UX: пользователя не вырывают из контекста модальным окном.
// =============================================================================
function toast(message, type='info', duration=3500){
  const host = $('#toastHost');
  if(!host) return;
  const el = document.createElement('div');
  el.className = `toast t-${type}`;
  const icon = {success:'✓', error:'✕', warn:'⚠', info:'ℹ'}[type] || 'ℹ';
  // Сообщение вставляем как текст, а не HTML: в него попадают имена файлов
  // и тексты ошибок от внешних API, которые мы не контролируем.
  const ico = document.createElement('span');
  ico.className = 'ico';
  ico.textContent = icon;
  const msg = document.createElement('span');
  msg.textContent = message;
  el.append(ico, msg);
  host.appendChild(el);
  // Лёгкая вибрация — для мобильного UX
  if(navigator.vibrate) navigator.vibrate(10);
  // Плавное исчезновение перед удалением
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(20px)';
  }, duration - 300);
  setTimeout(() => el.remove(), duration);
}

// =============================================================================
// СЛОВАРИ И КОНСТАНТЫ ДЛЯ АНАЛИЗА ТЕКСТА.
// Здесь собраны все списки, которые использует анализатор. Их легко
// расширить, если вы заметите, что какой-то признак не ловится.
// =============================================================================

// Стоп-слова русского языка — служебные слова, которые отфильтровываются
// при анализе шинглов и поиске совпадений. Без этого фильтра любые
// два русских текста казались бы похожими из-за общих предлогов и союзов.
const STOP_RU = new Set(('и в во не что он на я с со как а то все она так его но да ' +
  'ты к у же вы за бы по только ее мне было вот от меня еще нет о из ему теперь когда ' +
  'даже ну вдруг ли если уже или ни быть был него до вас нибудь опять уж вам ведь там ' +
  'потом себя ничего ей может они тут где есть надо ней для мы тебя их чем была сам чтоб ' +
  'без будто чего раз тоже себе под будет ж тогда кто этот того потому этого какой совсем ' +
  'ним здесь этом один почти мой тем чтобы нее сейчас были куда зачем всех никогда можно ' +
  'при наконец два об другой хоть после над больше тот через эти нас про всего них какая ' +
  'много разве три эту моя впрочем хорошо свою этой перед иногда лучше чуть том нельзя ' +
  'такой им более всегда конечно всю между').split(' '));

// Маркеры ИИ-генерации с весами.
//
// Вес 1 — клише, характерные именно для текстов языковых моделей (GPT-4,
// Claude, GigaChat, YandexGPT): «играет ключевую роль», «давайте рассмотрим»,
// «открывает новые возможности». Список составлен по наблюдениям за выводом
// моделей, а не взят из исследования.
//
// Вес 0.2 — обычные связки научного стиля. Люди пишут так постоянно: в
// юридических курсовых «в связи с» встречается до 20 раз, «но и» — до 11.
// Раньше они весили столько же, сколько настоящие ИИ-клише, и завышали оценку
// любого академического текста. Теперь лишь слегка добавляют к ней.
//
// «*» в конце слова — любое окончание: «многогранн*» = многогранный, -ая, -ые…
const MARKER_STRONG = 1;
const MARKER_WEAK = 0.2;
const marker = w => p => ({ p, w });
const strong = marker(MARKER_STRONG), weak = marker(MARKER_WEAK);

const AI_MARKERS_RU = [
  ...[
    'в современном мире', 'играет ключевую роль', 'играет решающую роль',
    'играет важнейшую роль', 'играет значительную роль', 'давайте рассмотрим',
    'давайте разберемся', 'необходимо понимать', 'важно понимать', 'крайне важно',
    'важно подчеркнуть', 'стоит подчеркнуть', 'нельзя не отметить',
    'неотъемлемой частью', 'неотъемлемая часть', 'открывает новые возможности',
    'открывает широкие возможности', 'в эпоху стремительного', 'стремительно развивающ*',
    'многогранн*', 'ключевым аспектом', 'ключевой аспект', 'подводя итог',
    'подводя итоги', 'можно с уверенностью сказать', 'в целом можно сказать',
    'является краеугольным камнем', 'служит фундаментом'
  ].map(strong),
  ...[
    'таким образом', 'в заключение', 'на сегодняшний день', 'представляет собой',
    'в условиях', 'может стать', 'является одним из', 'является важным',
    'имеет большое значение', 'играет важную роль', 'в первую очередь',
    'с одной стороны', 'с другой стороны', 'не только', 'но и', 'прежде всего',
    'в настоящее время', 'в рамках', 'в связи с', 'в контексте',
    'в современных условиях', 'в частности', 'в особенности', 'вместе с тем',
    'в то же время', 'тем не менее', 'в этой связи', 'стоит отметить',
    'следует отметить', 'важно отметить', 'это не просто'
  ].map(weak)
];

// Маркеры на английском. ИИ часто использует слова вроде "delve" (углубляться)
// или "tapestry" (полотно) намного чаще, чем носители языка.
const AI_MARKERS_EN = [
  ...[
    'delve into', 'delves into', 'tapestry', 'embark on', 'in the realm of',
    'multifaceted', 'it is important to note', 'it is worth noting', 'let us explore',
    'in today\'s world', 'plays a crucial role', 'plays a pivotal role', 'pivotal',
    'a testament to'
  ].map(strong),
  ...[
    'furthermore', 'moreover', 'in conclusion', 'crucial', 'landscape', 'navigat*',
    'nuanced', 'intricate', 'paramount', 'in essence', 'plays a significant role', 'realm'
  ].map(weak)
];

const AI_MARKERS = [...AI_MARKERS_RU, ...AI_MARKERS_EN];

// Карта гомоглифов: латинские буквы, графически идентичные кириллическим.
// Антиплагиат.ВУЗ помечает документы с такими подменами как «подозрительные».
// Алгоритм обнаружения: ищем слова, в которых одновременно есть кириллические
// и латинские символы — это почти всегда признак намеренной подмены.
const HOMOGLYPHS_LAT_TO_CYR = {
  'a':'а', 'c':'с', 'e':'е', 'o':'о', 'p':'р', 'x':'х', 'y':'у',
  'A':'А', 'B':'В', 'C':'С', 'E':'Е', 'H':'Н', 'K':'К', 'M':'М',
  'O':'О', 'P':'Р', 'T':'Т', 'X':'Х', 'Y':'У'
};

// Регулярка для поиска невидимых юникод-символов. Сюда входят:
// ZWSP (U+200B) — нулевой пробел, разрывает слова невидимо;
// ZWNJ (U+200C), ZWJ (U+200D) — управляющие символы юникода;
// WORD JOINER (U+2060), BOM (U+FEFF) — служебные символы;
// SOFT HYPHEN (U+00AD) — мягкий перенос (невидимый);
// еврейские никкуды (U+05B0-U+05BC) — диакритики, разрезающие слова.
const SUSPICIOUS_INVISIBLE = /[\u200B-\u200D\u2060\uFEFF\u00AD\u05B0-\u05BC]/g;

// =============================================================================
// БАЗОВЫЕ УТИЛИТЫ ОБРАБОТКИ ТЕКСТА.
// =============================================================================

// Токенизация — разбивает текст на слова, отфильтровывая знаки препинания
// и другие нелитерные символы. Поддерживает кириллицу, латиницу и цифры.
function tokenize(text){
  return (text.toLowerCase().match(/[а-яёa-z0-9]+/gi) || []);
}

// Разбивка на предложения. Используется lookbehind, чтобы найти конец
// предложения (точка/восклицание/вопрос/многоточие), за которым идёт пробел
// и заглавная буква — это хороший признак границы предложения для русского.
function splitSentences(text){
  return text.split(/(?<=[.!?…])\s+(?=[А-ЯA-ZЁ])/).filter(s => s.trim().length > 5);
}

// Псевдо-лемматизация для русского языка. Полная лемматизация требует
// тяжёлых словарей (типа pymorphy), которые в браузер не помещаются.
// Поэтому используем простой эвристический подход: отрезаем типичные
// окончания. Точность около 70%, но для нашей задачи этого достаточно.
function pseudoLemma(w){
  w = w.toLowerCase();
  const endings = [
    'ого', 'его', 'ему', 'ому', 'ыми', 'ими', 'ами',
    'ях', 'ах', 'ов', 'ев', 'ый', 'ий', 'ой', 'ая', 'яя',
    'ое', 'ее', 'ые', 'ие', 'ла', 'ло', 'ли', 'ть',
    'ут', 'ют', 'ат', 'ят', 'ет', 'ит', 'ся', 'сь',
    'ам', 'ям', 'ом', 'ем',
    'у', 'ю', 'а', 'я', 'е', 'и', 'ы', 'о', 'ь', 'й'
  ];
  for(const e of endings){
    if(w.length > e.length + 3 && w.endsWith(e)){
      return w.slice(0, -e.length);
    }
  }
  return w;
}

// Регулярка для маркера: только целые слова. Раньше маркер искался как
// подстрока, и «но и» находилось внутри «одно из», «окно и», «давно и» —
// в человеческом тексте без единого клише набиралось 4 «ИИ-маркера».
// Граница слова — любой символ, кроме буквы и цифры (\b в JS знает только латиницу).
const markerRegexCache = new Map();
function markerRegex(phrase){
  if(!markerRegexCache.has(phrase)){
    const words = phrase.replace(/ё/g, 'е').split(/\s+/).map(w => {
      const stem = w.endsWith('*');
      const esc = (stem ? w.slice(0, -1) : w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return stem ? esc + '\\p{L}*' : esc;
    });
    markerRegexCache.set(phrase,
      new RegExp('(^|[^\\p{L}\\d])(' + words.join('\\s+') + ')(?![\\p{L}\\d])', 'giu'));
  }
  return markerRegexCache.get(phrase);
}

// Поиск маркеров ИИ в тексте. Возвращает количество найденных, взвешенный
// балл (сильный маркер = 1, слабый = 0.2) и список с позициями для подсветки.
function countMarkers(text, markers){
  // ё → е не меняет длину строки, поэтому позиции совпадений остаются верными
  const norm = text.replace(/ё/g, 'е').replace(/Ё/g, 'Е');
  let count = 0, score = 0;
  const hits = [];
  for(const m of markers){
    const re = markerRegex(m.p);
    re.lastIndex = 0;
    let match;
    while((match = re.exec(norm)) !== null){
      count++;
      score += m.w;
      const pos = match.index + match[1].length;
      hits.push({ pos, len: match[2].length, text: m.p.replace(/\*/g, ''), weight: m.w });
      // Следующий поиск — с конца совпадения, без захваченного символа-границы
      re.lastIndex = pos + match[2].length;
    }
  }
  return { count, score, hits };
}

// Создание шинглов — последовательностей из N подряд идущих токенов.
// Антиплагиат использует k=2 или k=3 для поиска заимствований.
// Большее k даёт более точное совпадение, меньшее — лучше ловит парафразы.
function getShingles(tokens, n=3){
  const sh = new Map();
  for(let i = 0; i <= tokens.length - n; i++){
    const s = tokens.slice(i, i + n).join(' ');
    sh.set(s, (sh.get(s) || 0) + 1);
  }
  return sh;
}

// Экранирование HTML — защита от XSS при отображении пользовательского текста.
// Без этого пользователь мог бы вставить <script>... и заблокировать приложение.
// Кавычки тоже экранируем: значения попадают и в атрибуты (value="..."),
// где одна кавычка позволила бы дописать свой обработчик onerror/onfocus.
// Числа и прочие типы приводим к строке, чтобы функцию можно было звать для любого поля.
function escapeHtml(s){
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// fetch с ограничением по времени. Без таймаута недоступный из России сервис
// может держать соединение минутами, и вся проверка «висит» на одном запросе.
// AbortController вместо AbortSignal.timeout — ради старых Safari на iOS.
async function fetchWithTimeout(url, options = {}, ms = 8000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try{
    return await fetch(url, { ...options, signal: controller.signal });
  }catch(e){
    if(e.name === 'AbortError') throw new Error(`Сервис не ответил за ${Math.round(ms / 1000)} с`);
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

// =============================================================================
// ДЕТЕКТОР ПОДОЗРИТЕЛЬНОСТИ ДОКУМЕНТА.
//
// Антиплагиат.ВУЗ помечает документы с признаками манипуляций как
// «подозрительные», что снижает доверие к проверке. Наш детектор
// предупреждает пользователя об этих признаках ДО сдачи работы.
//
// Что мы ищем:
//   1) Невидимые юникод-символы (zero-width пробелы, мягкие переносы)
//   2) Гомоглифы — латинские буквы, графически идентичные кириллическим
//   3) Греческие буквы в русском тексте
//   4) Слова со смешанным алфавитом (главный признак подмены)
// =============================================================================

function scanSuspicious(text){
  // Структура результата для последующего отображения в UI
  const result = {
    zeroWidthCount: 0,        // Количество невидимых символов
    homoglyphsCount: 0,        // Количество подменённых символов
    mixedScriptWords: 0,       // Слов со смешанным алфавитом
    greekLettersCount: 0,      // Греческие буквы в русском тексте
    issues: [],                // Текстовые описания проблем для UI
    suspiciousScore: 0,        // Общий скор подозрительности от 0 до 1
    affectedWords: []          // Список найденных подозрительных слов
  };

  // 1) Сначала ищем все невидимые символы — это самый явный признак.
  // Если они есть, это почти всегда намеренная вставка для обхода антиплагиата.
  const zwMatches = text.match(SUSPICIOUS_INVISIBLE);
  if(zwMatches){
    result.zeroWidthCount = zwMatches.length;
    result.issues.push(
      `Невидимых символов (zero-width): ${zwMatches.length}`
    );
  }

  // 2) Ищем слова со смешанным алфавитом, где латинские буквы выдают себя
  // за русские. Слово берём как сплошную последовательность букв: так
  // «GPS/ГЛОНАСС» и «Wi-Fi-роутер» распадаются на отдельные слова и не
  // считаются смешанными. А латинские буквы в слове должны все быть
  // двойниками русских (a, c, e, o, p, x…): «ИвановАБ.pdf» из примера
  // в положении о ВКР содержит d и f — это имя файла, а не подмена,
  // зато «Cост.» с латинской C — настоящая подмена.
  const words = text.match(/\p{L}+/gu) || [];
  for(const w of words){
    if(w.length < 3) continue; // Слишком короткие слова пропускаем

    const hasCyrillic = /[\u0400-\u04FF]/.test(w);
    const latin = w.match(/[A-Za-z]/g) || [];
    const onlyLookalikes = latin.length > 0 && latin.every(ch => HOMOGLYPHS_LAT_TO_CYR[ch]);

    if(hasCyrillic && onlyLookalikes){
      result.mixedScriptWords++;
      result.affectedWords.push(w);
      // Считаем, сколько именно символов могут быть гомоглифами
      for(const ch of w){
        if(HOMOGLYPHS_LAT_TO_CYR[ch]){
          result.homoglyphsCount++;
        }
      }
    }
  }
  if(result.mixedScriptWords > 0){
    result.issues.push(
      `Слов с подменёнными буквами: ${result.mixedScriptWords} ` +
      `(всего символов: ${result.homoglyphsCount})`
    );
  }

  // 3) Греческие буквы в русском тексте. Алгоритм: проверяем, что текст
  // действительно русскоязычный (есть достаточно кириллических букв подряд),
  // и только потом ищем греческие — иначе можем ошибочно сработать на
  // легитимных формулах в математических текстах.
  const isRussianText = /[\u0400-\u04FF]{20,}/.test(text);
  if(isRussianText){
    const greekMatches = text.match(/[\u0370-\u03FF]/g);
    if(greekMatches){
      result.greekLettersCount = greekMatches.length;
      result.issues.push(
        `Греческих букв в русском тексте: ${greekMatches.length}`
      );
    }
  }

  // 4) Считаем общий скор подозрительности.
  // Веса подобраны эмпирически: даже несколько zero-width дают заметный
  // сигнал, но при этом одна случайная латинская буква (например, в URL
  // или иностранном термине) не вызывает паники.
  result.suspiciousScore = Math.min(1,
    result.zeroWidthCount * 0.05 +
    result.homoglyphsCount * 0.02 +
    result.mixedScriptWords * 0.04 +
    result.greekLettersCount * 0.08
  );

  return result;
}

// Очистка текста от подозрительных символов — для безопасной отправки в API.
// Если у пользователя в тексте есть zero-width символы, мы их удаляем
// перед отправкой, чтобы не «ломать» работу LLM.
function cleanSuspicious(text){
  return text.replace(SUSPICIOUS_INVISIBLE, '');
}

// =============================================================================
// MINHASH + LSH — алгоритм быстрого сравнения больших текстов.
//
// Идея: вместо посимвольного сравнения двух текстов, мы превращаем каждый
// в короткую «сигнатуру» из 128 чисел. Если сигнатуры похожи, тексты
// тоже похожи с высокой математической вероятностью. Это позволяет за
// миллисекунды сравнивать тысячи документов между собой.
//
// LSH (Locality-Sensitive Hashing) — это группировка сигнатур в «бакеты»
// так, чтобы похожие сигнатуры с высокой вероятностью попадали в один
// бакет. Это даёт ещё одно ускорение: вместо сравнения каждого с каждым
// мы сравниваем только в пределах одного бакета.
// =============================================================================

const MINHASH_NUM = 128;   // Количество хеш-функций в сигнатуре

// Затравки для хеш-функций. Генерируются детерминированно (xorshift32
// с фиксированным началом), а не через Math.random(): так сигнатуры одного
// и того же текста совпадают между перезагрузками страницы и их можно
// сохранять и сравнивать позже.
const MINHASH_SEEDS = (() => {
  const seeds = new Uint32Array(MINHASH_NUM);
  let x = 0x9E3779B9;
  for(let i = 0; i < MINHASH_NUM; i++){
    x ^= x << 13; x >>>= 0;
    x ^= x >>> 17;
    x ^= x << 5;  x >>>= 0;
    seeds[i] = x;
  }
  return seeds;
})();

// Финализатор MurmurHash3 — перемешивает биты 32-битного числа.
// Всё считается через Math.imul в 32-битной арифметике. Прежняя формула
// (a*x + b) mod p перемножала два 32-битных числа в double, результат
// превышал 2^53, младшие биты терялись, и хеши получались неравномерными.
function mix32(h){
  h ^= h >>> 16;
  h = Math.imul(h, 0x85EBCA6B);
  h ^= h >>> 13;
  h = Math.imul(h, 0xC2B2AE35);
  h ^= h >>> 16;
  return h >>> 0;
}

// FNV-32 — простая и быстрая хеш-функция для строк.
// Используется как базовый хеш перед применением хеш-функций MinHash.
function fnv32(str){
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return h;
}

// Расчёт MinHash-сигнатуры текста. Алгоритм:
//   1) Разбиваем текст на шинглы (последовательности из 4 токенов)
//   2) Для каждого шингла применяем все 128 хеш-функций
//   3) Для каждой хеш-функции запоминаем минимальное значение
// В итоге получаем вектор из 128 чисел — это и есть сигнатура.
function minhash(text){
  // Разбиваем текст на шинглы. Размер 4 — хороший баланс между точностью
  // и скоростью. Меньшие шинглы (2-3) лучше ловят парафразы, но дают
  // больше ложных срабатываний на коротких текстах.
  const tokens = (text.toLowerCase().match(/[\p{L}\d]+/gu) || []);
  const shingleSet = new Set();
  for(let i = 0; i <= tokens.length - 4; i++){
    shingleSet.add(tokens.slice(i, i + 4).join(' '));
  }

  // Если шинглов меньше 5, текст слишком короткий для надёжной сигнатуры
  if(shingleSet.size < 5) return null;

  // Инициализируем сигнатуру максимальными 32-битными значениями
  const signature = new Uint32Array(MINHASH_NUM).fill(0xFFFFFFFF);

  // Проходим по каждому шинглу и обновляем сигнатуру
  for(const shingle of shingleSet){
    const baseHash = fnv32(shingle);
    for(let i = 0; i < MINHASH_NUM; i++){
      // i-я хеш-функция: перемешиваем базовый хеш вместе со своей затравкой
      const hashed = mix32(baseHash ^ MINHASH_SEEDS[i]);
      if(hashed < signature[i]){
        signature[i] = hashed;
      }
    }
  }
  return signature;
}

// Сравнение двух MinHash-сигнатур. Возвращает приближённое значение
// коэффициента Жаккара (similarity от 0 до 1). Математически доказано,
// что эта оценка точна с погрешностью около ±5% для 128 хеш-функций.
function jaccardSimilarity(sigA, sigB){
  if(!sigA || !sigB) return 0;
  let matches = 0;
  for(let i = 0; i < MINHASH_NUM; i++){
    if(sigA[i] === sigB[i]) matches++;
  }
  return matches / MINHASH_NUM;
}

// =============================================================================
// TF-IDF + COSINE SIMILARITY — семантическое сравнение двух текстов.
//
// TF-IDF (Term Frequency × Inverse Document Frequency) — классическая
// техника информационного поиска, которая даёт каждому слову «вес»:
//   - Частые в документе слова получают высокий вес
//   - Часто встречающиеся в большой коллекции слова получают низкий вес
// Это позволяет выделить «характерные» для документа слова.
//
// Cosine similarity сравнивает два таких векторов и даёт значение от 0 до 1,
// где 1 — полное совпадение по смыслу, 0 — полностью разные тексты.
// =============================================================================

function termFrequency(tokens){
  const tf = new Map();
  for(const token of tokens){
    tf.set(token, (tf.get(token) || 0) + 1);
  }
  // Нормализуем: делим частоту каждого слова на общее количество слов
  const total = tokens.length;
  for(const [k, v] of tf) tf.set(k, v / total);
  return tf;
}

function inverseDocumentFrequency(documents){
  const N = documents.length;
  const documentFrequency = new Map();
  // Считаем, в скольких документах встречается каждое слово
  for(const doc of documents){
    const uniqueInDoc = new Set(doc);
    for(const word of uniqueInDoc){
      documentFrequency.set(word, (documentFrequency.get(word) || 0) + 1);
    }
  }
  // Сглаженный IDF = ln((1 + N) / (1 + df)) + 1. Обычная формула ln(N / df)
  // при сравнении двух текстов (N = 2) даёт общим словам вес ln(2/2) = 0,
  // и сходство любых двух текстов выходило нулевым — даже одинаковых.
  const idf = new Map();
  for(const [word, df] of documentFrequency){
    idf.set(word, Math.log((1 + N) / (1 + df)) + 1);
  }
  return idf;
}

function tfidfVector(tfMap, idfMap){
  const vector = new Map();
  for(const [word, tfValue] of tfMap){
    const idfValue = idfMap.get(word) || 0;
    vector.set(word, tfValue * idfValue);
  }
  return vector;
}

function cosineSimilarity(vectorA, vectorB){
  let dotProduct = 0, normA = 0, normB = 0;
  for(const [word, valueA] of vectorA){
    normA += valueA * valueA;
    if(vectorB.has(word)){
      dotProduct += valueA * vectorB.get(word);
    }
  }
  for(const value of vectorB.values()){
    normB += value * value;
  }
  // Защита от деления на ноль для пустых векторов
  if(normA === 0 || normB === 0) return 0;
  return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
}

// Главная функция семантического сравнения двух текстов
function semanticSimilarity(textA, textB){
  const tokensA = tokenize(textA).filter(t => !STOP_RU.has(t)).map(pseudoLemma);
  const tokensB = tokenize(textB).filter(t => !STOP_RU.has(t)).map(pseudoLemma);
  if(tokensA.length === 0 || tokensB.length === 0) return 0;

  const idfMap = inverseDocumentFrequency([tokensA, tokensB]);
  const vectorA = tfidfVector(termFrequency(tokensA), idfMap);
  const vectorB = tfidfVector(termFrequency(tokensB), idfMap);
  return cosineSimilarity(vectorA, vectorB);
}

// =============================================================================
// ЧТЕНИЕ ФАЙЛОВ ДОКУМЕНТОВ.
//
// Поддерживаются три формата: PDF (через PDF.js), DOCX (через mammoth)
// и TXT. Для TXT критически важна правильная обработка кодировки —
// русские текстовые файлы часто сохраняются в Windows-1251, а не в UTF-8,
// и без правильного декодирования вместо текста получаются «крякозябры».
// =============================================================================

async function readFile(file){
  const lowerName = file.name.toLowerCase();

  // Защита от слишком больших файлов — браузер на телефоне
  // может зависнуть на больших объёмах. 10 МБ — разумная верхняя граница.
  if(file.size > 10 * 1024 * 1024){
    throw new Error('Файл больше 10 МБ. Разбейте документ на части.');
  }

  // TXT — пытаемся декодировать как UTF-8 в строгом режиме (fatal:true).
  // Если выбрасывается ошибка — значит файл не в UTF-8, и мы пробуем
  // декодировать как Windows-1251 (стандартная русская кодировка для DOS/Windows).
  if(lowerName.endsWith('.txt') || file.type === 'text/plain'){
    const buffer = await file.arrayBuffer();
    try{
      return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
    }catch(e){
      // Fallback на Windows-1251 — браузеры поддерживают эту кодировку нативно
      return new TextDecoder('windows-1251').decode(buffer);
    }
  }

  // DOCX — современный формат Word. Mammoth извлекает «сырой» текст,
  // игнорируя форматирование (что нам и нужно для анализа).
  if(lowerName.endsWith('.docx')){
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer });
    if(!result.value || !result.value.trim()){
      throw new Error('DOCX-файл пустой или не содержит текста');
    }
    return result.value;
  }

  // DOC (старый формат Word 97-2003). Mammoth технически его не поддерживает,
  // но иногда срабатывает как fallback. Если не получилось — просим
  // пользователя пересохранить файл в новом формате.
  if(lowerName.endsWith('.doc')){
    try{
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      if(result.value && result.value.trim()) return result.value;
    }catch(e){}
    throw new Error(
      'Формат .doc (Word 97-2003) не поддерживается. ' +
      'Откройте файл в Word и сохраните как .docx'
    );
  }

  // PDF — извлекаем текст из всех страниц. Если PDF без текстового слоя
  // (например, скан), результат будет пустым — об этом сообщаем пользователю.
  if(lowerName.endsWith('.pdf') || file.type === 'application/pdf'){
    if(!window.pdfjsLib){
      throw new Error('PDF.js ещё загружается. Подождите 2 секунды и повторите.');
    }
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let text = '';
    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      // Соединяем элементы текста через пробелы. PDF.js разбивает строки
      // на отдельные «текстовые элементы» (по словам или по фрагментам).
      const pageText = textContent.items.map(item => item.str).join(' ');
      text += pageText + '\n\n';
    }
    if(!text.trim()){
      throw new Error(
        'PDF не содержит текстового слоя (вероятно, это скан). ' +
        'Используйте OCR-приложение (FineScanner, Microsoft Lens) для распознавания.'
      );
    }
    return text;
  }

  // Универсальный fallback — пробуем прочитать как обычный текстовый файл
  return await file.text();
}

// =============================================================================
// ПРОВЕРКА ОФОРМЛЕНИЯ DOCX ПО ПОЛОЖЕНИЯМ БЮИ МВД РОССИИ.
//
// Требования взяты из двух документов Барнаульского юридического института:
//   — Положение о курсовой работе (приказ от 16.12.2022 № 1014);
//   — Положение о выпускных квалификационных работах (приказ от 29.09.2023 № 702).
// Оформление в них одинаковое: Times New Roman 14, интервал 1,5, поля
// 30/10/20/20 мм, абзацный отступ 1,25 см, выравнивание по ширине, номера
// страниц вверху по центру. Различаются объём и допустимые заимствования.
//
// DOCX — это zip-архив с XML внутри. Читаем его сами: распаковка встроенным
// DecompressionStream, разбор — DOMParser. Так не нужна ещё одна библиотека
// с CDN. Значения берутся с учётом стилей Word: умолчания документа →
// цепочка стилей абзаца (basedOn) → стиль символа → прямое форматирование.
// =============================================================================

// Знаков на страницу (Times New Roman 14, интервал 1,5, поля 30/10/20/20):
// среднее по пяти проверенным курсовым и ВКР — от 1390 до 1750 с учётом
// титульного листа и оглавления.
const CHARS_PER_PAGE = 1600;

const WORK_TYPES = {
  none:    { name: 'Не указан' },
  course:  { name: 'Курсовая', full: 'Курсовая работа', pages: [25, 35], borrowMax: null,
             source: 'Положение о курсовой работе БЮИ МВД России (приказ от 16.12.2022 № 1014)' },
  diploma: { name: 'Дипломная', full: 'ВКР — дипломная работа', pages: [50, 60], borrowMax: 50,
             source: 'Положение о ВКР БЮИ МВД России (приказ от 29.09.2023 № 702)' },
  master:  { name: 'Магистерская', full: 'ВКР — магистерская диссертация', pages: [70, 80], borrowMax: 30,
             source: 'Положение о ВКР БЮИ МВД России (приказ от 29.09.2023 № 702)' }
};

const FORMAT_RULES = {
  font: 'Times New Roman', size: 14, line: 1.5, indentCm: 1.25,
  margins: { left: 30, right: 10, top: 20, bottom: 20 },
  // Доля основного текста, которая должна соответствовать требованию.
  // 95%, а не 100%: в любой работе есть таблицы, формулы, вставки.
  share: 0.95
};

// Распаковка нужных файлов из zip. Формат: в конце архива «центральный
// каталог» со списком файлов и смещениями; сами данные сжаты deflate.
async function unzipEntries(buffer, wanted){
  const bytes = new Uint8Array(buffer);
  const dv = new DataView(buffer);
  let eocd = -1;
  for(let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('файл повреждён или это не DOCX');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const utf8 = new TextDecoder('utf-8');
  const out = {};
  for(let n = 0; n < count && off + 46 <= bytes.length; n++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const size = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const skip = nameLen + dv.getUint16(off + 30, true) + dv.getUint16(off + 32, true);
    const local = dv.getUint32(off + 42, true);
    const name = utf8.decode(bytes.subarray(off + 46, off + 46 + nameLen));
    off += 46 + skip;
    if(!wanted(name)) continue;
    const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    const data = bytes.subarray(start, start + size);
    if(method === 0){
      out[name] = utf8.decode(data);
    } else if(method === 8){
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      out[name] = await new Response(stream).text();
    }
  }
  return out;
}

const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
function wChild(el, name){
  if(!el) return null;
  for(const c of el.children) if(c.namespaceURI === W_NS && c.localName === name) return c;
  return null;
}
function wChildren(el, name){
  return el ? [...el.children].filter(c => c.namespaceURI === W_NS && c.localName === name) : [];
}
function wAttr(el, name){
  return el ? el.getAttributeNS(W_NS, name) : null;
}

// Свойства абзаца: интервал, абзацный отступ, выравнивание, стиль
function readParaProps(pPr){
  const o = {};
  if(!pPr) return o;
  const sp = wChild(pPr, 'spacing');
  const line = wAttr(sp, 'line');
  if(line){
    const rule = wAttr(sp, 'lineRule');
    // auto — множитель (240 = одинарный); exact/atLeast — фиксированные пункты
    o.line = (!rule || rule === 'auto') ? { mult: +line / 240 } : { pt: +line / 20 };
  }
  const ind = wChild(pPr, 'ind');
  if(ind){
    const first = wAttr(ind, 'firstLine'), hanging = wAttr(ind, 'hanging');
    if(first) o.indent = +first / 567;          // твипы → см
    else if(hanging) o.indent = -hanging / 567;
  }
  const jc = wAttr(wChild(pPr, 'jc'), 'val');
  if(jc) o.jc = jc;
  const style = wAttr(wChild(pPr, 'pStyle'), 'val');
  if(style) o.style = style;
  const pbb = wChild(pPr, 'pageBreakBefore');
  if(pbb) o.pbb = !/^(0|false|off)$/.test(wAttr(pbb, 'val') || '');
  return o;
}

// Свойства символов: шрифт и кегль. Для кириллицы Word берёт шрифт из слота
// hAnsi, поэтому он важнее ascii.
function readRunProps(rPr){
  const o = {};
  if(!rPr) return o;
  const f = wChild(rPr, 'rFonts');
  if(f){
    const name = wAttr(f, 'hAnsi') || wAttr(f, 'ascii');
    const theme = wAttr(f, 'hAnsiTheme') || wAttr(f, 'asciiTheme');
    if(name) o.font = name;
    else if(theme) o.fontTheme = theme;
  }
  const sz = wAttr(wChild(rPr, 'sz'), 'val');
  if(sz) o.size = +sz / 2;
  const rs = wAttr(wChild(rPr, 'rStyle'), 'val');
  if(rs) o.rstyle = rs;
  // «Все прописные» — заголовок может быть набран строчными, но выглядеть прописным
  const caps = wChild(rPr, 'caps');
  if(caps) o.caps = !/^(0|false|off)$/.test(wAttr(caps, 'val') || '');
  return o;
}

async function checkDocxFormatting(buffer){
  if(typeof DecompressionStream === 'undefined'){
    throw new Error('браузер не умеет распаковывать DOCX (нужен Safari 16.4+ или свежий Chrome)');
  }
  const files = await unzipEntries(buffer, n =>
    n === 'word/document.xml' || n === 'word/styles.xml' || n === 'word/theme/theme1.xml' ||
    n === 'docProps/app.xml' || n === 'word/_rels/document.xml.rels' ||
    n === 'word/footnotes.xml' || n === 'word/settings.xml' ||
    /^word\/(header|footer)\d*\.xml$/.test(n));
  if(!files['word/document.xml']) throw new Error('в архиве нет word/document.xml');
  const parse = xml => new DOMParser().parseFromString(xml, 'application/xml');
  const doc = parse(files['word/document.xml']);

  // Шрифты темы: «minorHAnsi» и т. п. → реальное имя шрифта
  const themeFonts = {};
  if(files['word/theme/theme1.xml']){
    const theme = parse(files['word/theme/theme1.xml']);
    for(const kind of ['minorFont', 'majorFont']){
      const latin = theme.getElementsByTagNameNS('*', kind)[0]?.getElementsByTagNameNS('*', 'latin')[0];
      if(latin) themeFonts[kind.replace('Font', '')] = latin.getAttribute('typeface');
    }
  }
  const fontName = props => props.font ||
    (props.fontTheme ? themeFonts[props.fontTheme.startsWith('major') ? 'major' : 'minor'] : null);

  // Стили: умолчания документа и цепочки basedOn
  const styles = {};
  let defaultsP = {}, defaultsR = {}, defaultParaStyle = null;
  if(files['word/styles.xml']){
    const st = parse(files['word/styles.xml']);
    const dd = st.getElementsByTagNameNS(W_NS, 'docDefaults')[0];
    defaultsP = readParaProps(wChild(wChild(dd, 'pPrDefault'), 'pPr'));
    defaultsR = readRunProps(wChild(wChild(dd, 'rPrDefault'), 'rPr'));
    for(const s of st.getElementsByTagNameNS(W_NS, 'style')){
      const id = wAttr(s, 'styleId');
      styles[id] = {
        basedOn: wAttr(wChild(s, 'basedOn'), 'val'),
        p: readParaProps(wChild(s, 'pPr')),
        r: readRunProps(wChild(s, 'rPr'))
      };
      if(wAttr(s, 'type') === 'paragraph' && (wAttr(s, 'default') === '1' || wAttr(s, 'default') === 'true')){
        defaultParaStyle = id;
      }
    }
  }
  const styleChain = (id, kind) => {
    const chain = [];
    for(let cur = id, guard = 0; cur && styles[cur] && guard < 20; cur = styles[cur].basedOn, guard++){
      chain.unshift(styles[cur][kind]);
    }
    return Object.assign({}, ...chain);
  };
  const paraProps = p => {
    const direct = readParaProps(wChild(p, 'pPr'));
    return Object.assign({}, defaultsP, styleChain(direct.style || defaultParaStyle, 'p'), direct);
  };
  const runProps = (p, r) => {
    const styleId = readParaProps(wChild(p, 'pPr')).style || defaultParaStyle;
    const direct = readRunProps(wChild(r, 'rPr'));
    return Object.assign({}, defaultsR, styleChain(styleId, 'r'), direct.rstyle ? styleChain(direct.rstyle, 'r') : {}, direct);
  };

  // Основной текст — абзацы тела документа длиннее 200 символов: так
  // отсекаются титульный лист, оглавление, заголовки и подписи. Абзацы
  // внутри таблиц не учитываются (это прямые потомки w:body).
  const body = doc.getElementsByTagNameNS(W_NS, 'body')[0];
  const tally = () => new Map();
  const fonts = tally(), sizes = tally(), lines = tally(), indents = tally(), aligns = tally();
  const add = (map, key, n) => map.set(key, (map.get(key) || 0) + n);
  let bodyChars = 0;
  const paragraphs = wChildren(body, 'p');
  const textOf = p => [...p.getElementsByTagNameNS(W_NS, 't')].map(t => t.textContent).join('');
  for(const p of paragraphs){
    const text = textOf(p);
    if(text.length < 200) continue;
    bodyChars += text.length;
    const direct = readParaProps(wChild(p, 'pPr'));
    const styleId = direct.style || defaultParaStyle;
    const pp = Object.assign({}, defaultsP, styleChain(styleId, 'p'), direct);
    const line = pp.line ? (pp.line.mult ? Math.round(pp.line.mult * 100) / 100 + '' : pp.line.pt + ' пт (точно)') : '1';
    add(lines, line, text.length);
    add(indents, pp.indent != null ? (Math.round(pp.indent * 100) / 100) + ' см' : '0 см', text.length);
    add(aligns, pp.jc || 'left', text.length);
    const paraRun = Object.assign({}, defaultsR, styleChain(styleId, 'r'));
    for(const r of p.getElementsByTagNameNS(W_NS, 'r')){
      const n = [...r.getElementsByTagNameNS(W_NS, 't')].reduce((sum, t) => sum + t.textContent.length, 0);
      if(!n) continue;
      const direct = readRunProps(wChild(r, 'rPr'));
      const rp = Object.assign({}, paraRun, direct.rstyle ? styleChain(direct.rstyle, 'r') : {}, direct);
      add(fonts, fontName(rp) || 'не задан', n);
      add(sizes, rp.size ? rp.size + ' пт' : 'не задан', n);
    }
  }

  const share = (map, ok) => {
    let total = 0, good = 0;
    for(const [k, v] of map){ total += v; if(ok(k)) good += v; }
    return total ? good / total : 0;
  };
  const top = map => [...map.entries()].sort((a, b) => b[1] - a[1])
    .slice(0, 2).map(([k, v]) => `${k} (${Math.round(v / Math.max(1, [...map.values()].reduce((a, b) => a + b, 0)) * 100)}%)`).join(', ');
  const isJustify = k => k === 'both' || k === 'distribute' || k === 'justify';
  const alignName = k => ({ both: 'по ширине', distribute: 'по ширине', justify: 'по ширине',
    left: 'по левому краю', start: 'по левому краю', center: 'по центру', right: 'по правому краю', end: 'по правому краю' })[k] || k;
  const alignTop = new Map([...aligns].map(([k, v]) => [alignName(k), v]));

  const checks = [];
  const rule = (label, expected, map, ok) => {
    const s = share(map, ok);
    checks.push({ label, expected, actual: top(map), ok: s >= FORMAT_RULES.share, share: Math.round(s * 100) });
  };
  if(bodyChars > 0){
    rule('Шрифт', FORMAT_RULES.font, fonts, k => k.toLowerCase() === 'times new roman');
    rule('Кегль', FORMAT_RULES.size + ' пт', sizes, k => k === FORMAT_RULES.size + ' пт');
    rule('Межстрочный интервал', '1,5', lines, k => Math.abs(parseFloat(k) - FORMAT_RULES.line) < 0.05 && !k.includes('пт'));
    rule('Абзацный отступ', '1,25 см', indents, k => Math.abs(parseFloat(k) - FORMAT_RULES.indentCm) < 0.06);
    rule('Выравнивание', 'по ширине', alignTop, k => k === 'по ширине');
  }

  // Поля: проверяем все разделы документа
  const sections = [...doc.getElementsByTagNameNS(W_NS, 'sectPr')];
  const marginIssues = new Set();
  let marginActual = '';
  for(const sect of sections){
    const pg = wChild(sect, 'pgMar');
    if(!pg) continue;
    const mm = k => Math.round(+wAttr(pg, k) / 56.7);
    const m = { left: mm('left'), right: mm('right'), top: mm('top'), bottom: mm('bottom') };
    if(!marginActual) marginActual = `левое ${m.left}, правое ${m.right}, верхнее ${m.top}, нижнее ${m.bottom} мм`;
    for(const [k, v] of Object.entries(FORMAT_RULES.margins)){
      if(Math.abs(m[k] - v) > 1){
        marginIssues.add(`${{ left: 'левое', right: 'правое', top: 'верхнее', bottom: 'нижнее' }[k]} ${m[k]} мм вместо ${v}`);
      }
    }
  }
  if(marginActual){
    checks.unshift({ label: 'Поля', expected: 'левое 30, правое 10, верхнее 20, нижнее 20 мм',
      actual: marginIssues.size ? [...marginIssues].join('; ') : marginActual, ok: marginIssues.size === 0 });
  }

  // Номера страниц: поле PAGE в верхнем колонтитуле, абзац по центру
  const rels = {};
  if(files['word/_rels/document.xml.rels']){
    for(const rel of parse(files['word/_rels/document.xml.rels']).getElementsByTagNameNS('*', 'Relationship')){
      rels[rel.getAttribute('Id')] = 'word/' + rel.getAttribute('Target').replace(/^\/?word\//, '');
    }
  }
  const pageField = xml => /<w:fldSimple[^>]*PAGE\b/.test(xml) || /<w:instrText[^>]*>\s*PAGE\b/.test(xml);
  let numbering = 'none';
  for(const sect of sections){
    for(const kind of ['headerReference', 'footerReference']){
      for(const ref of wChildren(sect, kind)){
        const target = rels[ref.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id')];
        const xml = files[target];
        if(!xml || !pageField(xml)) continue;
        if(kind === 'footerReference'){ if(numbering === 'none') numbering = 'bottom'; continue; }
        // Абзац с номером: выравнивание из самого абзаца или его стиля
        const hdr = parse(xml);
        const para = [...hdr.getElementsByTagNameNS(W_NS, 'p')].find(p => pageField(new XMLSerializer().serializeToString(p)));
        const props = para ? Object.assign({}, defaultsP, styleChain(readParaProps(wChild(para, 'pPr')).style, 'p'), readParaProps(wChild(para, 'pPr'))) : {};
        numbering = props.jc === 'center' ? 'top-center' : 'top-other';
      }
    }
    if(numbering === 'top-center') break;
  }
  checks.push({
    label: 'Номера страниц', expected: 'вверху по центру',
    actual: { 'top-center': 'вверху по центру', 'top-other': 'вверху, но не по центру', bottom: 'внизу страницы', none: 'не найдены' }[numbering],
    ok: numbering === 'top-center'
  });

  // Объём: число страниц из свойств документа (Word записывает его при
  // сохранении). Положения считают объём без списка литературы и приложений,
  // поэтому вычитаем их долю по тексту. Если Word не записал число страниц
  // (файл сделан другой программой) — оцениваем по ~1800 знаков на страницу.
  const allText = paragraphs.map(textOf);
  const totalChars = allText.reduce((s, t) => s + t.length, 0) || 1;
  // Заголовок списка литературы. \p{L} и флаг u — потому что \w и \b в JS
  // не понимают кириллицу. «использован\p{L}*» ловит и опечатку «ИСПОЛЬЗОВАНЫХ».
  // Строки оглавления («…………47», «Литература28») пропускаем; берём последнее
  // вхождение. Просто «Литература» — запасной вариант: так часто называют
  // и подраздел внутри списка.
  const biblioStrong = /^\s*(список\s+(использован\p{L}*\s+)?(источников|литературы)|библиографическ\p{L}*\s+список)/iu;
  const biblioWeak = /^\s*литература\s*:?\s*$/iu;
  const isTocLine = t => /[….]{3,}|\d\s*$/.test(t);
  const findLast = re => allText.reduce((at, t, i) => (t.length < 120 && !isTocLine(t) && re.test(t)) ? i : at, -1);
  let biblioAt = findLast(biblioStrong);
  if(biblioAt < 0) biblioAt = findLast(biblioWeak);
  const charsBefore = biblioAt > 0 ? allText.slice(0, biblioAt).reduce((s, t) => s + t.length, 0) : totalChars;
  // Число страниц Word записывает при сохранении, но иногда не обновляет:
  // в одной из курсовых стояла 1 страница при 50 тыс. знаков. Страница
  // в 14-м кегле с интервалом 1,5 вмещает не больше ~2500 знаков, поэтому
  // значение с большей плотностью считаем устаревшим.
  const savedPages = +(files['docProps/app.xml'] || '').match(/<Pages>(\d+)<\/Pages>/)?.[1] || 0;
  const wordPages = savedPages && totalChars / savedPages <= 2500 ? savedPages : 0;
  const pagesTotal = wordPages || Math.ceil(totalChars / CHARS_PER_PAGE);
  // Точнее всего — по оглавлению: там записан номер страницы, с которой
  // начинается список литературы («СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ……47»).
  // Титульный лист — первая страница, значит основной текст занимает 46.
  // Оглавление бывает внутри блока w:sdt, поэтому ищем по всем абзацам.
  let tocPage = 0;
  for(const p of doc.getElementsByTagNameNS(W_NS, 'p')){
    const t = textOf(p);
    const m = t.length < 160 && (biblioStrong.test(t) || /^\s*литература/iu.test(t)) && t.match(/(\d{1,3})\s*$/);
    if(m && +m[1] > 1){ tocPage = +m[1]; break; }
  }
  const pagesMain = tocPage ? tocPage - 1 : Math.round(pagesTotal * charsBefore / totalChars);

  return {
    structure: checkStructure(body, paraProps, runProps, textOf, biblioStrong, biblioWeak, isTocLine),
    footnotes: checkFootnotes(doc, files, parse, paraProps, runProps, fontName, textOf),
    biblio: biblioAt > 0 ? checkBibliography(allText.slice(biblioAt + 1)) : null,
    checks,
    pagesTotal,
    pagesMain,
    pagesSource: wordPages ? 'word' : 'estimate',
    pagesMainSource: tocPage ? 'toc' : 'proportion',
    bibliographyFound: biblioAt > 0,
    bodyChars
  };
}

// Структура работы по положениям: оглавление, введение, главы, заключение,
// список литературы. «Работа не может быть представлена одной главой»;
// «каждая глава начинается с новой страницы»; «заголовки глав набираются
// прописными буквами… точка в конце не ставится».
function checkStructure(body, paraProps, runProps, textOf, biblioStrong, biblioWeak, isTocLine){
  // Абзацы основного потока, без таблиц. Оглавление в блоке w:sdt остаётся:
  // его строки отсекаются по номерам страниц и отточиям.
  const flow = [...body.getElementsByTagNameNS(W_NS, 'p')].filter(p => {
    for(let e = p.parentNode; e && e !== body; e = e.parentNode) if(e.localName === 'tbl') return false;
    return true;
  });
  const found = { toc: false, intro: false, conclusion: false, biblio: false };
  const chapters = [], badHeads = [];
  let pending = false;       // разрыв страницы или раздела после последнего текста
  let inMain = false;        // между введением и заключением
  for(const p of flow){
    // Разрыв до первого текста абзаца, после последнего, и признак Word,
    // что при последней вёрстке абзац начался с новой страницы
    let seen = false, brBefore = false, brAfter = false, rendered = false;
    for(const el of p.getElementsByTagNameNS(W_NS, '*')){
      const n = el.localName;
      if(n === 't'){ if(el.textContent.trim()){ seen = true; brAfter = false; } }
      else if(n === 'br' && wAttr(el, 'type') === 'page'){ if(seen) brAfter = true; else brBefore = true; }
      else if(n === 'lastRenderedPageBreak' && !seen) rendered = true;
    }
    const sect = wChild(wChild(p, 'pPr'), 'sectPr');
    const sectBreak = !!sect && wAttr(wChild(sect, 'type'), 'val') !== 'continuous';
    const text = textOf(p).replace(/\s+/g, ' ').trim();
    if(!text){ if(brBefore || brAfter || sectBreak) pending = true; continue; }
    const newPage = pending || brBefore || rendered || !!paraProps(p).pbb;
    pending = brAfter || sectBreak;
    if(text.length > 200 || isTocLine(text)) continue;
    const compact = text.replace(/\s/g, '').toLowerCase();
    if(compact === 'оглавление' || compact === 'содержание') found.toc = true;
    else if(compact === 'введение'){ found.intro = true; inMain = true; }
    else if(compact === 'заключение'){ found.conclusion = true; inMain = false; }
    else if(biblioStrong.test(text) || biblioWeak.test(text)){ found.biblio = true; inMain = false; }
    else if(/^глава\s*(\d+|[IVX]+)/iu.test(text)){
      const title = text.replace(/^глава\s*(\d+|[IVX]+)\s*\.?\s*/iu, '');
      const letters = title.match(/\p{L}/gu) || [];
      const upper = letters.filter(c => c !== c.toLowerCase()).length;
      const runs = [...p.getElementsByTagNameNS(W_NS, 'r')].filter(r => textOf(r).trim());
      const caps = runs.length > 0 && runs.every(r => runProps(p, r).caps);
      chapters.push({ text, newPage, upper: caps || !letters.length || upper / letters.length >= 0.9, dot: /\.$/.test(text) });
      inMain = true;
    }
    // Заголовки параграфов «1.2 Название» — только проверка точки в конце
    else if(inMain && text.length < 160 && /^\d{1,2}\.\d{1,2}\.?\s+\p{L}/u.test(text) && /\.$/.test(text)){
      badHeads.push(text);
    }
  }
  return {
    missing: [!found.toc && 'оглавление', !found.intro && 'введение', !chapters.length && 'главы',
      !found.conclusion && 'заключение', !found.biblio && 'список литературы'].filter(Boolean),
    chapters: chapters.length,
    notNewPage: chapters.filter(c => !c.newPage).map(c => c.text),
    lowercase: chapters.filter(c => !c.upper).map(c => c.text),
    withDot: chapters.filter(c => c.dot).map(c => c.text).concat(badHeads)
  };
}

// Сноски: «ссылки… приводятся постранично. Нумерация ссылок на каждой
// странице начинается с „1“. Текст ссылки — через 1 интервал, Times New
// Roman 12, выравнивание по ширине».
function checkFootnotes(doc, files, parse, paraProps, runProps, fontName, textOf){
  const count = doc.getElementsByTagNameNS(W_NS, 'footnoteReference').length;
  const res = { count, issues: [] };
  if(!count || !files['word/footnotes.xml']) return res;
  // Перезапуск нумерации на каждой странице: в настройках документа или в разделе
  const restart = xml => /<w:footnotePr>[\s\S]*?<w:numRestart w:val="eachPage"/.test(xml || '');
  res.eachPage = restart(files['word/settings.xml']) || restart(files['word/document.xml']);
  if(!res.eachPage) res.issues.push('нумерация сквозная, а не с 1 на каждой странице');
  const sizes = new Map(), lines = new Map(), aligns = new Map(), fonts = new Map();
  const add = (map, key, n) => map.set(key, (map.get(key) || 0) + n);
  const fn = parse(files['word/footnotes.xml']);
  for(const note of fn.getElementsByTagNameNS(W_NS, 'footnote')){
    if(/separator/i.test(wAttr(note, 'type') || '')) continue;
    for(const p of note.getElementsByTagNameNS(W_NS, 'p')){
      const len = textOf(p).trim().length;
      if(len < 3) continue;
      const pp = paraProps(p);
      add(lines, pp.line ? (pp.line.mult ? Math.round(pp.line.mult * 100) / 100 + '' : pp.line.pt + ' пт') : '1', len);
      add(aligns, pp.jc === 'both' || pp.jc === 'distribute' ? 'по ширине' : pp.jc === 'center' ? 'по центру' : 'по левому краю', len);
      for(const r of p.getElementsByTagNameNS(W_NS, 'r')){
        // Номер сноски набирается мелким надстрочным — его не считаем
        if(r.getElementsByTagNameNS(W_NS, 'footnoteRef').length) continue;
        const n = textOf(r).length;
        if(!n) continue;
        const rp = runProps(p, r);
        add(sizes, rp.size ? rp.size + ' пт' : 'не задан', n);
        add(fonts, fontName(rp) || 'не задан', n);
      }
    }
  }
  // Требование выполнено, если ему соответствует не меньше 90% текста сносок;
  // иначе показываем самое частое неверное значение и его долю
  const bad = (map, ok, what) => {
    const total = [...map.values()].reduce((a, b) => a + b, 0);
    if(!total) return;
    const wrong = [...map.entries()].filter(([k]) => !ok(k)).sort((a, b) => b[1] - a[1]);
    const share = wrong.reduce((a, [, v]) => a + v, 0) / total;
    if(share > 0.1) res.issues.push(`${what} ${String(wrong[0][0]).replace('.', ',')} (${Math.round(wrong[0][1] / total * 100)}%)`);
  };
  bad(sizes, k => k === '12 пт', 'кегль');
  bad(fonts, k => /^times new roman/i.test(k), 'шрифт');
  bad(lines, k => k === '1', 'интервал');
  bad(aligns, k => k === 'по ширине', 'выравнивание');
  return res;
}

// Список литературы: разделы, алфавитный порядок, свежесть источников
// и даты обращения у электронных ресурсов (ГОСТ Р 7.0.100-2018).
function checkBibliography(lines){
  const nowYear = new Date().getFullYear();
  const isHeader = t => t.length < 100 && !/(?<!\d)(1[89]|20)\d{2}(?!\d)/.test(t) && !t.includes('//') &&
    /(нормативн|правов|литератур|эмпирическ|материал|источник|интернет|электрон)/iu.test(t.replace(/\s/g, ''));
  const kindOf = t => {
    const c = t.replace(/\s/g, '').toLowerCase();
    if(/нормативн|правов\p{L}*акт|официальн\p{L}*документ/u.test(c)) return 'normative';
    if(/эмпирическ|материал\p{L}*практик|судебн\p{L}*практик/u.test(c)) return 'empirical';
    if(/литератур|учебн|научн/u.test(c)) return 'literature';
    return 'other';
  };
  const lawLike = /^(\d+\s*[.)]\s*)?(конституци|кодекс|федеральн|закон|указ|постановлени|приказ|распоряжени|конвенци|международн|всеобщ|устав|решени|определени|апелляционн|письмо|о\s|об\s)/iu;
  const entries = [];
  const sections = { normative: false, literature: false, empirical: false };
  let current = null;
  for(const raw of lines){
    const t = raw.replace(/\s+/g, ' ').trim();
    if(!t) continue;
    if(/^приложени/iu.test(t.replace(/\s/g, '')) && t.length < 80) break;
    if(isHeader(t)){ current = kindOf(t); if(current in sections) sections[current] = true; continue; }
    if(t.length < 25) continue;
    entries.push({ t, section: current });
  }
  const yearOf = t => {
    const clean = t.replace(/дата\s+обращения[^)]*\)?/giu, '');
    const ys = (clean.match(/(?<!\d)(1[89]\d{2}|20\d{2})(?!\d)/g) || []).map(Number).filter(y => y <= nowYear);
    return ys.length ? Math.max(...ys) : null;
  };
  const hasSections = sections.normative || sections.literature;
  const lit = entries.filter(e => hasSections ? e.section === 'literature' : !lawLike.test(e.t));
  const years = lit.map(e => yearOf(e.t)).filter(Boolean);
  const recent = years.filter(y => y >= nowYear - 5).length;
  // Алфавит — только в разделе учебной и научной литературы: нормативные
  // акты располагаются по юридической силе
  // Ключ — только буквы: «Соколов, Д. В.» и «Соколов Д.В.» сравниваются одинаково
  const key = t => t.replace(/^\d+\s*[.)]?\s*/, '').toLowerCase().replace(/[^\p{L}]/gu, '');
  const unsorted = [];
  if(sections.literature){
    for(let i = 1; i < lit.length; i++){
      if(key(lit[i].t).localeCompare(key(lit[i - 1].t), 'ru', { sensitivity: 'base' }) < 0){
        unsorted.push(`«${lit[i].t.slice(0, 40)}…» после «${lit[i - 1].t.slice(0, 40)}…»`);
      }
    }
  }
  const urls = entries.filter(e => /https?:\/\/|www\./i.test(e.t));
  return {
    count: entries.length,
    sections, hasSections,
    litCount: lit.length, withYear: years.length, recent,
    unsorted,
    urls: urls.length,
    urlNoDate: urls.filter(e => !/дата\s+обращения/iu.test(e.t)).length
  };
}

// Сводка требований положения для выбранного типа работы: заимствования,
// объём и оформление. Используется и на экране, и в скачиваемом отчёте.
function requirementChecks(r){
  const f = r.formatting && !r.formatting.error ? r.formatting : null;
  let type = WORK_TYPES[r.work_type];
  if(!type || r.work_type === 'none'){
    // Тип работы не выбран: объём и порог заимствований не проверить,
    // но оформление DOCX по положениям всё равно показываем
    if(!f) return null;
    type = { full: 'Оформление', borrowMax: null, source: 'Положения о курсовой работе и ВКР БЮИ МВД России' };
  }
  const rows = [];
  if(type.borrowMax != null){
    const searched = r.search_stats && r.search_stats.okBases.length > 0;
    rows.push({
      label: 'Заимствования', expected: `не более ${type.borrowMax}%`,
      actual: searched ? `${r.borrowed_percent}% по открытым базам` : 'не проверены: базы не ответили',
      ok: searched ? r.borrowed_percent <= type.borrowMax : null
    });
  }
  if(f){
    if(type.pages){
      const [lo, hi] = type.pages;
      rows.push({
        label: 'Объём', expected: `${lo}–${hi} страниц без списка литературы и приложений`,
        actual: f.pagesMainSource === 'toc'
          ? `${f.pagesMain} стр. (список литературы начинается на с. ${f.pagesMain + 1} по оглавлению)`
          : `≈ ${f.pagesMain} стр.` + (f.pagesSource === 'word' ? ` (всего ${f.pagesTotal} по данным Word)` : ' (оценка по числу знаков)'),
        ok: f.pagesMain >= lo && f.pagesMain <= hi
      });
    }
    rows.push(...f.checks, ...documentRows(f, r.work_type));
  }
  const note = r.formatting ? (r.formatting.error ? `Оформление не проверено: ${r.formatting.error}.` : '') : 'Оформление проверяется только у файлов DOCX.';
  return { type, rows, formattingNote: note };
}

// Строки требований о структуре, сносках и списке литературы
function documentRows(f, workType){
  const rows = [];
  const list = (arr, n = 2) => arr.slice(0, n).map(t => `«${t.length > 60 ? t.slice(0, 60) + '…' : t}»`).join(', ') +
    (arr.length > n ? ` и ещё ${arr.length - n}` : '');
  const st = f.structure;
  if(st){
    rows.push({ label: 'Структура', expected: 'оглавление, введение, главы, заключение, список литературы',
      actual: st.missing.length ? 'нет: ' + st.missing.join(', ') : 'все части на месте', ok: !st.missing.length });
    const min = workType === 'master' ? 3 : 2;
    if(st.chapters){
      rows.push({ label: 'Главы', expected: workType === 'master' ? 'как правило, не меньше трёх' : 'не меньше двух',
        actual: `${st.chapters}`, ok: st.chapters >= min });
      rows.push({ label: 'Главы с новой страницы', expected: 'каждая глава — с новой страницы',
        actual: st.notNewPage.length ? 'без разрыва страницы: ' + list(st.notNewPage) : 'да', ok: !st.notNewPage.length });
    }
    if(st.chapters || st.withDot.length){
      const issues = [];
      if(st.lowercase.length) issues.push('не прописными: ' + list(st.lowercase, 1));
      if(st.withDot.length) issues.push('с точкой в конце: ' + list(st.withDot, 1));
      rows.push({ label: 'Заголовки', expected: 'главы — прописными, без точки в конце',
        actual: issues.length ? issues.join('; ') : 'в порядке', ok: !issues.length });
    }
  }
  const fn = f.footnotes;
  if(fn){
    rows.push({ label: 'Сноски', expected: 'постраничные, с 1 на каждой странице; Times New Roman 12, интервал 1, по ширине',
      actual: !fn.count ? 'сносок нет' : `${fn.count}` + (fn.issues.length ? '; ' + fn.issues.join(', ') : ', оформлены верно'),
      ok: fn.count > 0 && !fn.issues.length });
  }
  const b = f.biblio;
  if(b && b.count){
    const sec = b.sections;
    rows.push({ label: 'Разделы списка литературы', expected: 'нормативные правовые акты; учебная, научная литература; эмпирические материалы (при наличии)',
      actual: b.hasSections ? [sec.normative && 'нормативные акты', sec.literature && 'литература', sec.empirical && 'эмпирические материалы'].filter(Boolean).join(', ')
        : 'не выделены', ok: sec.normative && sec.literature });
    if(sec.literature && b.litCount > 1){
      rows.push({ label: 'Алфавитный порядок', expected: 'литература — по алфавиту',
        actual: b.unsorted.length ? `нарушений: ${b.unsorted.length}, например ` + b.unsorted[0] : 'соблюдён', ok: !b.unsorted.length });
    }
    if(b.urls){
      rows.push({ label: 'Электронные ресурсы', expected: 'с датой обращения',
        actual: b.urlNoDate ? `без даты обращения: ${b.urlNoDate} из ${b.urls}` : `все ${b.urls} с датой`, ok: !b.urlNoDate });
    }
    if(b.withYear){
      rows.push({ label: 'Список литературы', expected: 'свежие источники — рекомендация, не требование',
        actual: `источников: ${b.count}; литература за последние 5 лет — ${Math.round(b.recent / b.withYear * 100)}% (${b.recent} из ${b.withYear})`,
        ok: null });
    }
  }
  return rows;
}

// =============================================================================
// ЛОКАЛЬНЫЙ АНАЛИЗ — ГЛАВНАЯ ФУНКЦИЯ.
//
// Детектор подозрительности, цитирование, шаблонность, фрагменты и оценка
// ИИ-генерации по стилю (откалиброванные метрики — ниже, в STYLE_METRICS).
// =============================================================================

// MTLD — Measure of Textual Lexical Diversity (McCarthy 2005).
// Считает, через сколько слов в среднем «выгорает» лексическое разнообразие
// до порога 0.72. Чем больше, тем богаче словарь.
function mtld(tokens, threshold = 0.72){
  if (tokens.length < 50) return 0;
  function factorCount(arr){
    let types = new Set(), count = 0, factors = 0;
    for (const w of arr){
      types.add(w); count++;
      if (types.size / count <= threshold){
        factors++;
        types = new Set(); count = 0;
      }
    }
    if (count > 0){
      const partial = (1 - types.size / count) / (1 - threshold);
      factors += partial;
    }
    return factors > 0 ? arr.length / factors : arr.length;
  }
  const fwd = factorCount(tokens);
  const bwd = factorCount([...tokens].reverse());
  return (fwd + bwd) / 2;
}

// HD-D — гипергеометрическое разнообразие: ожидаемая доля разных слов
// в случайной выборке из 42 слов.
function hdd(tokens, sample = 42){
  if (tokens.length < sample) return 0;
  const N = tokens.length;
  const freq = {};
  for (const w of tokens) freq[w] = (freq[w] || 0) + 1;

  // Логарифм факториала через массив для скорости
  const logFact = new Float64Array(N + 1);
  for (let i = 1; i <= N; i++) logFact[i] = logFact[i-1] + Math.log(i);
  const logC = (n, k) => {
    if (k < 0 || k > n) return -Infinity;
    return logFact[n] - logFact[k] - logFact[n-k];
  };

  let result = 0;
  for (const w in freq){
    const fi = freq[w];
    const logProbNot = logC(N - fi, sample) - logC(N, sample);
    const probIn = 1 - Math.exp(logProbNot);
    result += probIn / sample;
  }
  return result;
}

// K Юла — концентрация повторов: чем выше, тем чаще повторяются одни слова.
function yuleK(tokens){
  if (!tokens.length) return 0;
  const freq = {};
  for (const w of tokens) freq[w] = (freq[w] || 0) + 1;
  const m = {};
  for (const c of Object.values(freq)) m[c] = (m[c] || 0) + 1;
  const N = tokens.length;
  let s = 0;
  for (const i in m) s += i * i * m[i];
  return 10000 * (s - N) / (N * N);
}

// =============================================================================
// ИИ-ДЕТЕКЦИЯ ПО СТИЛЮ — калибровка на размеченных работах.
//
// Прежняя модель (12 метрик с порогами «из литературы») исходила из того,
// что у ИИ словарь беднее, чем у человека. На реальных работах оказалось
// наоборот, и ИИ-статьи получали 7–11% («человек»). Калибровка — на 9
// размеченных документах:
//   — ИИ: 4 статьи 2025–2026 годов (2 юридические о БПЛА, 2 экономические);
//   — люди: 5 курсовых и ВКР 2022–2025 годов, в том числе ВКР о БПЛА —
//     та же тема, что у двух ИИ-статей.
// У ИИ-текстов выше разнообразие словаря (HD-D, MTLD) и меньше повторов
// (K Юла). Клише, канцелярит, вариативность длины предложений, R Оноре,
// W Брюне и закон Ципфа ИИ от людей не отличали и в оценку не входят.
//
// Проверка на жанр — открытый набор AINL-Eval 2025 (52 тыс. русских научных
// аннотаций, люди и модели GPT-4-Turbo, Llama 3.3, Gemma 2; github.com/
// iis-research-team/AINL-Eval-2025). Человеческие аннотации по этим трём
// метрикам похожи на человеческие курсовые, так что метрики не путают
// «научный стиль» с ИИ. Но и модели этого набора по ним от людей почти не
// отличаются (у GPT-4 словарь чуть богаче, у Llama и Gemma — беднее): оценка
// ловит тексты, похожие на размеченные ИИ-работы, а не любой ИИ-текст.
//
// Проверка вне настройки: модель, настроенная только на двух юридических
// ИИ-статьях, узнала обе экономические (68%). Человеческие работы,
// исключённые из настройки по одной, получили 0–34%.
//
// ОГРАНИЧЕНИЯ. Калибровка по 9 документам, все ИИ-тексты — короткие статьи.
// Высокий процент — повод присмотреться к тексту, а не доказательство.
//
// Как считается: основной текст режется на куски по ~300 слов, метрики
// считаются для каждого куска, по каждой берётся медиана. Затем метрика
// переводится в шкалу 0–1: 0 — как у типичной человеческой работы выборки,
// 1 — как у типичного ИИ-текста (медианы групп). Итог — среднее метрик.
// =============================================================================

const STYLE_METRICS = [
  { key: 'hdd',    name: 'Разнообразие словаря (HD-D)',     human: 0.885, ai: 0.93, digits: 3 },
  { key: 'mtld',   name: 'Лексическое разнообразие (MTLD)', human: 130,   ai: 270,  digits: 0 },
  { key: 'yule',   name: 'Концентрация повторов (K Юла)',   human: 80,    ai: 43,   digits: 0 }
];
// Доля служебных слов и запятые на предложение тоже разделяли выборку, но
// это признаки жанра, а не ИИ: в открытом наборе AINL-Eval 2025 человеческие
// научные аннотации по ним такие же, как ИИ-статьи (служебных 0.188 против
// 0.175, запятых 1.36 против 1.17), а от курсовых далеки (0.25 и 2.25).
// С ними модель назвала бы ИИ любую научную статью, написанную человеком.
// Пороги вердикта. Подняты по сравнению с прежними 30/55: самая «гладкая»
// человеческая курсовая при проверке вне настройки получила 34%.
const AI_VERDICT_MIXED = 40;   // ниже — «человек»
const AI_VERDICT_AI = 65;      // от этого значения — «ИИ»
const STYLE_CHUNK_WORDS = 300;
const aiVerdictFor = score => score < AI_VERDICT_MIXED ? 'human' : score < AI_VERDICT_AI ? 'mixed' : 'ai';

// Основной текст: до заголовка списка литературы, без титульного листа,
// заголовков, строк оглавления, аннотации и ключевых слов. Именно на нём
// проводилась калибровка: список литературы и титульный лист сдвигают метрики.
function mainBodyText(text){
  const paras = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const biblio = /^(список\s+(использован\p{L}*\s+)?(источников|литературы)|библиографическ\p{L}*\s+список|литература\s*:?$)/iu;
  const isToc = t => /[….]{3,}|\d\s*$/.test(t);
  let cut = -1;
  paras.forEach((p, i) => { if(p.length < 120 && !isToc(p) && biblio.test(p)) cut = i; });
  const body = (cut > 0 ? paras.slice(0, cut) : paras)
    .filter(p => p.length >= 80 && !isToc(p) && !/^(аннотация|ключевые слова)/i.test(p))
    .join('\n');
  // Если фильтр съел почти всё (текст вставлен без абзацев или разбит на
  // короткие строки, как при копировании из PDF), берём текст целиком
  return tokenize(body).length >= Math.max(100, tokenize(text).length * 0.4) ? body : text;
}

// Куски по ~300 слов из целых предложений; короткий хвост — к последнему куску
function styleChunks(text){
  const chunks = [];
  let current = [], words = 0;
  for(const s of splitSentences(text)){
    current.push(s);
    words += tokenize(s).length;
    if(words >= STYLE_CHUNK_WORDS){ chunks.push(current.join(' ')); current = []; words = 0; }
  }
  if(current.length){
    if(chunks.length && words < STYLE_CHUNK_WORDS / 2) chunks[chunks.length - 1] += ' ' + current.join(' ');
    else chunks.push(current.join(' '));
  }
  return chunks;
}

function styleMetricsOf(text){
  const tokens = tokenize(text);
  const lemmas = tokens.map(pseudoLemma);
  return {
    hdd: hdd(lemmas) || null,
    mtld: mtld(lemmas) || null,
    yule: tokens.length >= 50 ? yuleK(lemmas) : null,
  };
}

// Оценка стиля 0–1 и значения метрик (медианы по кускам)
function styleScore(text){
  const chunks = styleChunks(text);
  const perChunk = chunks.map(styleMetricsOf);
  const median = values => {
    const s = values.filter(v => v != null && Number.isFinite(v)).sort((a, b) => a - b);
    return s.length ? s[Math.floor(s.length / 2)] : null;
  };
  const metrics = STYLE_METRICS.map(m => {
    const value = median(perChunk.map(p => p[m.key]));
    const v = value == null ? null : Math.max(0, Math.min(1, (value - m.human) / (m.ai - m.human)));
    return { ...m, value, v };
  });
  const used = metrics.filter(m => m.v != null);
  return {
    score: used.length ? used.reduce((s, m) => s + m.v, 0) / used.length : 0,
    metrics,
    used: used.length,
    chunks: chunks.length
  };
}

const formatStyleValue = (m, v) => v == null ? '—'
  : m.percent ? (v * 100).toFixed(1) + '%' : v.toFixed(m.digits);

// =============================================================================

// Последняя рекомендация в любом отчёте — и в локальном, и в API-режиме
const REPORT_DISCLAIMER = 'Это предварительная оценка. Для официальной защиты ВКР используйте систему проверки вашего вуза.';

function localAnalyze(text){
  // 0. ПОДГОТОВКА — токенизация, разбивка на предложения, базовые подсчёты
  const tokens = tokenize(text);
  const sentences = splitSentences(text);
  const wordCount = tokens.length || 1;
  const charCount = text.length;
  const sentenceCount = sentences.length || 1;
  // Число страниц — по средней плотности текста курсовых и ВКР (CHARS_PER_PAGE)
  const pages = Math.max(1, Math.ceil(charCount / CHARS_PER_PAGE));

  // ДЕТЕКТОР ПОДОЗРИТЕЛЬНОСТИ — делается первым, потому что обнаружение
  // манипуляций важнее самих метрик. Если документ модифицирован, остальной
  // анализ менее достоверен, и пользователь должен это знать.
  const suspicious = scanSuspicious(text);

  // 1. BURSTINESS — стандартное отклонение длин предложений / средняя длина.
  // У человека предложения сильно варьируются по длине (где-то короткие,
  // где-то развёрнутые), у ИИ длины более однородные. Это главная метрика.
  const sentenceLengths = sentences.map(s => tokenize(s).length);
  const avgLength = sentenceLengths.reduce((a, b) => a + b, 0) / sentenceCount;
  const variance = sentenceLengths.reduce((sum, len) => sum + (len - avgLength) ** 2, 0) / sentenceCount;
  const stdDev = Math.sqrt(variance);
  const burstiness = stdDev / (avgLength || 1);

  // 2. MATTR — Moving Average Type-Token Ratio. Считаем долю уникальных
  // лемм в скользящем окне (50 слов), потом усредняем. Это лучше обычного TTR,
  // потому что TTR сильно зависит от длины текста.
  const window = Math.min(50, tokens.length);
  let mattrSum = 0, mattrCount = 0;
  if(tokens.length >= window){
    for(let i = 0; i <= tokens.length - window; i += 10){
      const chunk = tokens.slice(i, i + window);
      const uniqueLemmas = new Set(chunk.map(t => pseudoLemma(t)));
      mattrSum += uniqueLemmas.size / window;
      mattrCount++;
    }
  }
  const mattr = mattrCount ? mattrSum / mattrCount : 0;
  // Простой TTR для совместимости с отчётом
  const ttr = new Set(tokens.map(t => pseudoLemma(t))).size / wordCount;

  // 3. ПЛОТНОСТЬ МАРКЕРОВ ИИ — находим в тексте характерные ИИ-клише
  // Плотность — взвешенная: сильное клише = 1, обычная научная связка = 0.2
  const markers = countMarkers(text, AI_MARKERS);
  const markerDensity = markers.score / (wordCount / 100); // на 100 слов
  // Отдельно — только сильные клише. В семи юридических курсовых и статьях
  // их было 0–0.02 на 100 слов, в текстах в манере нейросетей — 9–12.
  const strongClicheDensity = markers.hits.filter(h => h.weight >= MARKER_STRONG).length / (wordCount / 100);
  // Самые частые найденные маркеры — для пояснения на вкладке «ИИ-анализ»
  const markerTop = Object.values(markers.hits.reduce((acc, h) => {
    acc[h.text] = acc[h.text] || { text: h.text, count: 0, strong: h.weight >= MARKER_STRONG };
    acc[h.text].count++;
    return acc;
  }, {})).sort((a, b) => (b.strong - a.strong) || (b.count - a.count)).slice(0, 12);

  // 7. FLESCH-KINCAID для русского по формуле Оборнева:
  // FRE_ru = 206.835 − 1.52·ASL − 65.14·ASW
  // ASL — средняя длина предложения в словах
  // ASW — среднее число слогов в слове (приближаем числом гласных)
  const russianVowels = /[аеёиоуыэюяaeiouy]/gi;
  const totalSyllables = tokens.reduce((sum, t) => sum + (t.match(russianVowels) || []).length, 0);
  const averageSyllablesPerWord = totalSyllables / wordCount;
  const averageSentenceLength = wordCount / sentenceCount;
  const fleschRu = 206.835 - 1.52 * averageSentenceLength - 65.14 * averageSyllablesPerWord;

  // ИИ-ОЦЕНКА ПО СТИЛЮ — откалиброванные метрики (см. STYLE_METRICS)
  const body = mainBodyText(text);
  const bodyWords = tokenize(body).length;
  const style = styleScore(body);
  let aiScore = Math.min(95, Math.round(style.score * 100));
  // Нижняя граница по клише: больше одного сильного клише на 100 слов — в 50
  // раз больше, чем в любой из проверенных человеческих работ. В реальных
  // ИИ-текстах выборки клише не встретилось ни одного, так что правило ловит
  // только самый небрежный ИИ-текст, зато людям не вредит.
  const CLICHE_FLOOR_DENSITY = 1;
  const clicheFloor = strongClicheDensity >= CLICHE_FLOOR_DENSITY && aiScore < AI_VERDICT_AI;
  if(clicheFloor) aiScore = AI_VERDICT_AI;
  // На коротком тексте статистика слов ненадёжна — честно предупреждаем
  const AI_MIN_WORDS = 300;
  const aiReliable = bodyWords >= AI_MIN_WORDS;
  const aiFeatures = style.metrics.map(m => ({
    name: m.name,
    value: formatStyleValue(m, m.value),
    rule: `у людей ≈ ${formatStyleValue(m, m.human)}, у ИИ ≈ ${formatStyleValue(m, m.ai)}`,
    weight: style.used ? Math.round(100 / style.used) : 0,
    score: m.v == null ? null : Math.round(m.v * 100),
    // Сколько процентных пунктов итога дала метрика
    contribution: m.v == null ? 0 : Math.round(m.v / style.used * 1000) / 10
  }));
  const aiVerdict = aiVerdictFor(aiScore);

  // ЦИТИРОВАНИЕ — ищем кавычки и ГОСТ-ссылки [N], [N, с. NN]
  const quoteMatches = [...text.matchAll(/[«"][^«»""]{15,500}[»"]/g)];
  const gostCitations = (text.match(/\[\d+(?:\s*,\s*с\.?\s*\d+)?(?:\s*[;,]\s*\d+)*\]/g) || []).length;
  const citationChars = quoteMatches.reduce((sum, m) => sum + m[0].length, 0);
  const citationPercent = Math.min(25, Math.round((citationChars / charCount) * 100 * 10) / 10);

  // ШАБЛОННОСТЬ — повторы шинглов внутри самого текста. Это стилистический
  // признак, а не заимствование: раньше он выдавался за «процент заимствований».
  // Настоящие заимствования считает сравнение с источниками (applySourceMatches),
  // поэтому локально заимствований 0%, пока источники не проверены.
  const lemmaTokens = tokens.filter(t => !STOP_RU.has(t)).map(pseudoLemma);
  const shingles3 = getShingles(lemmaTokens, 3);
  let repeatedShingles = 0;
  shingles3.forEach(v => { if(v > 1) repeatedShingles += v - 1; });
  const shingleRepRate = repeatedShingles / (shingles3.size || 1);

  const originalityPercent = Math.max(0, Math.round((100 - citationPercent) * 10) / 10);

  // ФРАГМЕНТЫ С РАЗМЕТКОЙ — разбиваем текст на чанки и классифицируем каждый
  const fragments = [];
  const fragmentSize = Math.max(2, Math.ceil(sentenceCount / 15));
  for(let i = 0; i < sentenceCount && fragments.length < 18; i += fragmentSize){
    const chunk = sentences.slice(i, Math.min(i + fragmentSize, sentenceCount)).join(' ').trim();
    if(chunk.length < 30) continue;

    const chunkTokens = tokenize(chunk);
    const chunkUniqueLemmas = new Set(chunkTokens.map(t => pseudoLemma(t)));
    const chunkTtr = chunkUniqueLemmas.size / (chunkTokens.length || 1);
    const chunkStrongHits = countMarkers(chunk, AI_MARKERS).hits.filter(h => h.weight >= MARKER_STRONG);
    // Оценка стиля фрагмента — только если в нём хватает слов для статистики
    const chunkStyle = chunkTokens.length >= 150 ? styleScore(chunk) : null;
    const chunkHasQuote = /[«"][^«»""]{15,}[»"]/.test(chunk) || /\[\d+/.test(chunk);
    const chunkShingleTokens = chunkTokens.filter(t => !STOP_RU.has(t)).map(pseudoLemma);
    const chunkShingles = getShingles(chunkShingleTokens, 3);
    let chunkRepeats = 0;
    chunkShingles.forEach(v => { if(v > 1) chunkRepeats += v - 1; });
    const chunkRepRate = chunkRepeats / (chunkShingles.size || 1);

    // Уверенность считается из силы признака, без случайных добавок:
    // один и тот же текст обязан давать один и тот же отчёт.
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));
    let type = 'original';
    // Чем разнообразнее словарь фрагмента, тем увереннее, что он оригинален
    let confidence = clamp(65 + (chunkTtr - 0.5) * 80, 65, 85);
    let explanation = 'Фрагмент выглядит оригинальным';
    let source = null;

    if(chunkHasQuote){
      type = 'citation';
      confidence = 85;
      explanation = 'Содержит корректное оформление цитаты';
    } else if(chunkStyle && chunkStyle.score * 100 >= AI_VERDICT_AI){
      // Та же откалиброванная оценка стиля, что и для всего документа
      type = 'ai_generated';
      confidence = clamp(chunkStyle.score * 100, 65, 90);
      const closest = chunkStyle.metrics.filter(m => m.v != null).sort((a, b) => b.v - a.v).slice(0, 2)
        .map(m => m.name[0].toLowerCase() + m.name.slice(1));
      explanation = 'Стиль фрагмента похож на ИИ-тексты: ' + closest.join(', ');
    } else if(chunkStrongHits.length >= 2){
      type = 'ai_generated';
      confidence = clamp(55 + (chunkStrongHits.length - 2) * 5, 55, 75);
      explanation = 'Обнаружены характерные ИИ-клише: ' + chunkStrongHits.slice(0, 3).map(h => h.text).join(', ');
    } else if(chunkRepRate > 0.15){
      // Повторы внутри текста — не заимствование, а шаблонность стиля
      explanation = 'Повторяющиеся речевые шаблоны (высокая шаблонность)';
    }

    fragments.push({
      text: chunk.slice(0, 350),
      type,
      confidence,
      source,
      explanation,
      page: Math.min(pages, Math.ceil((i + 1) / Math.max(1, sentenceCount / pages)))
    });
  }

  return {
    originality_percent: originalityPercent,
    borrowed_percent: 0,
    citation_percent: citationPercent,
    ai_generated_percent: Math.round(aiScore),
    self_citation_percent: 0, // Самоцитирование детектируется только при наличии данных автора
    total_words: wordCount,
    total_chars: charCount,
    total_sentences: sentenceCount,
    total_pages: pages,
    ai_verdict: aiVerdict,
    // Уверенность ниже на коротких текстах: статистике там не на что опереться
    // Чем дальше итог от середины между порогами, тем увереннее вердикт
    ai_confidence: aiReliable
      ? Math.min(90, 50 + Math.round(Math.abs(aiScore - (AI_VERDICT_MIXED + AI_VERDICT_AI) / 2) * 0.8))
      : Math.min(40, 20 + Math.floor(bodyWords / 15)),
    ai_reliable: aiReliable,
    ai_features: aiFeatures,
    ai_raw_score: Math.round(style.score * 100),
    ai_cliche_floor: clicheFloor,
    ai_local_percent: aiScore,
    ai_strong_cliches: Math.round(strongClicheDensity * 100) / 100,
    ai_markers: markerTop,
    fragments,
    suspicious, // Результаты детектора подозрительности
    // Источники появятся после поиска по базам (runAnalysis)
    sources: [],
    ai_analysis: {
      perplexity_score: burstiness < 0.3 ? 'low' : 'medium',
      burstiness_score: burstiness < 0.3 ? 'low' : burstiness < 0.5 ? 'medium' : 'high',
      uniformity_score: burstiness < 0.35 ? 'high' : burstiness < 0.5 ? 'medium' : 'low',
      vocabulary_diversity: mattr < 0.6 ? 'low' : mattr < 0.72 ? 'medium' : 'high',
      sentence_length_variance: stdDev < 5 ? 'low' : stdDev < 10 ? 'medium' : 'high',
      details: `Оценка ИИ-генерации — по ${style.used} метрикам стиля, откалиброванным на 9 размеченных ` +
        `работах (без обращения к серверу). Основной текст — ${bodyWords} слов, кусков по ` +
        `${STYLE_CHUNK_WORDS} слов: ${style.chunks}. ` +
        `Справочно: MATTR = ${(mattr * 100).toFixed(1)}%, вариативность длины предложений = ${burstiness.toFixed(2)}, ` +
        `Flesch-Kincaid (русский) = ${fleschRu.toFixed(1)}. ` +
        (aiScore >= AI_VERDICT_AI ? 'Стиль ближе к ИИ-текстам выборки, чем к человеческим работам.' :
         aiScore >= AI_VERDICT_MIXED ? 'Часть признаков стиля похожа на ИИ-тексты.' :
         'Стиль похож на человеческие работы выборки.')
    },
    recommendations: [
      aiReliable ? null
        : `Основной текст короче ${AI_MIN_WORDS} слов (${bodyWords}): оценка ИИ-генерации по стилю на таком объёме ненадёжна.`,
      aiScore >= AI_VERDICT_AI
        ? 'Стиль текста похож на тексты, написанные ИИ: словарь богаче, повторов, служебных слов и запятых меньше, чем в типичных курсовых. Это не доказательство — калибровка предварительная. Если ИИ использовался, это стоит согласовать с руководителем.'
        : aiScore >= AI_VERDICT_MIXED
        ? 'Отдельные признаки стиля похожи на ИИ-тексты. Само по себе это ничего не доказывает.'
        : 'По стилю текст похож на работы, написанные людьми.',
      shingleRepRate > 0.3
        ? 'Много повторяющихся оборотов. Переформулируйте их, чтобы текст читался живее.'
        : 'Уровень шаблонности в пределах нормы.',
      suspicious.suspiciousScore > 0.05
        ? 'Обнаружены признаки манипуляций с текстом (гомоглифы или невидимые символы). Антиплагиат.ВУЗ помечает такие документы как подозрительные. Удалите эти символы перед сдачей.'
        : null,
      REPORT_DISCLAIMER
    ].filter(Boolean)
  };
}

// AI-ПРОВАЙДЕРЫ. Список облачных LLM, к которым приложение может обращаться
// для углублённого анализа. Все они имеют OpenAI-совместимый формат API,
// поэтому код обращения к ним почти одинаковый.
//
// Главный критерий выбора — доступность из России без VPN в апреле 2026.
// Цены и лимиты актуальны на момент создания приложения.
// =============================================================================

// Ключ — пользователя: хранится только в его браузере и уходит только своему
// провайдеру. GigaChat убран: ему нужен обмен ключа на токен, а прямые
// запросы из браузера закрыты CORS — из сайта он не работал.
const PROVIDERS = {
  'groq': {

    model: 'llama-3.3-70b-versatile',

  },
  'openrouter': {
    name: 'OpenRouter',
    url: 'https://openrouter.ai/api/v1/chat/completions',
    model: 'meta-llama/llama-3.3-70b-instruct:free',
    keyHint: 'Ключ — на <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai</a>.'
  },
  'mistral': {
    name: 'Mistral',
    url: 'https://api.mistral.ai/v1/chat/completions',
    model: 'mistral-large-latest',
