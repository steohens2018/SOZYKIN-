function groupWorkRow(w, i){
  const verdict = { human: ['Человек', 'var(--grn)'], mixed: ['Смешанный', 'var(--amb)'], ai: ['ИИ', 'var(--ap-ai)'] }[w.ai.verdict];
  const fmt = w.formatFailed == null ? '' : w.formatFailed.length
    ? ` · <span style="color:var(--red)">оформление: ${escapeHtml(w.formatFailed.join(', '))}</span>`
    : ' · <span style="color:var(--grn)">оформление в порядке</span>';
  return `<div class="req">
    <div class="req-i" style="color:var(--dim)">${i + 1}</div>
    <div class="req-b">
      <div class="req-l">${escapeHtml(w.name)}</div>
      <div class="req-v">${escapeHtml(w.words.toLocaleString('ru'))} слов · ИИ по стилю:
        <span style="color:${verdict[1]}">${escapeHtml(w.ai.percent)}% (${verdict[0]}${w.ai.reliable ? '' : ', ненадёжно'})</span>${fmt}</div>
    </div>
    <button class="gw-del" data-i="${i}" title="Убрать" style="background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:0 4px">×</button>
  </div>`;
}

async function addGroupFiles(files){
  if(!files.length || G.busy) return;
  G.busy = true; G.results = null; renderGroup();
  const errors = [];
  for(const file of files){
    if(G.works.length >= GROUP_MAX_WORKS){ errors.push(`Больше ${GROUP_MAX_WORKS} работ за раз не сравниваем`); break; }
    try{
      const text = (await readFile(file)).replace(/\r\n/g, '\n').replace(/ /g, ' ').trim();
      const body = mainBodyText(text);
      const analysis = localAnalyze(text);
      let formatFailed = null;
      if(file.name.toLowerCase().endsWith('.docx')){
        try{
          const f = await checkDocxFormatting(await file.arrayBuffer());
          const req = requirementChecks({ work_type: S.workType, formatting: f, borrowed_percent: 0 });
          const rows = req ? req.rows : f.checks;
          formatFailed = rows.filter(r => r.ok === false).map(r => r.label.toLowerCase());
        }catch(e){ formatFailed = null; }
      }
      G.works.push({
        name: file.name, text, body, words: tokenize(body).length,
        ai: { percent: analysis.ai_local_percent, verdict: aiVerdictFor(analysis.ai_local_percent), reliable: analysis.ai_reliable },
        formatFailed
      });
    }catch(e){
      errors.push(`${file.name}: ${e.message}`);
    }
  }
  G.busy = false;
  renderGroup();
  if(errors.length){
    $('#geb').innerHTML = errors.map(e => `<div class="err">${escapeHtml(e)}</div>`).join('');
  }
}

// Сравнение: для каждой работы — один вызов findMatches, где источники —
// все остальные работы группы. Каждое совпавшее предложение относится
// к одной, самой похожей работе.
async function runGroupComparison(){
  if(G.works.length < 2 || G.busy) return;
  G.busy = true;
  const go = $('#gGo');
  const pairs = new Map();   // "i-j" (i < j) → { i, j, shareIJ, shareJI, examples }
  for(let i = 0; i < G.works.length; i++){
    if(go) go.textContent = `Сравнение… ${i + 1} из ${G.works.length}`;
    await new Promise(r => setTimeout(r, 0));   // даём браузеру перерисовать кнопку
    const others = G.works.map((w, k) => ({ k, title: w.name, sourceName: 'группа', text: w.body })).filter(o => o.k !== i);
    const matches = findMatches(G.works[i].body, others);
    const chars = new Map();
    for(const m of matches){
      const j = others[m.sourceIndex].k;
      const key = i < j ? `${i}-${j}` : `${j}-${i}`;
      if(!pairs.has(key)) pairs.set(key, { i: Math.min(i, j), j: Math.max(i, j), shareIJ: 0, shareJI: 0, examples: [] });
      const pair = pairs.get(key);
      if(!m.cited) chars.set(j, (chars.get(j) || 0) + m.text.length);
      if(pair.examples.length < 8) pair.examples.push({ from: i, to: j, doc: m.text, excerpt: m.excerpt, kind: m.kind, cited: m.cited });
    }
    const len = G.works[i].body.length || 1;
    for(const [j, c] of chars){
      const pair = pairs.get(i < j ? `${i}-${j}` : `${j}-${i}`);
      const share = Math.round(c / len * 1000) / 10;
      if(i === pair.i) pair.shareIJ = share; else pair.shareJI = share;
    }
  }
  const list = [...pairs.values()].sort((a, b) => Math.max(b.shareIJ, b.shareJI) - Math.max(a.shareIJ, a.shareJI));
  G.results = { pairs: list, total: G.works.length * (G.works.length - 1) / 2 };
  G.busy = false;
  renderGroup();
  const res = $('#gRes');
  if(res) res.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function groupResultsHtml(res){
  const w = G.works;
  const label = i => `${i + 1}. ${escapeHtml(w[i].name)}`;
  const color = p => p >= 15 ? 'var(--red)' : p >= 5 ? 'var(--amb)' : 'var(--dim)';
  return `<div class="card" id="gRes" style="margin-top:18px">
    <div class="card-t">Совпадения между работами</div>
    <div class="hint" style="margin-bottom:8px">Пар с совпадениями: ${res.pairs.length} из ${res.total}.
      Процент — доля основного текста одной работы, найденная в другой.</div>
    ${res.pairs.length ? res.pairs.map(p => `
    <details style="margin-bottom:8px">
      <summary>
        <div style="font-weight:600">${label(p.i)} ↔ ${label(p.j)}</div>
        <div style="font-size:12px;font-weight:500;margin-top:4px">
          <span style="color:${color(p.shareIJ)}">${escapeHtml(p.shareIJ)}% работы ${p.i + 1}</span> ·
          <span style="color:${color(p.shareJI)}">${escapeHtml(p.shareJI)}% работы ${p.j + 1}</span>
        </div>
      </summary>
      <div class="det-b">${p.examples.map(e => `
        <div class="match${e.cited ? ' cited' : ''}" style="margin-left:0">
          <div class="match-doc">${e.from + 1}: «${escapeHtml(e.doc)}»</div>
          <div class="match-src">↳ ${e.to + 1}: «${escapeHtml(e.excerpt)}»</div>
          <div class="match-k">${e.cited ? 'цитата с оформлением' : e.kind === 'exact' ? 'совпадение' : 'пересказ'}</div>
        </div>`).join('')}
      </div>
    </details>`).join('') : '<div class="hint">Совпадений между работами не найдено.</div>'}
  </div>`;
}

// Переключение режимов по адресу: #group — работы группы, иначе — проверка одной работы
function route(){
  handlePollinationsReturn();
  const mode = location.hash === '#group' ? 'group' : 'check';
  $$('.nav-a[data-mode]').forEach(a => a.classList.toggle('on', a.dataset.mode === mode));
  if(mode === 'group') renderGroup();
  else if(S.res) renderResult();
  else renderHome();
  window.scrollTo(0, 0);
}

// =============================================================================
// SERVICE WORKER — офлайн-режим и установка на телефон.
//
// Сам воркер — отдельный файл sw.js рядом со страницей. Прежний вариант
// создавал его из blob-ссылки, а браузеры такие воркеры не регистрируют.
// =============================================================================

function registerServiceWorker(){
  // Воркер — отдельный файл sw.js рядом со страницей. Нужен https (или localhost).
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  navigator.serviceWorker.register('sw.js').catch(e =>
    console.warn('Service Worker registration failed:', e)
  );
}

// =============================================================================
// ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ.
//
// Запускается при загрузке страницы. Восстанавливает черновик из localStorage
// (если он не старше 24 часов), запускает Service Worker для оффлайн-работы,
// настраивает командную палитру и отрисовывает главный экран.
// =============================================================================

function initApp(){
  // Сохранённый тип работы мог устареть (переименовали или удалили профиль).
  // Проверка здесь, а не рядом с S: WORK_TYPES объявлена ниже по файлу.
  if(!WORK_TYPES[S.workType]) S.workType = 'none';
  // Провайдер мог быть удалён из списка (например, GigaChat) — сбрасываем выбор
  if(S.apiProvider !== 'none' && !PROVIDERS[S.apiProvider]) S.apiProvider = 'none';

  // Восстановление черновика из предыдущей сессии
  const draft = loadDraft();
  if(draft && !S.text){
    S.text = draft.text;
    S.fn = draft.fn || '';
  }

  // Регистрация Service Worker для оффлайн-работы
  registerServiceWorker();

  // Отрисовка нужного режима: проверка одной работы или работы группы
  window.addEventListener('hashchange', route);
  route();

  // Настройка командной палитры удалена в версии 7.2

  // Уведомление о восстановлении черновика, если он был
  if(draft){
    setTimeout(() => {
      const errorBox = $('#eb');
      if(errorBox){
        errorBox.innerHTML = `<div class="info">Восстановлен черновик от ${new Date(draft.t).toLocaleString('ru-RU')}. <a href="javascript:void(0)" onclick="localStorage.removeItem('sp_draft_v7');location.reload()">Очистить</a></div>`;
      }
    }, 300);
  }
}

// Запуск приложения когда DOM готов
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}

</script>
