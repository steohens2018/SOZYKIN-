<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>SOZYKIN Плагиат — проверка оригинальности и ИИ-детекция</title>
<meta name="description" content="Профессиональная проверка работ на оригинальность, заимствования и ИИ-контент. Поддержка PDF, DOCX, TXT. Работает из России без VPN.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOZYKIN">
<meta name="mobile-web-app-capable" content="yes">

<!-- Иконки и манифест — общие для всех страниц сайта (папка icons/).
     Манифест и sw.js дают установку на телефон и работу без сети. -->
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<!-- Inter — шрифт уровня премиум-SaaS (используется в Linear, Vercel, Stripe).
     JetBrains Mono — для цифр и кода, имеет идеальные табличные пропорции. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Библиотеки парсинга документов. PDF.js извлекает текст из PDF,
     mammoth — из DOCX. Подгружаются с CDN Cloudflare, доступного в РФ. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ДИЗАЙН-ТОКЕНЫ. Здесь определены все цвета, размеры и тени приложения.
   Менять их — значит менять весь визуальный язык одним изменением.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  /* Поверхности — глубокий чёрный с холодным оттенком. Не «голый» #000,
     а едва тёплый от добавления синего канала, чтобы не давить на глаза. */
  --bg:#000000;          /* Истинно чёрный фон — экономит батарею на OLED-экранах */
  --s1:#0a0a0f;          /* Карточка 1-го уровня — основные блоки */
  --s2:#13131a;          /* Карточка 2-го уровня — вложенные элементы */
  --s3:#1c1c26;          /* Hover-состояние и активные элементы */
  --brd:#1f1f2c;         /* Границы — едва заметные, чтобы не дробить интерфейс */
  --brd2:#2a2a3a;        /* Активные/hover границы */

  /* Текст — белый с разной прозрачностью. Чистый белый на чёрном утомляет
     глаза при длительном чтении, поэтому используем 92%, как делает Apple. */
  --txt:rgba(255,255,255,.92);   /* Основной текст */
  --txt2:rgba(255,255,255,.72);  /* Вторичный текст */
  --dim:rgba(255,255,255,.52);   /* Подписи, метки */
  --mut:rgba(255,255,255,.32);   /* Декоративные элементы */

  /* Синий акцент — два уровня. Главный (Apple System Blue #0A84FF) для CTA,
     светлее (#3D8BFF) для hover, тёмный (#0050C8) для глубины и теней. */
  --acc:#0A84FF;
  --acc2:#3D8BFF;
  --accD:#0050C8;
  --accS:rgba(10,132,255,.12);    /* Полупрозрачный фон для подсветки */
  --accB:rgba(10,132,255,.32);    /* Граница активного элемента */

  /* Семантические цвета по гайдам Apple — приглушённые, не «кислотные» */
  --grn:#30D158;          /* Успех, оригинальность */
  --grnS:rgba(48,209,88,.12);
  --red:#FF453A;          /* Заимствования, ошибка */
  --redS:rgba(255,69,58,.12);
  --pur:#BF5AF2;          /* ИИ-контент */
  --purS:rgba(191,90,242,.12);
  --amb:#FFD60A;          /* Цитирование, предупреждения */
  --ambS:rgba(255,214,10,.12);
  --org:#FF9F0A;          /* Самоцитирование */
  --orgS:rgba(255,159,10,.12);

  /* Glassmorphism для оверлеев — модальные окна, командная палитра */
  --glass:rgba(255,255,255,.04);
  --glass-brd:rgba(255,255,255,.08);
  --shadow-lg:0 24px 60px -10px rgba(0,0,0,.8);
  --shadow-md:0 8px 24px -4px rgba(0,0,0,.5);

  /* Антиплагиат-совместимая палитра для разметки отчёта.
     Эти цвета точно соответствуют тем, что использует Антиплагиат.ВУЗ,
     чтобы пользователь видел знакомую визуальную схему. */
  --ap-orig:#30D158;       /* Зелёный — оригинал */
  --ap-cite:#58B5F2;       /* Голубой — корректное цитирование */
  --ap-self:#FF9F0A;       /* Оранжевый — самоцитирование */
  --ap-borrow:#FF453A;     /* Красный — заимствования */
  --ap-suspicious:#FFD60A; /* Жёлтый — подозрительный документ */
  --ap-ai:#BF5AF2;         /* Розовый/фиолетовый — AI-сгенерированно */
}

/* ═══════════════════════════════════════════════════════════════════════════
   БАЗОВЫЕ СТИЛИ. Сброс отступов, антиалиасинг шрифтов, плавные переходы.
   ═══════════════════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
html{
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  line-height:1.5;
  min-height:100vh;
  letter-spacing:-.011em;       /* Лёгкое сжатие межбуквенного для большего веса */
  font-feature-settings:"cv11","ss01","ss03"; /* Альтернативные глифы Inter */
  /* Учитываем «безопасные зоны» iPhone с челкой/Dynamic Island */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
::selection{background:var(--accB);color:#fff}

.m{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-feature-settings:"tnum","zero"; /* Табличные цифры и зачёркнутый ноль */
}

a{color:var(--acc);text-decoration:none;transition:color .15s ease}
a:hover{color:var(--acc2)}

button{
  font-family:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent; /* Убираем синюю подсветку на мобильных */
}

input,textarea,select{font-family:inherit;font-size:14px}

/* ═══════════════════════════════════════════════════════════════════════════
   АНИМАЦИИ. Все ключевые анимации приложения. Используются по необходимости.
   ═══════════════════════════════════════════════════════════════════════════ */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glow{
  0%,100%{box-shadow:0 0 24px rgba(10,132,255,.2)}
  50%{box-shadow:0 0 36px rgba(10,132,255,.45)}
}

/* Уважаем настройку «Уменьшить движение» в системных настройках */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   ШАПКА (HEADER). Закреплена сверху, прозрачная с blur — стиль Apple/Linear.
   ═══════════════════════════════════════════════════════════════════════════ */
.hdr{
  border-bottom:1px solid var(--brd);
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  position:sticky;
  top:0;
  z-index:50;
}
.hdr-l{display:flex;align-items:center;gap:12px}
.hdr-r{display:flex;align-items:center;gap:4px}
.nav-a{color:var(--txt2);font-size:13px;font-weight:500;padding:7px 10px;border-radius:9px;text-decoration:none}
.nav-a:hover{color:var(--txt);background:var(--s2)}
.nav-a.on{color:var(--acc);background:var(--accS)}
@media(max-width:400px){.nav-a{padding:7px 7px;font-size:12px}.hdr .sub{display:none}}
/* Название в одну строку — только там, где хватает места рядом с меню */
@media(min-width:421px){.brand{white-space:nowrap}}

/* Логотип — стилизованная галочка в круге, символизирующая «проверено».
   Круглая форма даёт премиальное ощущение, в отличие от квадратного логотипа.
   SVG-иконка сохраняет идеальную чёткость на любом разрешении экрана. */
.lg{
  width:42px;height:42px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #3D8BFF 0%, #0A84FF 50%, #0050C8 100%);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 4px 16px rgba(10,132,255,.45),
    0 0 0 1px rgba(10,132,255,.3),
    inset 0 1px 0 rgba(255,255,255,.25);
  flex-shrink:0;
}
/* Глянцевая подсветка сверху для эффекта объёмного стекла */
.lg::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:50%;
  background:linear-gradient(180deg, rgba(255,255,255,.25) 0%, transparent 100%);
  pointer-events:none;
}
/* SVG-галочка внутри логотипа */
.lg svg{
  width:22px;
  height:22px;
  fill:#fff;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.3));
  position:relative;
  z-index:1;
}

.brand{
  font-size:15px;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--txt);
}
.sub{
  font-size:9px;
  color:var(--dim);
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-top:2px;
  font-weight:500;
}
.ver{
  font-size:11px;
  color:var(--mut);
  font-weight:500;
  font-family:'JetBrains Mono',monospace;
  padding:4px 10px;
  background:var(--s2);
  border:1px solid var(--brd);
  border-radius:8px;
}

/* Иконка-кнопка для командной палитры в шапке */
.icon-btn{
  width:36px;height:36px;
  border-radius:10px;
  border:1px solid var(--brd);
  background:var(--s1);
  color:var(--txt2);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
  transition:all .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.icon-btn:hover{border-color:var(--brd2);color:var(--txt);background:var(--s2)}
.icon-btn:active{background:var(--s3)}

/* ═══════════════════════════════════════════════════════════════════════════
   ОСНОВНОЙ LAYOUT. Контейнер с максимальной шириной, отступы для мобильных.
   ═══════════════════════════════════════════════════════════════════════════ */
.wrap{
  max-width:920px;
  margin:0 auto;
  padding:20px 14px 56px;
}

.card{
  background:var(--s1);
  border:1px solid var(--brd);
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
  animation:fadeIn .4s ease;
  transition:border-color .2s ease;
}
.card:hover{border-color:var(--brd2)}

.card-hd{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.card-t{
  font-size:12px;
  font-weight:600;
  color:var(--dim);
  text-transform:uppercase;
  letter-spacing:.08em;
}

/* ═══════════════════════════════════════════════════════════════════════════
   HERO — главный заголовок страницы с градиентным текстом и сиянием сзади.
   ═══════════════════════════════════════════════════════════════════════════ */
.hero{
  text-align:center;
  padding:36px 14px 24px;
  position:relative;
}
/* Светящееся пятно сзади создаёт ощущение объёма и премиум-стиля */
.hero::before{
  content:'';
  position:absolute;
  top:0;left:50%;
  transform:translateX(-50%);
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(10,132,255,.14) 0%,transparent 70%);
  pointer-events:none;
  z-index:0;
}
.hero-t{
  font-size:36px;
  font-weight:800;
  letter-spacing:-.04em;
  /* Градиент от чисто-белого вверху к светло-синему внизу даёт «свечение» */
  background:linear-gradient(180deg,#ffffff 0%,#a0c4ff 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.05;
  position:relative;
  z-index:1;
}
.hero-s{
  font-size:14px;
  color:var(--dim);
  margin-top:8px;
  font-weight:400;
  letter-spacing:-.005em;
  position:relative;
  z-index:1;
}
.chips{
  display:flex;
  justify-content:center;
  gap:6px;
  flex-wrap:wrap;
  margin-top:14px;
  position:relative;
  z-index:1;
}
.chip{
  font-size:11px;
  padding:5px 11px;
  border-radius:20px;
  border:1px solid;
  font-weight:500;
  letter-spacing:-.005em;
}

/* ═══════════════════════════════════════════════════════════════════════════
   DROP ZONE — область загрузки файла. Активируется при наведении/нажатии.
   ═══════════════════════════════════════════════════════════════════════════ */
.drop{
  border:1.5px dashed var(--brd2);
  border-radius:16px;
  padding:40px 20px;
  text-align:center;
  cursor:pointer;
  background:var(--s1);
  transition:all .25s cubic-bezier(.2,.8,.2,1);
  position:relative;
  overflow:hidden;
  min-height:120px;
}
/* Внутреннее сияние при активации */
.drop::before{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 50%,rgba(10,132,255,.10),transparent 60%);
  opacity:0;
  transition:opacity .25s;
}
.drop:active::before,.drop.on::before{opacity:1}
.drop:active,.drop.on{border-color:var(--acc);background:var(--accS)}
.drop-i{font-size:48px;margin-bottom:12px;opacity:.85;position:relative;z-index:1}
.drop-t{
  font-size:15px;
  font-weight:600;
  margin-bottom:6px;
  letter-spacing:-.01em;
  position:relative;
  z-index:1;
  color:var(--txt);
}
.drop-h{
  font-size:12px;
  color:var(--dim);
  position:relative;
  z-index:1;
  font-weight:400;
}

/* ═══════════════════════════════════════════════════════════════════════════
   INPUTS — поля ввода. Тёмный фон, аккуратные радиусы, подсветка при фокусе.
   ═══════════════════════════════════════════════════════════════════════════ */
textarea{
  width:100%;
  min-height:220px;
  padding:18px;
  background:transparent;
  color:var(--txt);
  border:0;outline:0;
  font-size:15px;
  line-height:1.7;
  resize:vertical;
  font-family:inherit;
  letter-spacing:-.005em;
}
textarea::placeholder{color:var(--mut)}

.ta-wrap{
  background:var(--s1);
  border:1px solid var(--brd);
  border-radius:14px;
  overflow:hidden;
  transition:border-color .2s cubic-bezier(.2,.8,.2,1);
}
.ta-wrap:focus-within{border-color:var(--accB);box-shadow:0 0 0 4px rgba(10,132,255,.08)}

.ta-h{
  padding:12px 18px;
  border-bottom:1px solid var(--brd);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  background:rgba(255,255,255,.01);
}

input[type=email],input[type=password],input[type=text]{
  width:100%;
  padding:13px 16px;
  border-radius:12px;
  border:1px solid var(--brd);
  background:var(--s2);
  color:var(--txt);
  outline:0;
  transition:all .2s cubic-bezier(.2,.8,.2,1);
  font-weight:400;
  letter-spacing:-.005em;
  font-size:15px;
  min-height:48px;
}
input:focus{border-color:var(--acc);background:var(--s1);box-shadow:0 0 0 4px rgba(10,132,255,.08)}
input::placeholder{color:var(--mut)}

label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:8px;
  color:var(--txt2);
  text-transform:uppercase;
  letter-spacing:.06em;
}
.hint{
  font-size:12px;
  color:var(--dim);
  margin-top:8px;
  line-height:1.6;
  font-weight:400;
}

/* ═══════════════════════════════════════════════════════════════════════════
   BUTTONS — кнопки. Главная (CTA) с градиентом и сиянием, второстепенные плоские.
   ═══════════════════════════════════════════════════════════════════════════ */
.btn{
  width:100%;
  padding:16px 20px;
  border-radius:14px;
  border:0;
  font-size:15px;
  font-weight:600;
  letter-spacing:-.01em;
  transition:all .2s cubic-bezier(.2,.8,.2,1);
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
  min-height:52px;
}

/* Главная кнопка — синий градиент сверху-вниз с подсветкой и тенью.
   Эффект: кнопка как будто «парит» над поверхностью и слегка светится. */
.btn-go{
  background:linear-gradient(180deg,#0A84FF 0%,#0066CC 100%);
  color:#fff;
  box-shadow:
    0 4px 14px rgba(10,132,255,.35),
    inset 0 1px 0 rgba(255,255,255,.2);
  position:relative;
  overflow:hidden;
}
.btn-go::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.15),transparent 50%);
  pointer-events:none;
}
.btn-go:hover:not(:disabled){
  box-shadow:
    0 6px 20px rgba(10,132,255,.5),
    inset 0 1px 0 rgba(255,255,255,.25);
  transform:translateY(-1px);
}
.btn-go:active:not(:disabled){
  transform:translateY(0);
  box-shadow:
    0 2px 8px rgba(10,132,255,.3),
    inset 0 1px 0 rgba(255,255,255,.15);
}
.btn-go:disabled{
  background:var(--s2);
  color:var(--mut);
  cursor:not-allowed;
  box-shadow:none;
}

/* Вторичная кнопка — просто граница и текст, никаких градиентов */
.btn-o{
  padding:13px 16px;
  border-radius:12px;
  border:1px solid var(--brd);
  background:var(--s1);
  color:var(--txt2);
  font-size:14px;
  font-weight:500;
  letter-spacing:-.005em;
  transition:all .15s cubic-bezier(.2,.8,.2,1);
  min-height:46px;
}
.btn-o:hover{border-color:var(--accB);color:var(--txt);background:var(--s2)}
.btn-o:active{background:var(--s3);transform:scale(.98)}

/* Кнопки скачивания отчётов — цветные, но приглушённые */
.btn-dl{
  padding:13px 16px;
  border-radius:12px;
  border:1px solid rgba(48,209,88,.32);
  background:var(--grnS);
  color:var(--grn);
  font-size:14px;
  font-weight:600;
  letter-spacing:-.005em;
  transition:all .15s cubic-bezier(.2,.8,.2,1);
  min-height:46px;
}
.btn-dl:hover{
  background:rgba(48,209,88,.18);
  border-color:rgba(48,209,88,.42);
}
.btn-dl:active{transform:scale(.98)}
.btn-dl-ai{
  padding:13px 16px;
  border-radius:12px;
  border:1px solid rgba(191,90,242,.32);
  background:var(--purS);
  color:var(--pur);
  font-size:14px;
  font-weight:600;
  letter-spacing:-.005em;
  transition:all .15s cubic-bezier(.2,.8,.2,1);
  min-height:46px;
}
.btn-dl-ai:hover{
  background:rgba(191,90,242,.18);
  border-color:rgba(191,90,242,.42);
}

/* ═══════════════════════════════════════════════════════════════════════════
   УВЕДОМЛЕНИЯ — мягкие, информативные, без агрессивных красных рамок.
   ═══════════════════════════════════════════════════════════════════════════ */
.err{
  background:var(--redS);
  border:1px solid rgba(255,69,58,.28);
  border-radius:10px;
  padding:12px 16px;
  font-size:13px;
  color:#FF8A82;
  animation:fadeIn .3s;
  line-height:1.5;
}
.warn{
  background:var(--ambS);
  border:1px solid rgba(255,214,10,.28);
  border-radius:10px;
  padding:12px 16px;
  font-size:13px;
  color:#FFE564;
  line-height:1.5;
}
.info{
  background:var(--accS);
  border:1px solid var(--accB);
  border-radius:10px;
  padding:12px 16px;
  font-size:13px;
  color:#7FB7FF;
  line-height:1.5;
}

/* Toast-уведомления — всплывающие в центре снизу с blur-фоном */
.toast-host{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:8px;
  align-items:center;
  pointer-events:none;
  max-width:90vw;
}
.toast{
  background:var(--s2);
  color:var(--txt);
  padding:12px 18px;
  border-radius:14px;
  border:1px solid var(--glass-brd);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--shadow-md);
  display:flex;
  gap:10px;
  align-items:center;
  font-size:13px;
  font-weight:500;
  animation:slideUp .25s ease-out;
  pointer-events:auto;
  min-width:240px;
  max-width:90vw;
  letter-spacing:-.005em;
  overflow-wrap:anywhere;   /* длинное имя файла без пробелов не вылезает за край */
}
.toast.t-success{border-left:3px solid var(--grn)}
.toast.t-error{border-left:3px solid var(--red)}
.toast.t-warn{border-left:3px solid var(--amb)}
.toast.t-info{border-left:3px solid var(--acc)}
.toast .ico{font-size:16px;flex-shrink:0}

/* Skeleton-загрузчики — для ленивой загрузки контента */
.skeleton{
  background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 50%,var(--s1) 75%);
  background-size:200% 100%;
  animation:shimmer 1.6s infinite;
  border-radius:8px;
  color:transparent;
}

/* ═══════════════════════════════════════════════════════════════════════════
   DETAILS — раскрывающиеся блоки настроек.
   ═══════════════════════════════════════════════════════════════════════════ */
details{
  background:var(--s1);
  border:1px solid var(--brd);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:14px;
  transition:border-color .15s ease;
}
details:hover{border-color:var(--brd2)}
details[open]{padding-bottom:16px;border-color:var(--accB)}

summary{
  font-size:13px;
  font-weight:600;
  color:var(--txt);
  cursor:pointer;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  letter-spacing:-.005em;
  -webkit-tap-highlight-color:transparent;
}
summary::-webkit-details-marker{display:none}
/* Стрелочка-индикатор справа, плавно поворачивается при раскрытии */
summary::after{
  content:'';
  width:8px;height:8px;
  border-right:1.5px solid var(--dim);
  border-bottom:1.5px solid var(--dim);
  transform:rotate(45deg);
  transition:transform .25s ease;
  margin-bottom:4px;
}
details[open] summary::after{
  transform:rotate(-135deg);
  margin-bottom:0;
  margin-top:4px;
  border-color:var(--acc);
}

.det-b{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--brd);
}

/* ═══════════════════════════════════════════════════════════════════════════
   LOADING — экран загрузки с прогресс-баром и плавным спиннером.
   ═══════════════════════════════════════════════════════════════════════════ */
.load{
  padding:48px 24px;
  text-align:center;
}
.spinner{
  width:54px;height:54px;
  margin:0 auto 22px;
  border:3px solid var(--brd);
  border-top-color:var(--acc);
  border-right-color:var(--acc);
  border-radius:50%;
  animation:spin .9s cubic-bezier(.5,.1,.5,.9) infinite;
  box-shadow:0 0 24px rgba(10,132,255,.3);
}
.load-t{
  font-size:15px;
  font-weight:600;
  margin-bottom:6px;
  letter-spacing:-.01em;
}
.load-s{
  font-size:12px;
  color:var(--acc);
  min-height:18px;
  margin-bottom:18px;
  font-weight:500;
}
.pbar{
  height:4px;
  background:var(--s2);
  border-radius:2px;
  max-width:340px;
  margin:0 auto;
  overflow:hidden;
}
.pbar>div{
  height:100%;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .5s ease;
  box-shadow:0 0 12px rgba(10,132,255,.5);
  border-radius:2px;
}
.pct{
  font-size:11px;
  color:var(--dim);
  margin-top:8px;
  font-weight:500;
}

/* ═══════════════════════════════════════════════════════════════════════════
   TABS — вкладки результатов. Тонкие, со скрытым скроллом на мобильных.
   ═══════════════════════════════════════════════════════════════════════════ */
.tabs{
  display:flex;
  gap:2px;
  background:var(--s1);
  border:1px solid var(--brd);
  border-radius:12px;
  padding:4px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  margin-bottom:14px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:1;
  min-width:auto;
  padding:12px 14px;
  border-radius:10px;
  border:0;
  background:transparent;
  color:var(--dim);
  font-size:13px;
  font-weight:500;
  white-space:nowrap;
  letter-spacing:-.005em;
  transition:all .15s cubic-bezier(.2,.8,.2,1);
  -webkit-tap-highlight-color:transparent;
  min-height:44px;
}
.tab:hover{color:var(--txt2)}
.tab.on{
  background:var(--accS);
  color:var(--acc);
  font-weight:600;
  box-shadow:inset 0 0 0 1px var(--accB);
}

/* ═══════════════════════════════════════════════════════════════════════════
   STATS — крупные цифры с метаданными. Центральный элемент UI результатов.
   ═══════════════════════════════════════════════════════════════════════════ */
.stats{
  display:grid;
  /* minmax(0,1fr), а не 1fr: иначе колонка не сужается меньше своего
     содержимого, и на экране 390px карточки вылезали за край */
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-bottom:14px;
}
.stat{
  background:var(--s1);
  border:1px solid var(--brd);
  border-radius:14px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:14px;
  transition:all .2s cubic-bezier(.2,.8,.2,1);
}
.stat:hover{border-color:var(--brd2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.stat-ic{
  width:46px;height:46px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  flex-shrink:0;
  font-weight:700;
}
.stat-ic svg{display:block}
.stat > div:last-child{min-width:0}
/* На узких телефонах ужимаем отступы и иконку, чтобы «Заимствования» помещались */
@media(max-width:420px){
  .stat{padding:12px;gap:10px}
  .stat-ic{width:38px;height:38px}
  .stats .stat-v{font-size:22px}
}
.stat-v{
  font-size:26px;
  font-weight:800;
  line-height:1;
  letter-spacing:-.03em;
  font-feature-settings:"tnum";
}
.stat-l{
  font-size:12px;
  color:var(--dim);
  margin-top:4px;
  font-weight:500;
  letter-spacing:-.005em;
}

/* Прогресс-бары результатов — тонкие, с плавной анимацией */
.pb{margin-bottom:12px}
.pb-hd{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:12px;
  font-weight:500;
  letter-spacing:-.005em;
}
.pb-tr{
  height:6px;
  background:var(--s2);
  border-radius:3px;
  overflow:hidden;
}
.pb-fl{
  height:100%;
  border-radius:3px;
  transition:width 1s cubic-bezier(.2,.8,.2,1); /* Плавная easing-функция */
}

/* Сетка с метаданными документа */
.ig{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;
}
.ii{
  background:var(--s2);
  border:1px solid var(--brd);
  border-radius:10px;
  padding:10px 13px;
  transition:border-color .15s ease;
}
.ii:hover{border-color:var(--brd2)}
.ii-k{
  font-size:9px;
  color:var(--dim);
  text-transform:uppercase;
  letter-spacing:.06em;
  font-weight:600;
}
.ii-v{
  font-size:13px;
  font-weight:600;
  margin-top:3px;
  letter-spacing:-.005em;
  overflow-wrap:anywhere;
}

/* ═══════════════════════════════════════════════════════════════════════════
   VERDICT — главный вывод анализа. Большая иконка, ясное утверждение.
   ═══════════════════════════════════════════════════════════════════════════ */
.verd{
  text-align:center;
  padding:28px 22px;
  border-radius:14px;
  margin-bottom:14px;
  position:relative;
  overflow:hidden;
}
.verd::before{
  content:'';
  position:absolute;
  top:-50%;
  left:50%;
  transform:translateX(-50%);
  width:80%;height:200%;
  background:radial-gradient(ellipse,rgba(10,132,255,.08),transparent 60%);
  pointer-events:none;
  opacity:.7;
}
.verd-i{
  font-size:48px;
  margin-bottom:12px;
  line-height:1;
  position:relative;
  z-index:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.verd-i svg{
  display:block;
  filter:drop-shadow(0 4px 12px currentColor);
}
.verd-t{
  font-size:18px;
  font-weight:700;
  margin-bottom:6px;
  letter-spacing:-.02em;
  position:relative;
  z-index:1;
}
.verd-d{
  font-size:12px;
  color:var(--dim);
  max-width:480px;
  margin:0 auto;
  line-height:1.65;
  position:relative;
  z-index:1;
  font-weight:400;
}

/* Метрики ИИ-анализа — компактные карточки */
.aim{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;
  margin-bottom:14px;
}
.ai-m{
  background:var(--s2);
  border:1px solid var(--brd);
  border-radius:10px;
  padding:10px 13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:border-color .15s ease;
}
.ai-m:hover{border-color:var(--brd2)}
.ai-mn{
  font-size:11px;
  color:var(--dim);
  font-weight:500;
  letter-spacing:-.005em;
}
.ai-mv{
  font-size:10px;
  font-weight:700;
  padding:3px 9px;
  border-radius:6px;
  letter-spacing:.02em;
  text-transform:uppercase;
}

/* Карточки фрагментов с подсветкой проблемных мест */
.frag{
  border-left:3px solid;
  border-radius:0 10px 10px 0;
  padding:12px 14px;
  margin-bottom:8px;
  background:var(--s1);
  transition:background .15s ease;
}
.frag:hover{background:var(--s2)}
.frag-h{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
  gap:8px;
}
.frag-tag{
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
}
.frag-c{
  font-size:10px;
  color:var(--dim);
  font-weight:500;
}
.frag-t{
  font-size:12px;
  line-height:1.7;
  color:var(--txt2);
  letter-spacing:-.005em;
}
.frag-m{
  font-size:10px;
  color:var(--dim);
  margin-top:6px;
  font-style:italic;
  line-height:1.5;
}

/* Список найденных источников */
.src{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  background:var(--s1);
  border:1px solid var(--brd);
  border-radius:10px;
  margin-bottom:6px;
  transition:all .15s ease;
}
.src:hover{border-color:var(--brd2);background:var(--s2)}
.src-ic{
  width:34px;height:34px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  flex-shrink:0;
}
.src-t{flex:1;min-width:0;overflow:hidden}
.src-title{
  font-size:12px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  letter-spacing:-.005em;
  color:var(--txt);
}
.src-u{
  font-size:10px;
  color:var(--acc);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:500;
}
.src-p{
  font-size:14px;
  font-weight:700;
  flex-shrink:0;
  letter-spacing:-.01em;
  font-feature-settings:"tnum";
}

/* Требования положения: «что найдено — что требуется» и отметка */
.req{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--brd);font-size:12px;line-height:1.5}
.req:last-of-type{border-bottom:none}
.req-i{flex-shrink:0;width:18px;text-align:center;font-weight:800}
.req-b{flex:1;min-width:0}
.req-l{font-weight:600;color:var(--txt);overflow-wrap:anywhere}
.req-b summary, details summary > div{overflow-wrap:anywhere;min-width:0}
.req-v{color:var(--dim)}

/* Разбивка ИИ-оценки по метрикам */
.feat{padding:9px 0;border-bottom:1px solid var(--brd);font-size:12px}
.feat-h{display:flex;justify-content:space-between;gap:8px}
.feat-n{color:var(--txt);font-weight:500;min-width:0}
.feat-v{color:var(--txt2);font-feature-settings:"tnum";flex-shrink:0}
.feat-r{color:var(--dim);font-size:11px;margin-top:2px}
.feat-bar{height:4px;background:var(--s2);border-radius:2px;margin-top:6px;overflow:hidden}
.feat-bar>div{height:100%;background:var(--ap-ai);border-radius:2px}

/* Совпавшие предложения под источником: что в документе и что в источнике */
.src-wrap{margin-bottom:10px}
.src-wrap .src{margin-bottom:0}
.match{
  margin:6px 0 0 46px;
  padding:9px 12px;
  border-left:3px solid var(--ap-borrow);
  background:var(--s2);
  border-radius:0 8px 8px 0;
  font-size:12px;
  line-height:1.6;
}
.match.cited{border-left-color:var(--ap-cite)}
.match-doc{color:var(--txt)}
.match-src{color:var(--txt2);margin-top:4px}
.match-k{font-size:10px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
@media(max-width:480px){.match{margin-left:0}}

/* Текст с подсветкой проблемных фрагментов в стиле Антиплагиат.ВУЗ */
.highlight{
  background:var(--s1);
  border:1px solid var(--brd);
  border-radius:10px;
  padding:16px;
  font-size:13px;
  line-height:1.85;
  max-height:420px;
  overflow-y:auto;
  letter-spacing:-.005em;
  color:var(--txt2);
}
.highlight::-webkit-scrollbar{width:6px}
.highlight::-webkit-scrollbar-track{background:transparent}
.highlight::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}
.hl-orig{}
.hl-borrow{
  background:var(--redS);
  border-bottom:2px solid var(--ap-borrow);
  padding:1px 3px;
  border-radius:3px;
}
.hl-cite{
  background:rgba(88,181,242,.12);
  border-bottom:2px solid var(--ap-cite);
  padding:1px 3px;
  border-radius:3px;
}
.hl-self{
  background:var(--orgS);
  border-bottom:2px solid var(--ap-self);
  padding:1px 3px;
  border-radius:3px;
}
.hl-ai{
  background:var(--purS);
  border-bottom:2px solid var(--ap-ai);
  padding:1px 3px;
  border-radius:3px;
}
.hl-suspicious{
  background:var(--ambS);
  border-bottom:2px dashed var(--ap-suspicious);
  padding:1px 3px;
  border-radius:3px;
}

/* Легенда обозначений в отчёте */
.legend{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  font-size:11px;
  margin-bottom:12px;
  color:var(--txt2);
}
.legend-i{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:500;
  letter-spacing:-.005em;
}
.legend-c{
  width:11px;height:11px;
  border-radius:3px;
  display:inline-block;
  box-shadow:0 0 0 1px rgba(255,255,255,.05);
}

/* ═══════════════════════════════════════════════════════════════════════════
   FOOTER — нижний блок с информацией о версии.
   ═══════════════════════════════════════════════════════════════════════════ */
.ft{
  border-top:1px solid var(--brd);
  padding:20px 16px;
  text-align:center;
  font-size:11px;
  color:var(--mut);
  font-weight:400;
  letter-spacing:-.005em;
  line-height:1.6;
}
.ft b{color:var(--txt2);font-weight:600}

/* ═══════════════════════════════════════════════════════════════════════════
   PROVIDER SELECT — кнопки выбора AI-провайдера.
   ═══════════════════════════════════════════════════════════════════════════ */
.prov{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:12px;
}
.prov-b{
  padding:13px 10px;
  border-radius:12px;
  border:1px solid var(--brd);
  background:var(--s2);
  color:var(--txt2);
  font-size:13px;
  font-weight:600;
  text-align:center;
  cursor:pointer;
  letter-spacing:-.005em;
  transition:all .15s cubic-bezier(.2,.8,.2,1);
  -webkit-tap-highlight-color:transparent;
  font-family:inherit;
  min-height:46px;
}
.prov-b:hover{border-color:var(--brd2);color:var(--txt)}
.prov-b:active{transform:scale(.97)}
.prov-b.on{
  background:var(--accS);
  border-color:var(--acc);
  color:var(--acc);
  box-shadow:
    inset 0 0 0 1px var(--accB),
    0 0 16px rgba(10,132,255,.2);
}

/* Поле ввода API-ключа с кнопкой сохранения справа */
.keyrow{
  display:flex;
  gap:8px;
  align-items:stretch;
  margin-bottom:8px;
}
.keyrow input{
  flex:1;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:0;
}
.keybtn{
  padding:0 18px;
  border-radius:12px;
  border:1px solid var(--brd);
  background:var(--s2);
  color:var(--txt2);
  font-size:12px;
  white-space:nowrap;
  font-weight:600;
  letter-spacing:-.005em;
  cursor:pointer;
  transition:all .15s cubic-bezier(.2,.8,.2,1);
  font-family:inherit;
  display:flex;
  align-items:center;
  min-height:48px;
}
.keybtn:hover{border-color:var(--brd2);color:var(--txt)}
.keybtn:active{transform:scale(.97)}
.keybtn.ok{
  color:var(--grn);
  border-color:rgba(48,209,88,.32);
  background:var(--grnS);
}

/* Стили командной палитры удалены в версии 7.2 для упрощения интерфейса. */


/* ═══════════════════════════════════════════════════════════════════════════
   ПОДОЗРИТЕЛЬНОСТЬ — карточка предупреждения о манипуляциях с текстом.
   ═══════════════════════════════════════════════════════════════════════════ */
.susp-card{
  background:var(--ambS);
  border:1px solid rgba(255,214,10,.32);
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:14px;
}
.susp-title{
  font-size:13px;
  font-weight:700;
  color:var(--amb);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
  letter-spacing:-.005em;
}
.susp-list{
  font-size:12px;
  color:var(--txt2);
  line-height:1.7;
  font-weight:500;
}

<!-- Командная палитра удалена в версии 7.2 для упрощения мобильного интерфейса.

<script>
// =============================================================================
// SOZYKIN ПЛАГИАТ v8.0 — обновлённая версия с улучшенным мобильным интерфейсом.
// четырёх научно-технических исследований (см. чат с Claude).
//
// Архитектура:
//   1. Утилиты и константы (токенизация, маркеры, гомоглифы)
//   2. Анализ — 7 локальных метрик + детектор подозрительности
//   3. Алгоритмы похожести — TF-IDF, MinHash+LSH (для быстрого сравнения)
//   4. Источники — 6 баз поиска (OpenAlex, Crossref, Semantic Scholar,
//      arXiv, Wikipedia, DOAJ) и сравнение документа с их аннотациями
//   5. AI-провайдеры — Groq, Cerebras, OpenRouter, Mistral, GigaChat
//   6. Fast-DetectGPT-lite — детектор ИИ через два LLM-API
//   7. UI — главный экран, результаты, отчёт, командная палитра
//   8. PWA — Service Worker для оффлайн-работы
// =============================================================================

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const app = $('#app');

// Глобальное состояние приложения. Сохраняется в localStorage,
// поэтому пользовательские настройки переживают перезагрузку страницы.
let S = {

  res: null,               // Результат последнего анализа

  tab: 'overview',         // Активная вкладка результатов
  apiProvider: 'none',     // Выбранный AI-провайдер

  workType: 'none',        // Тип работы для проверки требований положения

};
try{
  const saved = JSON.parse(localStorage.getItem('sp_v7') || '{}');

}catch(e){}
S.res = null; S.text = S.text || ''; S.docxFormat = null;

function saveState(){

}

// Автосохранение черновика — текст документа сохраняется отдельно от настроек,
// потому что может быть очень большим. Хранится 24 часа, потом удаляется.
function saveDraft(){
  try{
    if(S.text && S.text.length > 0 && S.text.length < 500000){
      localStorage.setItem('sp_draft_v7', JSON.stringify({

      }));
    }
