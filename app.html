<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>Проверка — SOZYKIN Плагиат</title>
<meta name="description" content="Проверка курсовой или ВКР: заимствования из открытых научных баз, оформление по положению вуза, признаки ИИ и помощник по исправлению.">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOZYKIN">
<meta name="mobile-web-app-capable" content="yes">

<!-- Иконки и манифест — общие для всех страниц сайта (папка icons/).
     Манифест и sw.js дают установку на телефон и работу без сети. -->
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<!-- Шрифты: Cormorant Garamond — заголовки и крупные цифры, Inter — текст.
     Оба с кириллицей. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Библиотеки парсинга документов. PDF.js извлекает текст из PDF,
     mammoth — из DOCX. Подгружаются с CDN Cloudflare, доступного в РФ. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

<style>
/* =============================================================================
   SOZYKIN Плагиат — дизайн-система приложения.
   Чёрный фон, тёплый текст цвета слоновой кости и сдержанное золото как
   единственный акцент. Заголовки — антиква Cormorant Garamond, текст — Inter.
   Цвета результатов приглушены, чтобы не спорить с золотом:
   шалфей — оригинальность, терракота — заимствования, лаванда — ИИ,
   стальной голубой — цитаты.
   ============================================================================= */
:root{
  --bg:#070707;
  --s1:#0e0e0e;
  --s2:#151515;
  --s3:#1c1c1c;
  --brd:rgba(255,255,255,.07);
  --brd2:rgba(255,255,255,.13);

  --txt:#ede9e1;
  --txt2:rgba(237,233,225,.68);
  --dim:rgba(237,233,225,.46);
  --mut:rgba(237,233,225,.28);

  --gold:#c8a96a;
  --gold2:#e4cc93;
  --goldD:#8c7442;
  --goldS:rgba(200,169,106,.10);
  --goldB:rgba(200,169,106,.38);

  /* Прежние имена акцента — синонимы золота: на них ссылаются стили в коде */
  --acc:var(--gold);
  --acc2:var(--gold2);
  --accD:var(--goldD);
  --accS:var(--goldS);
  --accB:var(--goldB);

  --grn:#8dbb94;  --grnS:rgba(141,187,148,.10);
  --red:#d9806f;  --redS:rgba(217,128,111,.10);
  --pur:#a991d6;  --purS:rgba(169,145,214,.10);
  --amb:#d9b45a;  --ambS:rgba(217,180,90,.10);
  --org:#c9925e;  --orgS:rgba(201,146,94,.10);
  --blu:#86a9c9;

  --ap-orig:var(--grn);
  --ap-cite:var(--blu);
  --ap-self:var(--org);
  --ap-borrow:var(--red);
  --ap-suspicious:var(--amb);
  --ap-ai:var(--pur);

  --glass-brd:var(--brd2);
  --shadow-md:0 12px 32px -8px rgba(0,0,0,.7);

  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  background:var(--bg);color:var(--txt);
  font-family:var(--sans);font-size:15px;line-height:1.55;letter-spacing:-.006em;
  min-height:100vh;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold2)}
::selection{background:rgba(200,169,106,.3)}
.m{font-feature-settings:"tnum"}

/* ---------- Шапка ---------- */
.hdr{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:14px 16px;
  background:rgba(7,7,7,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--brd);
}
.hdr-l{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.lg{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  border:1px solid var(--goldB);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:600;font-size:17px;color:var(--gold);letter-spacing:.02em;
}
.brand{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.08em;color:var(--txt);line-height:1.1}
.sub{font-size:9.5px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;margin-top:2px}
.hdr-r{display:flex;align-items:center;gap:2px}
.nav-a{color:var(--txt2);font-size:13px;padding:8px 10px;border-radius:8px;letter-spacing:.01em}
.nav-a:hover{color:var(--txt)}
.nav-a.on{color:var(--gold)}
@media(max-width:400px){.nav-a{padding:8px 6px;font-size:12.5px}.hdr-l{gap:10px}.sub{letter-spacing:.24em}}
@media(max-width:380px){.hdr{padding-left:12px;padding-right:12px}.lg{width:34px;height:34px;font-size:15px}.brand{font-size:16px;letter-spacing:.05em}.sub{letter-spacing:.18em}.nav-a{padding:8px 5px;font-size:12px}}
@media(max-width:350px){.hdr-l{gap:8px}.nav-a{padding:8px 4px}}

.wrap{max-width:880px;margin:0 auto;padding:28px 16px 64px}
.ft{padding:28px 16px 40px;text-align:center;font-size:12px;color:var(--dim);border-top:1px solid var(--brd)}
.ft a{color:var(--txt2)}

/* ---------- Заголовок экрана ---------- */
.hero{padding:12px 0 26px;text-align:left}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.hero-t{font-family:var(--serif);font-weight:600;font-size:clamp(34px,8vw,52px);line-height:1.05;letter-spacing:-.01em}
.hero-s{color:var(--txt2);font-size:15px;margin-top:12px;max-width:560px}

/* ---------- Карточки, подписи, поля ---------- */
.card{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:20px;margin-bottom:12px;animation:fadeIn .35s ease}
.card-t{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.hint{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:8px}
.field{margin:22px 0}
.fine{font-size:12px;color:var(--dim);text-align:center;margin-top:14px}
input[type=password],input[type=text],input[type=email]{
  width:100%;padding:13px 14px;border-radius:10px;
  background:var(--s1);border:1px solid var(--brd2);color:var(--txt);
  font:inherit;font-size:14px;outline:0;transition:border-color .2s ease;
}
input:focus,textarea:focus{border-color:var(--goldB)}

/* ---------- Загрузка файла и текст ---------- */
.drop{
  border:1px dashed var(--brd2);border-radius:14px;
  padding:34px 20px;text-align:center;cursor:pointer;
  background:var(--s1);transition:border-color .25s ease,background .25s ease;
}
.drop:hover,.drop.on{border-color:var(--gold);background:var(--goldS)}
.drop-i{color:var(--gold);margin-bottom:12px;display:flex;justify-content:center}
.drop-t{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--txt);overflow-wrap:anywhere}
.drop-h{font-size:12px;color:var(--dim);margin-top:6px;letter-spacing:.06em}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:16px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--brd)}
.ta-wrap{background:var(--s1);border:1px solid var(--brd);border-radius:14px;overflow:hidden}
.ta-wrap:focus-within{border-color:var(--goldB)}
.ta-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--brd);font-size:12px;color:var(--dim)}
textarea{
  width:100%;min-height:180px;padding:16px;
  background:transparent;color:var(--txt);border:0;outline:0;
  font:inherit;font-size:15px;line-height:1.7;resize:vertical;
}
textarea::placeholder{color:var(--mut)}

/* ---------- Переключатели (тип работы, провайдер) ---------- */
.prov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:640px){.prov{grid-template-columns:repeat(4,minmax(0,1fr))}}
.prov-b{
  padding:12px 10px;border-radius:10px;min-height:46px;
  border:1px solid var(--brd2);background:transparent;color:var(--txt2);
  font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
  transition:all .2s ease;-webkit-tap-highlight-color:transparent;
}
.prov-b:hover{color:var(--txt);border-color:var(--goldB)}
.prov-b.on{color:var(--gold);border-color:var(--gold);background:var(--goldS)}

/* ---------- Раскрывающиеся блоки ---------- */
details{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:16px 18px;margin:12px 0;transition:border-color .2s ease}
details[open]{border-color:var(--brd2)}
summary{
  cursor:pointer;list-style:none;font-size:14px;font-weight:500;color:var(--txt);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  -webkit-tap-highlight-color:transparent;
}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font-family:var(--serif);font-size:22px;line-height:1;color:var(--gold);flex-shrink:0}
details[open] summary::after{content:'−'}
.det-b{margin-top:16px;animation:fadeIn .25s ease}
.keyrow{display:flex;gap:8px;margin-bottom:6px}
.keybtn{padding:0 16px;border-radius:10px;border:1px solid var(--brd2);background:transparent;color:var(--txt2);font:inherit;font-size:13px;cursor:pointer;flex-shrink:0}
.keybtn.ok{color:var(--gold);border-color:var(--gold)}

/* ---------- Кнопки ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  padding:16px 20px;border-radius:12px;border:0;cursor:pointer;
  font:inherit;font-size:15px;font-weight:600;letter-spacing:.02em;
  transition:transform .15s ease,box-shadow .2s ease,opacity .2s ease;
}
.btn-go{
  margin-top:18px;color:#0b0b0b;
  background:linear-gradient(135deg,#b8955a 0%,#e4cc93 50%,#b8955a 100%);
  box-shadow:0 10px 30px -12px rgba(200,169,106,.55);
}
.btn-go:hover:not(:disabled){box-shadow:0 14px 36px -12px rgba(200,169,106,.75)}
.btn-go:active:not(:disabled){transform:scale(.985)}
.btn-go:disabled{background:var(--s2);color:var(--mut);box-shadow:none;cursor:not-allowed}
.btn-o,.btn-dl,.btn-dl-ai{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border-radius:10px;cursor:pointer;
  background:transparent;border:1px solid var(--brd2);color:var(--txt);
  font:inherit;font-size:13.5px;font-weight:500;transition:border-color .2s ease,color .2s ease;
}
.btn-o:hover,.btn-dl:hover,.btn-dl-ai:hover{border-color:var(--gold);color:var(--gold)}
.btn-dl{border-color:var(--goldB);color:var(--gold)}

/* ---------- Сообщения ---------- */
.err,.warn,.info{border-radius:12px;padding:13px 16px;font-size:13.5px;line-height:1.55;margin:12px 0;border:1px solid}
.err{background:var(--redS);border-color:rgba(217,128,111,.3);color:#f1b3a7}
.warn{background:var(--ambS);border-color:rgba(217,180,90,.3);color:#ecd394}
.info{background:var(--goldS);border-color:var(--goldB);color:var(--txt2)}

/* ---------- Экран загрузки ---------- */
.load{padding:64px 20px;text-align:center}
.spinner{
  width:56px;height:56px;margin:0 auto 26px;border-radius:50%;
  border:1px solid var(--brd2);border-top-color:var(--gold);
  animation:spin 1.1s linear infinite;
}
.load-t{font-family:var(--serif);font-size:28px;font-weight:600}
.load-s{color:var(--dim);font-size:13px;margin:8px 0 22px;min-height:20px}
.pbar{height:2px;background:var(--s3);max-width:320px;margin:0 auto;overflow:hidden}
.pbar>div{height:100%;background:var(--gold);transition:width .8s ease}
.pct{color:var(--gold);font-size:13px;margin-top:12px;letter-spacing:.1em}

/* ---------- Результаты: вкладки ---------- */
.tabs{
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  border-bottom:1px solid var(--brd);margin-bottom:18px;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;padding:12px 12px 13px;border:0;background:transparent;cursor:pointer;
  color:var(--dim);font:inherit;font-size:14px;white-space:nowrap;
  border-bottom:1px solid transparent;margin-bottom:-1px;transition:color .2s ease;
}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.actions>*{flex:1;min-width:130px}

/* ---------- Показатели ---------- */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--s1);border:1px solid var(--brd);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stat-ic{display:none}
.stat-v{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1;font-feature-settings:"lnum","tnum"}
.stat-l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.overview{display:flex;gap:12px;flex-wrap:wrap}
.overview>.card{margin-bottom:12px}

.pb{margin-bottom:14px}
.pb:last-child{margin-bottom:0}
.pb-hd{display:flex;justify-content:space-between;font-size:13px;color:var(--txt2);margin-bottom:7px}
.pb-tr{height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.pb-fl{height:100%;border-radius:2px;transition:width 1s cubic-bezier(.2,.8,.2,1)}

.ig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--brd);border:1px solid var(--brd);border-radius:12px;overflow:hidden}
@media(min-width:640px){.ig{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ii{background:var(--s1);padding:12px 14px;min-width:0}
.ii-k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ii-v{font-size:14px;margin-top:4px;color:var(--txt);overflow-wrap:anywhere}

/* Подозрительные символы */
.susp-card{border:1px solid rgba(217,180,90,.3);background:var(--ambS);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.susp-title{color:var(--amb);font-weight:600;font-size:14px;margin-bottom:8px}
.susp-list{list-style:none;font-size:13px;color:var(--txt2)}
.susp-list li{padding:3px 0}
.susp-list li::before{content:'— ';color:var(--amb)}

/* Требования положения */
.req{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--brd);font-size:13.5px;line-height:1.5}
.req:last-of-type{border-bottom:none}
.req-i{flex-shrink:0;width:16px;text-align:center;font-weight:600}
.req-b{flex:1;min-width:0}
.req-l{color:var(--txt);overflow-wrap:anywhere}
.req-v{color:var(--dim);font-size:12.5px;margin-top:2px}
.req-b summary,details summary>div{overflow-wrap:anywhere;min-width:0}

/* Разбивка ИИ-оценки */
.feat{padding:12px 0;border-bottom:1px solid var(--brd);font-size:13.5px}
.feat:last-of-type{border-bottom:none}
.feat-h{display:flex;justify-content:space-between;gap:10px}
.feat-n{color:var(--txt);min-width:0}
.feat-v{color:var(--txt2);font-feature-settings:"tnum";flex-shrink:0}
.feat-r{color:var(--dim);font-size:12px;margin-top:3px}
.feat-bar{height:2px;background:var(--s3);margin-top:9px;overflow:hidden}
.feat-bar>div{height:100%;background:var(--pur)}

/* Вердикт ИИ */
.verd{text-align:center;padding:26px 18px;border-radius:12px}
.verd-i{display:flex;justify-content:center;margin-bottom:12px}
.verd-t{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.15}
.verd-d{font-size:13px;color:var(--txt2);margin-top:8px;line-height:1.6}

/* Фрагменты */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--dim);margin-bottom:14px}
.legend-i{display:flex;align-items:center;gap:6px}
.legend-c{width:8px;height:8px;border-radius:50%}
.frag{border-left:2px solid;padding:12px 14px;margin-bottom:8px;border-radius:0 10px 10px 0}
.frag-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.frag-tag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.frag-c{font-size:11.5px;color:var(--dim)}
.frag-t{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--txt)}
.frag-m{font-size:12.5px;color:var(--dim);margin-top:6px}

/* Текст с подсветкой */
.highlight{
  background:var(--s1);border:1px solid var(--brd);border-radius:12px;
  padding:18px;font-family:var(--serif);font-size:17px;line-height:1.75;color:var(--txt2);
  max-height:480px;overflow-y:auto;white-space:pre-wrap;overflow-wrap:anywhere;
}
.hl-orig{}
.hl-borrow{background:rgba(217,128,111,.16);color:var(--txt);border-bottom:1px solid var(--red)}
.hl-cite{background:rgba(134,169,201,.14);color:var(--txt);border-bottom:1px solid var(--blu)}
.hl-self{background:var(--orgS);color:var(--txt)}
.hl-ai{background:rgba(169,145,214,.14);color:var(--txt);border-bottom:1px solid var(--pur)}
.hl-suspicious{background:var(--ambS)}

/* Источники */
.src-wrap{margin-bottom:12px}
.src{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--brd)}
.src-t{flex:1;min-width:0}
.src-title{font-size:14px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-title a{color:var(--txt)}
.src-title a:hover{color:var(--gold)}
.src-u{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-p{font-family:var(--serif);font-size:20px;font-weight:600;flex-shrink:0;font-feature-settings:"lnum"}
.match{margin:8px 0 0;padding:10px 14px;border-left:2px solid var(--red);background:var(--s2);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.6}
.match.cited{border-left-color:var(--blu)}
.match-doc{font-family:var(--serif);font-size:16px;color:var(--txt)}
.match-src{color:var(--txt2);margin-top:6px}
.match-k{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:6px}

/* Уведомления */
.toast-host{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:92vw}
.toast{
  display:flex;gap:10px;align-items:center;min-width:240px;max-width:92vw;
  padding:12px 18px;border-radius:12px;font-size:13.5px;
  background:rgba(21,21,21,.96);border:1px solid var(--goldB);color:var(--txt);
  box-shadow:var(--shadow-md);animation:slideUp .25s ease-out;transition:opacity .3s ease,transform .3s ease;
  pointer-events:auto;overflow-wrap:anywhere;
}
.toast .ico{color:var(--gold);flex-shrink:0}

<!-- Командная палитра удалена в версии 7.2 для упрощения мобильного интерфейса.

<script>
// =============================================================================
// SOZYKIN ПЛАГИАТ v8.0 — обновлённая версия с улучшенным мобильным интерфейсом.
// четырёх научно-технических исследований (см. чат с Claude).

//   2. Анализ — 7 локальных метрик + детектор подозрительности
//   3. Алгоритмы похожести — TF-IDF, MinHash+LSH (для быстрого сравнения)
//   4. Источники — 6 баз поиска (OpenAlex, Crossref, Semantic Scholar,

//   7. UI — главный экран, результаты, отчёт, работы группы
//   8. PWA — Service Worker для оффлайн-работы
// =============================================================================

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const app = $('#app');

// Глобальное состояние приложения. Сохраняется в localStorage,

let S = {

  fn: '',                  // Имя файла
  res: null,               // Результат последнего анализа

  chatWithText: false,     // Прикладывать ли к вопросу начало текста работы
  apiProvider: 'none',     // Выбранный AI-провайдер

};
try{

S.res = null; S.text = S.text || ''; S.docxFormat = null; S.chat = []; S.chatBusy = false;

function saveState(){

// Автосохранение черновика — текст документа сохраняется отдельно от настроек,
// потому что может быть очень большим. Хранится 24 часа, потом удаляется.

function loadDraft(){
