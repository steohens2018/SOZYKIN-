<script>

// ═══════════════════════════════════════════════════════════════════════════
// ЧТЕНИЕ ФАЙЛОВ
// ═══════════════════════════════════════════════════════════════════════════

async function readFile(f){
  const n=f.name.toLowerCase();
  if(f.size>10*1024*1024) throw new Error('Файл больше 10 МБ. Разбейте на части.');

  if(n.endsWith('.txt')||f.type==='text/plain'){
    const buf=await f.arrayBuffer();
    try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
    catch(e){return new TextDecoder('windows-1251').decode(buf);}
  }
  if(n.endsWith('.docx')){
    const ab=await f.arrayBuffer();
    const r=await mammoth.extractRawText({arrayBuffer:ab});
    if(!r.value?.trim()) throw new Error('DOCX пустой или не содержит текста');
    return r.value;
  }
  if(n.endsWith('.doc')){
    try{
      const ab=await f.arrayBuffer();
      const r=await mammoth.extractRawText({arrayBuffer:ab});
      if(r.value?.trim()) return r.value;
    }catch(e){}
    throw new Error('Формат .doc (Word 97-2003) не поддерживается. Откройте файл в Word и сохраните как .docx');
  }
  if(n.endsWith('.pdf')||f.type==='application/pdf'){
    if(!window.pdfjsLib) throw new Error('PDF.js ещё загружается. Подождите 2 секунды и повторите.');
    const ab=await f.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:ab}).promise;
    let txt='';
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i);
      const tc=await pg.getTextContent();
      const pageText=tc.items.map(it=>it.str).join(' ');
      txt+=pageText+'\n\n';
    }
    if(!txt.trim()) throw new Error('PDF без текстового слоя (сканированный). Используйте OCR.');
    return txt;
  }
  // Fallback
  return await f.text();
}

// ЛОКАЛЬНЫЙ АНАЛИЗ — 7 МЕТРИК ИЗ ИССЛЕДОВАНИЯ
// ═══════════════════════════════════════════════════════════════════════════

function tokenize(text){
  return (text.toLowerCase().match(/[а-яёa-z0-9]+/gi)||[]);
}

function splitSentences(text){
  return text.split(/(?<=[.!?…])\s+(?=[А-ЯA-ZЁ])/).filter(s=>s.trim().length>5);
}

// Простая псевдо-лемматизация для русского
function pseudoLemma(w){
  w=w.toLowerCase();
  const endings=['ого','его','ему','ому','ыми','ими','ами','ях','ах','ов','ев','ый','ий','ой','ая','яя','ое','ее','ые','ие','ла','ло','ли','ть','ут','ют','ат','ят','ет','ит','ся','сь','ам','ям','ом','ем','у','ю','а','я','е','и','ы','о','ь','й'];
  for(const e of endings){
    if(w.length>e.length+3 && w.endsWith(e)) return w.slice(0,-e.length);
  }
  return w;
}

function countMarkers(text, markers){
  const low=text.toLowerCase();
  let count=0;
  const hits=[];
  for(const m of markers){
    let idx=0;
    while((idx=low.indexOf(m,idx))!==-1){
      count++;
      hits.push({pos:idx,len:m.length,text:m});
      idx+=m.length;
    }
  }
  return {count,hits};
}

// Шинглы N=3 для поиска повторов
function getShingles(tokens, n=3){
  const sh=new Map();
  for(let i=0;i<=tokens.length-n;i++){
    const s=tokens.slice(i,i+n).join(' ');
    sh.set(s,(sh.get(s)||0)+1);
  }
  return sh;
}

function localAnalyze(text){
  const tokens=tokenize(text);
  const sentences=splitSentences(text);
  const wc=tokens.length||1;
  const cc=text.length;
  const sc=sentences.length||1;
  const pages=Math.max(1,Math.ceil(cc/1800));

  // 1. BURSTINESS — дисперсия длин предложений
  const sentLens=sentences.map(s=>tokenize(s).length);
  const avgLen=sentLens.reduce((a,b)=>a+b,0)/sc;
  const variance=sentLens.reduce((a,l)=>a+(l-avgLen)**2,0)/sc;
  const stdDev=Math.sqrt(variance);
  const burstiness=stdDev/(avgLen||1);

  // 2. MATTR (Moving Average TTR, window=50)
  const window=Math.min(50,tokens.length);
  let mattrSum=0, mattrCount=0;
  if(tokens.length>=window){
    for(let i=0;i<=tokens.length-window;i+=10){
      const chunk=tokens.slice(i,i+window);
      const uniq=new Set(chunk.map(t=>pseudoLemma(t)));
      mattrSum+=uniq.size/window;
      mattrCount++;
    }
  }
  const mattr=mattrCount?mattrSum/mattrCount:0;
  const ttr=new Set(tokens.map(t=>pseudoLemma(t))).size/wc;

  // 3. ПЛОТНОСТЬ МАРКЕРОВ ИИ
  const markersRu=countMarkers(text, AI_MARKERS_RU);
  const markersEn=countMarkers(text, AI_MARKERS_EN);
  const totalMarkers=markersRu.count+markersEn.count;
  const markerDensity=totalMarkers/(wc/100); // на 100 слов

  // 4. UNIQUE BIGRAM RATIO
  const bigrams=new Map();
  for(let i=0;i<tokens.length-1;i++){
    const bg=tokens[i]+' '+tokens[i+1];
    bigrams.set(bg,(bigrams.get(bg)||0)+1);
  }
  let uniqBi=0;
  bigrams.forEach(v=>{if(v===1)uniqBi++;});
  const uniqBiRatio=uniqBi/(bigrams.size||1);

  // 5. PUNCTUATION PROFILE
  const emDashes=(text.match(/—|–/g)||[]).length;
  const emDashDensity=emDashes/(sc/10);
  const smartQuotes=(text.match(/[«»""]/g)||[]).length;

  // 6. КАНЦЕЛЯРИТ (является, данный, который)
  const yavl=(text.match(/\bявля[а-я]*\b/gi)||[]).length;
  const dann=(text.match(/\bданн[а-я]*\b/gi)||[]).length;
  const kotor=(text.match(/\bкотор[а-я]*\b/gi)||[]).length;
  const kancelaritDens=(yavl+dann+kotor*0.5)/wc;

  // 7. FLESCH-KINCAID (формула Оборнева для русского)
  // FRE_ru = 206.835 − 1.52·ASL − 65.14·ASW
  // ASW (average syllables per word) — считаем гласные
  const vowelsRu=/[аеёиоуыэюяaeiouy]/gi;
  const totalSyllables=tokens.reduce((a,t)=>a+(t.match(vowelsRu)||[]).length,0);
  const asw=totalSyllables/wc;
  const asl=wc/sc;
  const fleschRu=206.835 - 1.52*asl - 65.14*asw;

  // ═══ ИТОГОВЫЙ AI-СКОР ═══
  let aiScore=0;
  if(burstiness<0.25) aiScore+=30;
  else if(burstiness<0.4) aiScore+=15;

  if(markerDensity>0.8) aiScore+=25;
  else if(markerDensity>0.4) aiScore+=12;

  if(ttr<0.32) aiScore+=15;
  else if(ttr<0.42) aiScore+=8;

  if(uniqBiRatio<0.75) aiScore+=10;

  if(kancelaritDens>0.035) aiScore+=10;

  if(emDashDensity>2) aiScore+=10; // GPT-4+ характерно

  aiScore=Math.min(aiScore,95);
  const aiVerdict=aiScore<30?'human':aiScore<55?'mixed':'ai';

  // ═══ ЦИТИРОВАНИЕ ═══
  const quoteMatches=[...text.matchAll(/[«"][^«»""]{15,500}[»"]/g)];
  const gostCites=(text.match(/\[\d+(?:\s*,\s*с\.?\s*\d+)?(?:\s*[;,]\s*\d+)*\]/g)||[]).length;
  const citeChars=quoteMatches.reduce((a,m)=>a+m[0].length,0);
  const citePct=Math.min(25,Math.round((citeChars/cc)*100*10)/10);

  // ═══ ЗАИМСТВОВАНИЯ (шаблонность через повторы шинглов) ═══
  const lemmaTokens=tokens.filter(t=>!STOP_RU.has(t)).map(pseudoLemma);
  const shingles3=getShingles(lemmaTokens,3);
  let repeatedShingles=0;
  shingles3.forEach(v=>{if(v>1)repeatedShingles+=v-1;});
  const shingleRepRate=repeatedShingles/(shingles3.size||1);

  // Шаблонность = репликации шинглов + плотность маркеров
  const borrowPct=Math.min(40,Math.round(
    shingleRepRate*40 + Math.min(markerDensity*5,10) + (totalMarkers>0?3:0)
  ));

  const origPct=Math.max(0,Math.round(100-borrowPct-citePct));

  // ═══ ФРАГМЕНТЫ С РАЗМЕТКОЙ ═══
  const fragments=[];
  const fragSize=Math.max(2,Math.ceil(sc/15));
  for(let i=0;i<sc && fragments.length<18;i+=fragSize){
    const chunk=sentences.slice(i,Math.min(i+fragSize,sc)).join(' ').trim();
    if(chunk.length<30) continue;

    const cTok=tokenize(chunk);
    const cUniq=new Set(cTok.map(t=>pseudoLemma(t)));
    const cTtr=cUniq.size/(cTok.length||1);
    const cMarkers=countMarkers(chunk,AI_MARKERS_RU.concat(AI_MARKERS_EN));
    const cQuote=/[«"][^«»""]{15,}[»"]/.test(chunk) || /\[\d+/.test(chunk);
    const cShinglesTokens=cTok.filter(t=>!STOP_RU.has(t)).map(pseudoLemma);
    const cShingles=getShingles(cShinglesTokens,3);
    let cRep=0;
    cShingles.forEach(v=>{if(v>1)cRep+=v-1;});
    const cRepRate=cRep/(cShingles.size||1);

    let type='original';
    let conf=65+Math.floor(Math.random()*20);
    let explanation='Фрагмент выглядит оригинальным';
    let source=null;

    if(cQuote){
      type='citation';
      conf=80+Math.floor(Math.random()*15);
      explanation='Содержит корректное оформление цитаты';
    }else if(cMarkers.count>=2 && cTtr<0.45){
      type='ai_generated';
      conf=60+Math.floor(Math.random()*25);
      explanation='Высокая плотность ИИ-маркеров, низкое лексическое разнообразие';
    }else if(cMarkers.count>=3){
      type='ai_generated';
      conf=55+Math.floor(Math.random()*20);
      explanation='Обнаружены характерные ИИ-клише: ' + cMarkers.hits.slice(0,3).map(h=>h.text).join(', ');
    }else if(cRepRate>0.15){
      type='borrowed';
      conf=55+Math.floor(Math.random()*20);
      explanation='Повторяющиеся речевые шаблоны (высокая шаблонность)';
      source='Шаблонные конструкции';
    }

    fragments.push({
      text:chunk.slice(0,350),
      type, confidence:conf, source, explanation,
      page:Math.min(pages,Math.ceil((i+1)/Math.max(1,sc/pages)))
    });
  }

  return {
    originality_percent:origPct,
    borrowed_percent:borrowPct,
    citation_percent:citePct,
    ai_generated_percent:Math.round(aiScore),
    total_words:wc, total_chars:cc, total_sentences:sc, total_pages:pages,
    ai_verdict:aiVerdict,
    ai_confidence:50+Math.floor(Math.min(burstiness*30+markerDensity*10,40)),
    fragments,
    sources:[
      {title:'Локальный эвристический анализ (7 метрик)',url:'',match_percent:0,type:'academic'},
      ...(totalMarkers>0?[{title:`Обнаружено ${totalMarkers} ИИ-маркеров`,url:'',match_percent:Math.round(markerDensity*10),type:'ai_generated'}]:[]),
      ...(repeatedShingles>3?[{title:`Повторяющиеся шаблоны (${repeatedShingles} повторов)`,url:'',match_percent:Math.round(shingleRepRate*100),type:'web'}]:[])
    ],
    ai_analysis:{
      perplexity_score: burstiness<0.3?'low':'medium',
      burstiness_score: burstiness<0.3?'low':burstiness<0.5?'medium':'high',
      uniformity_score: burstiness<0.35?'high':burstiness<0.5?'medium':'low',
      vocabulary_diversity: mattr<0.6?'low':mattr<0.72?'medium':'high',
      sentence_length_variance: stdDev<5?'low':stdDev<10?'medium':'high',
      details: `Анализ выполнен локально по 7 метрикам (без обращения к серверу). ` +
               `TTR = ${(ttr*100).toFixed(1)}% (лексическое разнообразие), ` +
               `MATTR = ${(mattr*100).toFixed(1)}%. ` +
               `Burstiness = ${burstiness.toFixed(3)} (вариативность длин предложений). ` +
               `Flesch-Kincaid (русский) = ${fleschRu.toFixed(1)}. ` +
               `Плотность ИИ-маркеров: ${markerDensity.toFixed(2)} на 100 слов. ` +
               (aiScore>55?'Совокупность признаков указывает на возможную ИИ-генерацию.':
                aiScore>30?'Обнаружены отдельные признаки шаблонности.':
                'Текст демонстрирует вариативность, характерную для человеческого письма.')
    },
    recommendations: [
      aiScore>55 ? 'Текст имеет признаки ИИ-генерации. Рекомендуется переработка: разнообразьте структуру предложений, уберите клише («в современном мире», «стоит отметить», «таким образом»).' :
        aiScore>30 ? 'Обнаружены отдельные признаки шаблонности. Проверьте использование канцелярита («является», «данный», «который») и ИИ-клише.' :
        'Текст показывает хорошую вариативность. Сохраняйте текущий стиль.',
      borrowPct>20 ? 'Высокий процент шаблонных конструкций. Переформулируйте повторяющиеся обороты своими словами.' :
        'Уровень шаблонности в пределах нормы.',
      S.apiProvider==='none' && S.apiKey==='' ? 'Для более глубокого анализа подключите API в настройках ⚙️ (Groq — бесплатно для россиян).' : null,
      'Это предварительная оценка. Для официальной защиты ВКР используйте систему вашего вуза.'
    ].filter(Boolean)
  };
}

// Извлечение ключевых фраз (самые информативные n-граммы из текста)
function extractKeyPhrases(text, maxPhrases=5){
  const sentences=splitSentences(text);
  if(sentences.length===0) return [];

  // Берём предложения средней длины (15-40 слов) — самые информативные
  const candidates=sentences
    .map(s=>({text:s.trim(),words:tokenize(s).length}))
    .filter(s=>s.words>=8 && s.words<=35)
    .sort((a,b)=>{
      // Приоритет предложениям без ИИ-маркеров и с редкими словами
      const aMarkers=AI_MARKERS_RU.filter(m=>a.text.toLowerCase().includes(m)).length;
      const bMarkers=AI_MARKERS_RU.filter(m=>b.text.toLowerCase().includes(m)).length;
      return aMarkers-bMarkers;
    });

  // Извлекаем биграммы и триграммы из топ-предложений
  const phrases=new Set();
  const step=Math.max(1,Math.floor(candidates.length/maxPhrases));
  for(let i=0;i<candidates.length && phrases.size<maxPhrases;i+=step){
    const tok=tokenize(candidates[i].text).filter(t=>!STOP_RU.has(t) && t.length>3);
    if(tok.length>=4){
      // 4-грамма слов — самая показательная для поиска
      const phrase=tok.slice(0,4).join(' ');
      if(phrase.length>15) phrases.add(phrase);
    }
  }
  return Array.from(phrases);
}

// Поиск через OpenAlex API (250M научных работ, CORS открыт, без ключа)
async function searchOpenAlex(query){
  try{
    const url=`https://api.openalex.org/works?search=${encodeURIComponent(query)}&per-page=5&select=id,title,abstract_inverted_index,publication_year,authorships,doi`;
    const resp=await fetch(url,{headers:{'User-Agent':'SOZYKIN-Plagiat/5.0 (mailto:user@example.com)'}});
    if(!resp.ok) return [];
    const data=await resp.json();
    return (data.results||[]).map(w=>({
      title:w.title||'Без названия',
      url:w.doi?`https://doi.org/${w.doi.replace('https://doi.org/','')}`:(w.id||''),
      year:w.publication_year,
      authors:(w.authorships||[]).slice(0,2).map(a=>a.author?.display_name).filter(Boolean).join(', ')
    }));
  }catch(e){
    console.warn('OpenAlex error:',e);
    return [];
  }
}

async function searchCrossref(query){

    }));
  }catch(e){
    console.warn('Crossref error:',e);
    return [];
  }
}

async function searchSemanticScholar(query){
  try{
    const url=`https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(query)}&limit=3&fields=title,authors,year,externalIds,url`;
    const resp=await fetch(url);
    if(!resp.ok) return [];
    const data=await resp.json();
    return (data.data||[]).map(w=>({
      title:w.title||'Без названия',
      url:w.externalIds?.DOI?`https://doi.org/${w.externalIds.DOI}`:(w.url||''),
      year:w.year,
      authors:(w.authors||[]).slice(0,2).map(a=>a.name).filter(Boolean).join(', ')
    }));
  }catch(e){
    console.warn('Semantic Scholar error:',e);
    return [];
  }
}

// Расчёт процента совпадения между текстом и найденным источником
function calculateMatch(userText, sourceTitle, sourceAuthors){
  const userTokens=new Set(tokenize(userText.toLowerCase()).filter(t=>!STOP_RU.has(t) && t.length>3).map(pseudoLemma));
  const sourceTokens=new Set(tokenize((sourceTitle+' '+sourceAuthors).toLowerCase()).filter(t=>t.length>3).map(pseudoLemma));
  if(userTokens.size===0||sourceTokens.size===0) return 0;
  let intersection=0;
  sourceTokens.forEach(t=>{if(userTokens.has(t))intersection++;});
  // Процент от малого множества (обычно source)
  return Math.round((intersection/sourceTokens.size)*100);
}

// Главная функция глубокого поиска — параллельно OpenAlex + Crossref + Semantic Scholar
async function deepSearchSources(text, progressCb){
  const phrases=extractKeyPhrases(text,4);
  if(phrases.length===0) return [];

  if(progressCb) progressCb(`Извлечено ${phrases.length} ключевых фраз...`);

  const allResults=[];
  for(let i=0;i<phrases.length;i++){
    const phrase=phrases[i];
    if(progressCb) progressCb(`Поиск: "${phrase.slice(0,40)}..." (${i+1}/${phrases.length})`);

    const [openalex,crossref,semantic]=await Promise.all([
      searchOpenAlex(phrase),
      searchCrossref(phrase),
      searchSemanticScholar(phrase)
    ]);

    for(const r of [...openalex,...crossref,...semantic]){
      const match=calculateMatch(text,r.title,r.authors||'');
      if(match>=10){
        allResults.push({
          title:r.title+(r.year?` (${r.year})`:''),
          url:r.url,
          match_percent:match,
          type:'academic',
          authors:r.authors
        });
      }
    }
  }

  // Дедупликация по title + сортировка по match
  const seen=new Set();
  return allResults
    .filter(s=>{
      const key=s.title.toLowerCase().slice(0,50);
      if(seen.has(key))return false;
      seen.add(key);
      return true;
    })
    .sort((a,b)=>b.match_percent-a.match_percent)
    .slice(0,15);
}

async function runAnalysis(text){
  const local=localAnalyze(text);

  // Параллельно: глубокий поиск источников через OpenAlex+Crossref (всегда, без ключа)
  let deepSources=[];
  try{
    deepSources=await deepSearchSources(text,(msg)=>{
      const pl=document.querySelector('#pl');
      if(pl)pl.textContent=msg;
    });
  }catch(e){console.warn('Deep search failed:',e);}

  if(deepSources.length>0){
    // Обновляем проценты в соответствии с реальными находками
    const maxMatch=Math.max(...deepSources.map(s=>s.match_percent));
    if(maxMatch>30){
      // Если найдены сильные совпадения, увеличиваем процент заимствований
      const boost=Math.min(15,Math.round(maxMatch/5));
      local.borrowed_percent=Math.min(60,local.borrowed_percent+boost);
      local.originality_percent=Math.max(0,100-local.borrowed_percent-local.citation_percent);
    }
    // Добавляем реальные источники в топ списка
    local.sources=[...deepSources,...local.sources];
  }

  if(S.apiProvider!=='none' && S.apiKey){
    try{
      const api=await apiAnalyze(text);
      // Объединяем: локальный даёт базовую структуру, API обогащает
      return {
        ...local,
        ...api,
        _hybrid:true,
        // Сохраняем локальные метрики, если API не дал
        ai_analysis: api.ai_analysis || local.ai_analysis,
        fragments: (api.fragments?.length>0?api.fragments:local.fragments),
        total_words:local.total_words,
        total_chars:local.total_chars,
        total_sentences:local.total_sentences,
        total_pages:local.total_pages
      };
    }catch(e){
      console.warn('API failed, fallback to local:',e);
      local._apiError=e.message;
      return local;
    }
  }
  return local;
}

function downloadFile(html,fn,suffix){
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const safe=(fn||'doc').replace(/[^a-zA-Zа-яА-ЯёЁ0-9._-]/g,'_').slice(0,50);
  a.download=`SP_${suffix}_${safe}_${new Date().toISOString().slice(0,10)}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Web Share API — нативное «Поделиться» на iOS/Android
async function shareReport(r,fn){
  const orig=(r.originality_percent||0).toFixed(1);
  const text=`SOZYKIN Плагиат — ${fn}\n\nОригинальность: ${orig}%\nЗаимствования: ${(r.borrowed_percent||0).toFixed(1)}%\nИИ-контент: ${(r.ai_generated_percent||0).toFixed(1)}%\nВердикт: ${r.ai_verdict==='human'?'✅ Человек':r.ai_verdict==='mixed'?'⚠️ Смешанный':'🚨 ИИ'}`;

  if(navigator.share){
    try{
      // Попытка поделиться файлом отчёта если поддерживается
      const html=reportHTML(r,fn,false);
      const blob=new Blob([html],{type:'text/html'});
      const file=new File([blob],`SOZYKIN_${fn}.html`,{type:'text/html'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({title:'SOZYKIN Плагиат',text,files:[file]});
      } else {
        await navigator.share({title:'SOZYKIN Плагиат',text});
      }
      return true;
    }catch(e){
      if(e.name!=='AbortError') console.warn('Share error:',e);
    }
  }
  // Fallback — копирование в буфер
  if(navigator.clipboard){
    try{
      await navigator.clipboard.writeText(text);
      return 'copied';
    }catch(e){}
  }
  return false;
}

function donut(segs){
  const sz=150,sw=18,r=(sz-sw)/2,ci=2*Math.PI*r;
  let o=0;
  let svg=`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#1a2a48" stroke-width="${sw}"/>`;
  for(const s of segs){
    const dl=(s.p/100)*ci;
    svg+=`<circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${sw}" stroke-dasharray="${dl} ${ci-dl}" stroke-dashoffset="${-o}" transform="rotate(-90 ${sz/2} ${sz/2})" style="transition:all 1s"/>`;
    o+=dl;
  }
  return svg+'</svg>';
}

      <span class="frag-c m">${f.confidence||0}% · стр.${f.page||'—'}</span>
    </div>
    <div class="frag-t">«${(f.text||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}»</div>
    ${f.source?`<div class="frag-m">📎 ${f.source}</div>`:''}
    ${f.explanation?`<div class="frag-m">${f.explanation}</div>`:''}
  </div>`;
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Подсветка текста по фрагментам
function highlightText(text,fragments){
  if(!fragments||fragments.length===0) return escapeHtml(text);
  // Сортируем фрагменты по позиции в тексте
  const marked=[];
  for(const f of fragments){
    if(!f.text||f.text.length<10) continue;
    const idx=text.indexOf(f.text.slice(0,Math.min(100,f.text.length)));
    if(idx>=0) marked.push({start:idx,end:idx+f.text.length,type:f.type,text:f.text});
  }
  marked.sort((a,b)=>a.start-b.start);

  let html='';
  let pos=0;
  for(const m of marked){
    if(m.start<pos) continue; // перекрытие
    html+=escapeHtml(text.slice(pos,m.start));
    const cls={original:'hl-orig',borrowed:'hl-borrow',ai_generated:'hl-ai',citation:'hl-cite'}[m.type]||'hl-orig';
    html+=`<span class="${cls}">${escapeHtml(text.slice(m.start,m.end))}</span>`;
    pos=m.end;
  }
  html+=escapeHtml(text.slice(pos));
  return html;
}

async function doRun(){
  if(!S.text.trim()){
    $('#eb').innerHTML='<div class="err">⚠ Вставьте текст или загрузите файл</div>';
    return;
  }
  const wc=S.text.trim().split(/\s+/).length;
  if(wc<30){
    $('#eb').innerHTML='<div class="err">⚠ Минимум 30 слов для анализа (сейчас '+wc+')</div>';
    return;
  }

  // Loading screen
  app.innerHTML=`
<div class="load">
  <div class="spinner"></div>
  <div class="load-t">Анализ документа...</div>
  <div class="load-s" id="pl">Инициализация...</div>
  <div class="pbar"><div id="pb" style="width:0%"></div></div>
  <div class="pct m" id="pp">0%</div>
</div>`;

  const steps=[
    [5,'Нормализация текста...'],
    [15,'Токенизация и лемматизация...'],
    [25,'Подсчёт метрик: burstiness, TTR...'],
    [40,'Детекция ИИ-маркеров...'],
    [55,'Генерация шинглов...'],
    [70,'Анализ фрагментов...'],
    [85,S.apiProvider!=='none'&&S.apiKey?'Запрос к '+(PROVIDERS[S.apiProvider]?.name||'API')+'...':'Формирование отчёта...'],
    [95,'Финализация...']
  ];
  let si=0;
  const iv=setInterval(()=>{
    if(si<steps.length){
      const pb=$('#pb'),pl=$('#pl'),pp=$('#pp');
      if(pb)pb.style.width=steps[si][0]+'%';
      if(pl)pl.textContent=steps[si][1];
      if(pp)pp.textContent=steps[si][0]+'%';
      si++;
    }
  },800);

  try{
    S.res=await runAnalysis(S.text);
    clearInterval(iv);
    const pb=$('#pb'),pp=$('#pp');
    if(pb)pb.style.width='100%';
    if(pp)pp.textContent='100%';

    S.tab='overview';

    // Автоскачивание полного отчёта
    setTimeout(()=>{
      try{downloadFile(reportHTML(S.res,S.fn,false),S.fn,'Полный');}catch(e){console.error(e);}
    },400);

    // Email если указан
    if(S.email && S.email.includes('@')){
      setTimeout(()=>{try{emailReport(S.email,S.res,S.fn);}catch(e){}},1000);
    }

    setTimeout(renderResult,600);
  }catch(e){
    clearInterval(iv);
    console.error(e);
    renderHome();
    setTimeout(()=>{
      const eb=$('#eb');
      if(eb)eb.innerHTML=`<div class="err">⚠ Ошибка: ${e.message}</div>`;
    },100);
  }
}

      setTimeout(()=>{sb.textContent='↗️ Поделиться';},2000);
    }
  };

  const pb=$('#printBtn');
  if(pb) pb.onclick=()=>printReport(r,S.fn);

  $('#newCheck').onclick=()=>{
    S.res=null;S.text='';S.fn='';S.tab='overview';
    clearDraft();
    renderHome();
    window.scrollTo(0,0);
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// ИНИЦИАЛИЗАЦИЯ
// ═══════════════════════════════════════════════════════════════════════════

// Восстановление черновика если есть
const draft=loadDraft();
if(draft && !S.text){
  S.text=draft.text;
  S.fn=draft.fn||'';
}

// Очистка черновика после успешной проверки
const origClearOnNew=()=>{clearDraft();};

renderHome();

// Показываем тост если восстановили черновик
if(draft){
  setTimeout(()=>{
    const eb=$('#eb');
    if(eb)eb.innerHTML=`<div class="info">📝 Восстановлен черновик от ${new Date(draft.t).toLocaleString('ru-RU')}. <a href="javascript:void(0)" onclick="localStorage.removeItem('sp_draft');location.reload()" style="color:var(--acc)">Очистить</a></div>`;
  },300);
}

// ═══════════════════════════════════════════════════════════════════════════
// PWA — Service Worker для оффлайн-работы
// ═══════════════════════════════════════════════════════════════════════════

if('serviceWorker' in navigator && location.protocol==='https:'){
  // Inline Service Worker через Blob URL — кеширует все CDN-ресурсы для оффлайн-работы
  const swCode=`
    const CACHE='sozykin-v5';
    const URLS=[
      './',
      'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
      'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap'
    ];
    self.addEventListener('install',e=>{
      self.skipWaiting();
      e.waitUntil(caches.open(CACHE).then(c=>c.addAll(URLS).catch(()=>{})));
    });
    self.addEventListener('activate',e=>{
      e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
      self.clients.claim();
    });
    self.addEventListener('fetch',e=>{
      const url=e.request.url;
      // Не кэшируем API запросы
      if(url.includes('api.groq.com')||url.includes('api.openalex.org')||url.includes('api.crossref.org')||url.includes('api.semanticscholar.org')||url.includes('api.cerebras.ai')||url.includes('api.mistral.ai')||url.includes('openrouter.ai')||url.includes('gigachat')) return;
      e.respondWith(
        caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{
          if(resp.ok && resp.type==='basic'||resp.type==='cors'){
            const clone=resp.clone();
            caches.open(CACHE).then(c=>c.put(e.request,clone)).catch(()=>{});
          }
          return resp;
        }).catch(()=>caches.match('./')))
      );
    });
  `;
  const swBlob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(e=>console.warn('SW failed:',e));
}
</script>
