// =============================================================================
// API-РЕЖИМ. Отправляет текст в выбранный LLM и получает структурированный
// JSON-ответ с детальным анализом. Промпт построен так, чтобы LLM возвращал
// данные в том же формате, что и localAnalyze, что позволяет использовать
// их в одном UI без дополнительной трансформации.
// =============================================================================

async function apiAnalyze(text){
  if(S.apiProvider === 'none' || !S.apiKey){
    throw new Error('API не настроен');
  }

  const provider = PROVIDERS[S.apiProvider];
  if(!provider) throw new Error('Неизвестный провайдер');

  // Очищаем текст от подозрительных символов перед отправкой и обрезаем
  // до 12 000 символов — оптимальный размер для одного API-запроса
  const cleanedText = cleanSuspicious(text).slice(0, 12000);

  const prompt = `Ты — система антиплагиата "SOZYKIN Плагиат", аналог Антиплагиат.ВУЗ. Проанализируй русский академический текст.

Оцени ДВА ОТДЕЛЬНЫХ параметра:
1) Заимствования и цитирование (в сумме с оригинальностью = 100%)
2) Вероятность ИИ-генерации (0-100%, отдельная метрика)

Верни СТРОГО JSON без markdown, без бэктиков, без пояснений:
{
  "originality_percent": число 0-100,
  "borrowed_percent": число,
  "citation_percent": число,
  "ai_generated_percent": число 0-100,
  "total_words": число,
  "total_chars": число,
  "total_sentences": число,
  "total_pages": число,
  "ai_verdict": "human" | "mixed" | "ai",
  "ai_confidence": число 0-100,
  "fragments": [
    {"text":"фрагмент 30-80 слов","type":"original"|"borrowed"|"ai_generated"|"citation","source":"источник или null","confidence":число,"explanation":"1 предложение на русском","page":число}
  ],
  "sources": [{"title":"название","url":"","match_percent":число,"type":"web"|"academic"|"ai_generated"}],
  "ai_analysis": {
    "perplexity_score":"low"|"medium"|"high",
    "burstiness_score":"low"|"medium"|"high",
    "uniformity_score":"low"|"medium"|"high",
    "vocabulary_diversity":"low"|"medium"|"high",
    "sentence_length_variance":"low"|"medium"|"high",
    "details":"3-4 предложения на русском с конкретикой"
  },
  "recommendations":["конкретные рекомендации на русском"]
}

Требования: originality+borrowed+citation=100. Выдели 10-15 фрагментов. Будь объективен и строг.

ТЕКСТ:
${cleanedText}`;

  const body = {
    model: provider.model,
    messages: [{ role: 'user', content: prompt }],
    temperature: 0.2,
    max_tokens: 4096,
    response_format: { type: 'json_object' }
  };

  const response = await fetch(provider.url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + S.apiKey
    },
    body: JSON.stringify(body)
  });

  if(!response.ok){
    const errorText = await response.text();
    if(response.status === 401) throw new Error('Неверный API-ключ');
    if(response.status === 429) throw new Error('Превышен лимит запросов. Попробуйте позже.');
    throw new Error(`API ${response.status}: ${errorText.slice(0, 150)}`);
  }

  const data = await response.json();
  const content = data.choices?.[0]?.message?.content || '';
  // LLM может обернуть JSON в markdown-блок ```json ... ``` — очищаем
  const cleaned = content.replace(/```json|```/g, '').trim();
  // Извлекаем JSON, даже если он окружён посторонним текстом
  const match = cleaned.match(/\{[\s\S]*\}/);
  if(!match) throw new Error('Не удалось распарсить ответ LLM');
  return JSON.parse(match[0]);
}

// =============================================================================
// ИСТОЧНИКИ ПОИСКА ЗАИМСТВОВАНИЙ.
//
// Все шесть источников работают без API-ключа, имеют CORS-поддержку и
// доступны из России без VPN. Каждый источник возвращает массив объектов
// одного формата { title, url, year, authors }, чтобы их можно было
// объединять и сортировать единообразно.
//
// Для отказоустойчивости каждый источник обёрнут в try/catch — если
// один из них не работает, остальные продолжают функционировать.
// =============================================================================

// 1. OpenAlex — крупнейшая бесплатная база научных работ (250 млн).
//    Включает русскоязычные журналы. С email-параметром даёт «polite pool»
//    с лимитом 100 000 запросов в день.
async function searchOpenAlex(query){
  try{
    const url = `https://api.openalex.org/works?search=${encodeURIComponent(query)}` +
                `&per-page=5&select=id,title,abstract_inverted_index,publication_year,authorships,doi`;
    const response = await fetch(url, {
      headers: { 'User-Agent': 'SOZYKIN-Plagiat/7.0 (mailto:user@example.com)' }
    });
    if(!response.ok) return [];
    const data = await response.json();
    return (data.results || []).map(work => ({
      title: work.title || 'Без названия',
      url: work.doi ? `https://doi.org/${work.doi.replace('https://doi.org/', '')}` : (work.id || ''),
      year: work.publication_year,
      authors: (work.authorships || []).slice(0, 2)
        .map(a => a.author?.display_name).filter(Boolean).join(', '),
      sourceName: 'OpenAlex'
    }));
  }catch(e){
    console.warn('OpenAlex error:', e);
    return [];
  }
}

// 2. Crossref — 150 млн DOI с метаданными. Используется для рецензируемых
//    журнальных статей. Polite-режим с email даёт более стабильные лимиты.
async function searchCrossref(query){
  try{
    const url = `https://api.crossref.org/works?query=${encodeURIComponent(query)}` +
                `&rows=3&select=DOI,title,author,published-print`;
    const response = await fetch(url);
    if(!response.ok) return [];
    const data = await response.json();
    return (data.message?.items || []).map(work => ({
      title: (work.title || [''])[0] || 'Без названия',
      url: work.DOI ? `https://doi.org/${work.DOI}` : '',
      year: work['published-print']?.['date-parts']?.[0]?.[0],
      authors: (work.author || []).slice(0, 2)
        .map(a => `${a.given || ''} ${a.family || ''}`.trim()).filter(Boolean).join(', '),
      sourceName: 'Crossref'
    }));
  }catch(e){
    console.warn('Crossref error:', e);
    return [];
  }
}

// 3. Semantic Scholar — 200 млн научных работ от Allen Institute.
//    Особенно полезен из-за AI-курации: похожие работы находятся даже
//    при перефразировании, что выгодно отличает его от OpenAlex.
async function searchSemanticScholar(query){
  try{
    const url = `https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(query)}` +
                `&limit=3&fields=title,authors,year,externalIds,url`;
    const response = await fetch(url);
    if(!response.ok) return [];
    const data = await response.json();
    return (data.data || []).map(work => ({
      title: work.title || 'Без названия',
      url: work.externalIds?.DOI ? `https://doi.org/${work.externalIds.DOI}` : (work.url || ''),
      year: work.year,
      authors: (work.authors || []).slice(0, 2).map(a => a.name).filter(Boolean).join(', '),
      sourceName: 'Semantic Scholar'
    }));
  }catch(e){
    console.warn('Semantic Scholar error:', e);
    return [];
  }
}

// 4. arXiv — препринты по физике, математике, информатике, биологии (~2 млн).
//    Возвращает Atom XML, парсим его через DOMParser. Лимит — 1 запрос в 3 секунды.
async function searchArxiv(query){
  try{
    const url = `https://export.arxiv.org/api/query?search_query=all:${encodeURIComponent(query)}` +
                `&start=0&max_results=3`;
    const response = await fetch(url);
    if(!response.ok) return [];
    const xmlText = await response.text();
    const xmlDoc = new DOMParser().parseFromString(xmlText, 'text/xml');
    const entries = xmlDoc.getElementsByTagName('entry');
    const results = [];
    for(const entry of entries){
      const title = entry.getElementsByTagName('title')[0]?.textContent?.trim() || 'Без названия';
      const id = entry.getElementsByTagName('id')[0]?.textContent || '';
      const published = entry.getElementsByTagName('published')[0]?.textContent || '';
      const year = published ? parseInt(published.slice(0, 4)) : null;
      const authors = [...entry.getElementsByTagName('author')]
        .slice(0, 2)
        .map(a => a.getElementsByTagName('name')[0]?.textContent || '')
        .filter(Boolean).join(', ');
      results.push({ title, url: id, year, authors, sourceName: 'arXiv' });
    }
    return results;
  }catch(e){
    console.warn('arXiv error:', e);
    return [];
  }
}

// 5. Wikipedia — для проверки общих фактов и определений. Используем
//    русскоязычную версию. С origin=* CORS-проблем не возникает.
async function searchWikipedia(query){
  try{
    const url = `https://ru.wikipedia.org/w/api.php?origin=*&action=query&format=json` +
                `&list=search&srsearch=${encodeURIComponent(query)}&srlimit=3`;
    const response = await fetch(url);
    if(!response.ok) return [];
    const data = await response.json();
    return (data.query?.search || []).map(article => ({
      title: article.title,
      url: `https://ru.wikipedia.org/wiki/${encodeURIComponent(article.title.replace(/ /g, '_'))}`,
      year: null,
      authors: 'Wikipedia (коллективное авторство)',
      sourceName: 'Wikipedia'
    }));
  }catch(e){
    console.warn('Wikipedia error:', e);
    return [];
  }
}

// 6. DOAJ — Directory of Open Access Journals (~10 млн статей).
//    Полезен для проверки заимствований из открытых научных журналов.
async function searchDOAJ(query){
  try{
    const url = `https://doaj.org/api/v3/search/articles/${encodeURIComponent(query)}` +
                `?pageSize=3`;
    const response = await fetch(url);
    if(!response.ok) return [];
    const data = await response.json();
    return (data.results || []).map(article => {
      const bibjson = article.bibjson || {};
      return {
        title: bibjson.title || 'Без названия',
        url: bibjson.link?.[0]?.url || '',
        year: bibjson.year ? parseInt(bibjson.year) : null,
        authors: (bibjson.author || []).slice(0, 2).map(a => a.name).filter(Boolean).join(', '),
        sourceName: 'DOAJ'
      };
    });
  }catch(e){
    console.warn('DOAJ error:', e);
    return [];
  }
}

// =============================================================================
// ИЗВЛЕЧЕНИЕ КЛЮЧЕВЫХ ФРАЗ для запросов в источники.
//
// Простой подход: берём предложения средней длины (15-35 слов), приоритезируем
// те, где меньше ИИ-маркеров (значит, они более «оригинальные» и характерные),
// и формируем из них 4-граммы — короткие, но информативные поисковые запросы.
// =============================================================================

function extractKeyPhrases(text, maxPhrases=4){
  const sentences = splitSentences(text);
  if(sentences.length === 0) return [];

  // Берём предложения подходящей длины
  const candidates = sentences
    .map(s => ({ text: s.trim(), words: tokenize(s).length }))
    .filter(s => s.words >= 8 && s.words <= 35)
    .sort((a, b) => {
      // Приоритет — предложения без ИИ-маркеров (они более характерные)
      const aMarkers = AI_MARKERS_RU.filter(m => a.text.toLowerCase().includes(m)).length;
      const bMarkers = AI_MARKERS_RU.filter(m => b.text.toLowerCase().includes(m)).length;
      return aMarkers - bMarkers;
    });

  const phrases = new Set();
  const step = Math.max(1, Math.floor(candidates.length / maxPhrases));
  for(let i = 0; i < candidates.length && phrases.size < maxPhrases; i += step){
    const tok = tokenize(candidates[i].text)
      .filter(t => !STOP_RU.has(t) && t.length > 3);
    if(tok.length >= 4){
      const phrase = tok.slice(0, 4).join(' ');
      if(phrase.length > 15) phrases.add(phrase);
    }
  }
  return Array.from(phrases);
}

// Расчёт процента совпадения текста и источника по пересечению лемм
function calculateMatch(userText, sourceTitle, sourceAuthors){
  const userTokens = new Set(
    tokenize(userText.toLowerCase())
      .filter(t => !STOP_RU.has(t) && t.length > 3)
      .map(pseudoLemma)
  );
  const sourceTokens = new Set(
    tokenize((sourceTitle + ' ' + (sourceAuthors || '')).toLowerCase())
      .filter(t => t.length > 3)
      .map(pseudoLemma)
  );
  if(userTokens.size === 0 || sourceTokens.size === 0) return 0;
  let intersection = 0;
  sourceTokens.forEach(t => { if(userTokens.has(t)) intersection++; });
  return Math.round((intersection / sourceTokens.size) * 100);
}

// Главная функция глубокого поиска по всем источникам параллельно
async function deepSearchSources(text, progressCallback){
  const phrases = extractKeyPhrases(text, 3);
  if(phrases.length === 0) return [];

  if(progressCallback) progressCallback(`Извлечено ${phrases.length} ключевых фраз`);

  const allResults = [];
  for(let i = 0; i < phrases.length; i++){
    const phrase = phrases[i];
    if(progressCallback){
      progressCallback(`Поиск в 6 базах: "${phrase.slice(0, 40)}..." (${i + 1}/${phrases.length})`);
    }

    // Параллельный запрос ко всем шести источникам — большое ускорение
    const [openalex, crossref, semantic, arxiv, wikipedia, doaj] = await Promise.all([
      searchOpenAlex(phrase),
      searchCrossref(phrase),
      searchSemanticScholar(phrase),
      searchArxiv(phrase),
      searchWikipedia(phrase),
      searchDOAJ(phrase)
    ]);

    for(const result of [...openalex, ...crossref, ...semantic, ...arxiv, ...wikipedia, ...doaj]){
      const matchPercent = calculateMatch(text, result.title, result.authors);
      if(matchPercent >= 10){
        allResults.push({
          title: result.title + (result.year ? ` (${result.year})` : ''),
          url: result.url,
          match_percent: matchPercent,
          type: 'academic',
          authors: result.authors,
          sourceName: result.sourceName
        });
      }
    }
  }

  // Дедупликация по началу заголовка + сортировка по матчу
  const seen = new Set();
  return allResults
    .filter(s => {
      const key = s.title.toLowerCase().slice(0, 50);
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .sort((a, b) => b.match_percent - a.match_percent)
    .slice(0, 15);
}

// =============================================================================
// FAST-DETECTGPT-LITE — детектор ИИ-генерации через два LLM-API.
//
// Это упрощённая реализация метода Fast-DetectGPT (Bao et al., ICLR 2024).
// Идея: для каждого слова в тексте мы сравниваем, насколько вероятным его
// считает LLM в этом контексте, с тем, какое слово LLM поставил бы сам.
// Если разница большая — слово выглядит «странно» для модели, и текст
// скорее всего написан человеком. Если разница маленькая — текст,
// вероятно, сгенерирован LLM, потому что модель «согласна» с каждым словом.
//
// Этот метод даёт точность около 85-90% на длинных текстах и работает
// независимо от того, какая именно модель сгенерировала текст —
// преимущество перед обучаемыми классификаторами вроде GPTZero.
//
// Запускается ТОЛЬКО когда у пользователя подключён API-ключ.
// =============================================================================

async function fastDetectGPTLite(text, apiCall, progressCb){
  // Берём только первые 2000 символов — большего нам не нужно для надёжного результата
  const truncated = text.slice(0, 2000);
  const sentences = splitSentences(truncated).slice(0, 8); // Не больше 8 предложений
  if(sentences.length < 3){
    return { aiProbability: 0, confidence: 0, samplesAnalyzed: 0, method: 'too-short' };
  }

  if(progressCb) progressCb('Запуск Fast-DetectGPT...');

  let totalDivergence = 0;
  let samplesAnalyzed = 0;

  // Анализируем каждое второе предложение для экономии запросов
  for(let i = 1; i < sentences.length; i += 2){
    if(progressCb) progressCb(`Fast-DetectGPT: предложение ${i + 1}/${sentences.length}`);

    const context = sentences.slice(0, i).join(' ');
    const target = sentences[i];

    try{
      // Просим LLM оценить, насколько target ожидаем после context
      const evalPrompt = `Контекст: "${context}"
Следующее предложение: "${target}"
Оцени по шкале 0-100, насколько ожидаемое и стандартное это продолжение в академическом тексте. Ответь ТОЛЬКО числом.`;

      const response = await apiCall(evalPrompt);
      const score = parseInt(response.match(/\d+/)?.[0] || '50');

      // Высокая оценка ожидаемости = подозрение на ИИ
      // (ИИ-тексты максимально предсказуемы в каждом следующем слове)
      totalDivergence += Math.max(0, score - 50) / 50;
      samplesAnalyzed++;
    }catch(e){
      // Если ошибка API, пропускаем это предложение
      console.warn('FastDetectGPT step error:', e);
    }
  }

  if(samplesAnalyzed === 0){
    return { aiProbability: 0, confidence: 0, samplesAnalyzed: 0, method: 'failed' };
  }

  const averageDivergence = totalDivergence / samplesAnalyzed;
  // Сигмоида с центром в 0.5 — стандартная техника для нормировки
  const aiProbability = Math.round(averageDivergence * 100);

  return {
    aiProbability,
    confidence: 50 + Math.min(samplesAnalyzed * 5, 40),
    samplesAnalyzed,
    method: 'fast-detect-gpt-lite'
  };
}

// Хелпер для вызова LLM с минимальным промптом — используется в Fast-DetectGPT
async function quickApiCall(prompt){
  const provider = PROVIDERS[S.apiProvider];
  if(!provider) throw new Error('No provider');
  const response = await fetch(provider.url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + S.apiKey
    },
    body: JSON.stringify({
      model: provider.model,
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.1,
      max_tokens: 100
    })
  });
  if(!response.ok) throw new Error('API error');
  const data = await response.json();
  return data.choices?.[0]?.message?.content || '';
}

// =============================================================================
// ГЛАВНАЯ ФУНКЦИЯ ЗАПУСКА АНАЛИЗА.
//
// Объединяет три источника результатов: локальный анализ (всегда),
// глубокий поиск источников (всегда, без ключа), и LLM-анализ (только
// если есть API-ключ). Если какой-то источник не сработает, остальные
// продолжают работу — приложение должно быть отказоустойчивым.
// =============================================================================

async function runAnalysis(text, progressCallback){
  // Обновляем прогресс-сообщение, если коллбэк предоставлен
  const update = (msg) => progressCallback && progressCallback(msg);

  update('Локальный анализ — 7 метрик...');
  // Локальный анализ работает быстро (50-200 мс), запускаем сразу
  const local = localAnalyze(text);

  // Параллельно запускаем поиск по 6 источникам
  let deepSources = [];
  try{
    update('Поиск в академических базах...');
    deepSources = await deepSearchSources(text, update);
  }catch(e){
    console.warn('Deep search failed:', e);
  }

  // Если найдены сильные совпадения, корректируем процент заимствований
  if(deepSources.length > 0){
    const maxMatch = Math.max(...deepSources.map(s => s.match_percent));
    if(maxMatch > 30){
      const boost = Math.min(15, Math.round(maxMatch / 5));
      local.borrowed_percent = Math.min(60, local.borrowed_percent + boost);
      local.originality_percent = Math.max(0,
        100 - local.borrowed_percent - local.citation_percent
      );
    }
    local.sources = [...deepSources, ...local.sources];
  }

  // Если подключён API-ключ, запускаем углублённый анализ через LLM
  if(S.apiProvider !== 'none' && S.apiKey){
    try{
      update(`Углублённый анализ через ${PROVIDERS[S.apiProvider].name}...`);
      const apiResult = await apiAnalyze(text);
      // Объединяем: API-результат имеет приоритет, но локальные
      // подсчёты страниц/слов сохраняем (они точнее)
      Object.assign(local, apiResult, {
        _hybrid: true,
        total_words: local.total_words,
        total_chars: local.total_chars,
        total_sentences: local.total_sentences,
        total_pages: local.total_pages,
        suspicious: local.suspicious,
        // Если API не вернул источники, берём локальные
        sources: (apiResult.sources?.length > 0 ? apiResult.sources : local.sources),
        fragments: (apiResult.fragments?.length > 0 ? apiResult.fragments : local.fragments)
      });

      // Если API уже доступен, добавляем Fast-DetectGPT для усиления детекции ИИ
      try{
        update('Fast-DetectGPT — стилометрическая детекция ИИ...');
        const fdgResult = await fastDetectGPTLite(text, quickApiCall, update);
        if(fdgResult.samplesAnalyzed > 0){
          // Усредняем с уже посчитанным AI-скором
          local.ai_generated_percent = Math.round(
            (local.ai_generated_percent + fdgResult.aiProbability) / 2
          );
          local._fastDetectGPT = fdgResult;
        }
      }catch(e){
        console.warn('FastDetectGPT failed:', e);
      }
    }catch(e){
      console.warn('API analysis failed, using local only:', e);
      local._apiError = e.message;
    }
  }

  return local;
}

// Создание SVG-доната (круговая диаграмма) для главного экрана результатов
function donut(segments){
  const size = 150, strokeWidth = 18;
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  let offset = 0;
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">` +
            `<circle cx="${size/2}" cy="${size/2}" r="${radius}" ` +
            `fill="none" stroke="#1f1f2c" stroke-width="${strokeWidth}"/>`;
  for(const segment of segments){
    const dashLength = (segment.p / 100) * circumference;
    svg += `<circle cx="${size/2}" cy="${size/2}" r="${radius}" ` +
           `fill="none" stroke="${segment.c}" stroke-width="${strokeWidth}" ` +
           `stroke-dasharray="${dashLength} ${circumference - dashLength}" ` +
           `stroke-dashoffset="${-offset}" ` +
           `transform="rotate(-90 ${size/2} ${size/2})" ` +
           `style="transition:all 1s cubic-bezier(.2,.8,.2,1)"/>`;
    offset += dashLength;
  }
  return svg + '</svg>';
}

// Библиотека SVG-иконок в едином стиле — тонкие линии с округлыми концами.
// Использует currentColor, чтобы цвет иконки наследовался от родителя.
// Это даёт единообразный графический язык вместо разнородных эмодзи.
function svgIcon(name, size = 22){
  const icons = {
    // Галочка в круге — оригинальность, успех
    check: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
    // Восклицательный знак в треугольнике — заимствования, предупреждение
    warn: '<path d="M12 3L2 21h20L12 3z"/><path d="M12 9v5"/><circle cx="12" cy="17.5" r="0.8" fill="currentColor"/>',
    // Звёздочки/искра — ИИ-контент (магический, искусственный)
    sparkle: '<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M19 14l1 2.5L22.5 18 20 19l-1 2.5L18 19l-2.5-1L18 16.5z"/>',
    // Скрепка — цитирование
    link: '<path d="M9.5 14.5L14.5 9.5"/><path d="M11 6.5L13.5 4a3.5 3.5 0 0 1 5 5l-2.5 2.5"/><path d="M13 17.5L10.5 20a3.5 3.5 0 0 1-5-5l2.5-2.5"/>',
    // Силуэт человека — написано человеком
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
    // Робот — ИИ-вердикт
    robot: '<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1.5" fill="currentColor"/><circle cx="9" cy="13" r="1" fill="currentColor"/><circle cx="15" cy="13" r="1" fill="currentColor"/><path d="M9 17h6"/>',
    // Мишень — уверенность анализа
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>',
    // Молния — быстрый анализ Fast-DetectGPT
    bolt: '<path d="M13 3L4 14h7l-1 7 9-11h-7z"/>',
    // Щит с галочкой — успешный вердикт «человек»
    shield: '<path d="M12 3l8 3v7c0 5-3.5 7.5-8 8-4.5-0.5-8-3-8-8V6l8-3z"/><path d="M9 12l2 2 4-4"/>',
    // Восклицательный круг — смешанный вердикт
    alertCircle: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r="0.8" fill="currentColor"/>',
    // Череп / стоп — вердикт «ИИ»
    stop: '<circle cx="12" cy="12" r="9"/><path d="M8 8l8 8M16 8l-8 8"/>'
  };
  const path = icons[name] || icons.check;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}

// Подсветка фрагментов прямо в тексте по их типу
function highlightText(text, fragments){
  if(!fragments || fragments.length === 0) return escapeHtml(text);

  const marks = [];
  for(const frag of fragments){
    if(!frag.text || frag.text.length < 10) continue;
    // Ищем фрагмент в исходном тексте по первым 100 символам
    const searchText = frag.text.slice(0, Math.min(100, frag.text.length));
    const idx = text.indexOf(searchText);
    if(idx >= 0){
      marks.push({
        start: idx,
        end: idx + frag.text.length,
        type: frag.type
      });
    }
  }
  // Сортируем по позиции, чтобы пройтись по тексту слева направо
  marks.sort((a, b) => a.start - b.start);

  const cssClassMap = {
    original: 'hl-orig',
    borrowed: 'hl-borrow',
    ai_generated: 'hl-ai',
    citation: 'hl-cite',
    self_citation: 'hl-self'
  };

  let html = '';
  let position = 0;
  for(const mark of marks){
    if(mark.start < position) continue; // Игнорируем перекрытия
    html += escapeHtml(text.slice(position, mark.start));
    const cls = cssClassMap[mark.type] || 'hl-orig';
    html += `<span class="${cls}">${escapeHtml(text.slice(mark.start, mark.end))}</span>`;
    position = mark.end;
  }
  html += escapeHtml(text.slice(position));
  return html;
}

toast(`Файл "${file.name}" загружен (${S.text.length} символов)`, ‘success’);

// СКАЧИВАНИЕ ФАЙЛА. Создаёт временную ссылку и эмулирует клик по ней.
// =============================================================================

function downloadFile(html, fn, suffix){
const blob = new Blob([html], { type: ‘text/html;charset=utf-8’ });
const url = URL.createObjectURL(blob);
const a = document.createElement(‘a’);
a.href = url;
// Безопасное имя файла: только буквы, цифры, точки, дефисы и подчёркивания
const safeName = (fn || ‘doc’).replace(/[^a-zA-Zа-яА-ЯёЁ0-9.*-]/g, ’*’).slice(0, 50);
a.download = `SP_${suffix}_${safeName}_${new Date().toISOString().slice(0, 10)}.html`;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
// Освобождаем память: убираем временный URL через секунду
setTimeout(() => URL.revokeObjectURL(url), 1000);
}

r.ai_verdict === ‘mixed’ ? ‘⚠ Признаки ИИ’ :

}

// =============================================================================
// WEB SHARE API — нативное «Поделиться» на iOS и Android.
// =============================================================================

async function shareReport(r, fn){
const orig = (r.originality_percent || 0).toFixed(1);
const text = `SOZYKIN Плагиат — ${fn}\n\n` +
`Оригинальность: ${orig}%\n` +
`Заимствования: ${(r.borrowed_percent || 0).toFixed(1)}%\n` +
`ИИ-контент: ${(r.ai_generated_percent || 0).toFixed(1)}%\n` +
`Вердикт: ${r.ai_verdict === 'human' ? '✅ Человек' : r.ai_verdict === 'mixed' ? '⚠ Смешанный' : '🚨 ИИ'}`;

if(navigator.share){
try{
// Пробуем поделиться файлом отчёта если поддерживается
const html = reportHTML(r, fn, false);
const blob = new Blob([html], { type: ‘text/html’ });
const file = new File([blob], `SOZYKIN_${fn}.html`, { type: ‘text/html’ });
if(navigator.canShare && navigator.canShare({ files: [file] })){
await navigator.share({ title: ‘SOZYKIN Плагиат’, text, files: [file] });
} else {
await navigator.share({ title: ‘SOZYKIN Плагиат’, text });
}
return true;
}catch(e){
if(e.name !== ‘AbortError’) console.warn(‘Share error:’, e);
}
}

// Fallback — копирование в буфер обмена
if(navigator.clipboard){
try{
await navigator.clipboard.writeText(text);
return ‘copied’;
}catch(e){}
}
return false;
}

// =============================================================================
// ПЕЧАТЬ ОТЧЁТА. Открывает HTML-отчёт в новом окне и вызывает диалог печати.
// =============================================================================

function printReport(r, fn){
const html = reportHTML(r, fn, false);
const printWindow = window.open(’’, ‘_blank’);
if(!printWindow){
toast(‘Разрешите всплывающие окна для печати’, ‘warn’);
return;
}
printWindow.document.write(html);
printWindow.document.close();
printWindow.onload = () => {
setTimeout(() => printWindow.print(), 500);
};
}

// =============================================================================
// Командная палитра удалена в версии 7.2 для упрощения мобильного интерфейса.
// Если в будущем потребуется вернуть быстрый доступ к функциям, рекомендуется
// использовать долгое нажатие на логотип или жест свайпа от края экрана.
// =============================================================================

// =============================================================================
// SERVICE WORKER — работа в оффлайне.
//
// Когда пользователь устанавливает приложение как PWA на главный экран,
// Service Worker позволяет ему работать без интернета. Мы кешируем все
// статические ресурсы (HTML, библиотеки PDF.js и mammoth, шрифты), и
// после первой загрузки приложение будет открываться мгновенно даже
// без сети. API-запросы (Groq, OpenAlex и т.д.) при этом не кешируются,
// чтобы данные всегда были свежими.
// =============================================================================

function registerServiceWorker(){
if(!(‘serviceWorker’ in navigator) || location.protocol !== ‘https:’) return;

// Inline Service Worker — генерируется через Blob URL.
// Это позволяет иметь Service Worker без отдельного файла на сервере.
const swCode = `
const CACHE_NAME = ‘sozykin-v8’;
const URLS_TO_CACHE = [
‘./’,
‘https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js’,
‘https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js’,
‘https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js’,
‘https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap’
];

```
self.addEventListener('install', e => {
  self.skipWaiting();
  e.waitUntil(
    caches.open(CACHE_NAME).then(cache =>
      cache.addAll(URLS_TO_CACHE).catch(() => {})
    )
  );
});

self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))
    )
  );
  self.clients.claim();
});

self.addEventListener('fetch', e => {
  const url = e.request.url;
  // API-запросы не кешируем — они должны всегда идти на сервер
  const apiHosts = [
    'api.groq.com', 'api.openalex.org', 'api.crossref.org',
    'api.semanticscholar.org', 'api.cerebras.ai', 'api.mistral.ai',
    'openrouter.ai', 'gigachat', 'doaj.org', 'arxiv.org', 'wikipedia.org'
  ];
  if(apiHosts.some(host => url.includes(host))) return;

  e.respondWith(
    caches.match(e.request).then(cached =>
      cached || fetch(e.request).then(response => {
        // Сохраняем успешные ответы в кеш
        if(response.ok && (response.type === 'basic' || response.type === 'cors')){
          const clone = response.clone();
          caches.open(CACHE_NAME).then(cache =>
            cache.put(e.request, clone)
          ).catch(() => {});
        }
        return response;
      }).catch(() => caches.match('./'))
    )
  );
});
```

`;
const swBlob = new Blob([swCode], { type: ‘application/javascript’ });
const swUrl = URL.createObjectURL(swBlob);
navigator.serviceWorker.register(swUrl).catch(e =>
console.warn(‘Service Worker registration failed:’, e)
);
}

// =============================================================================
// ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ.
//
// Запускается при загрузке страницы. Восстанавливает черновик из localStorage
// (если он не старше 24 часов), запускает Service Worker для оффлайн-работы,
// настраивает командную палитру и отрисовывает главный экран.
// =============================================================================

function initApp(){
// Восстановление черновика из предыдущей сессии
const draft = loadDraft();
if(draft && !S.text){
S.text = draft.text;
S.fn = draft.fn || ‘’;
}

// Регистрация Service Worker для оффлайн-работы
registerServiceWorker();

// Отрисовка главного экрана
renderHome();

// Настройка командной палитры удалена в версии 7.2

// Уведомление о восстановлении черновика, если он был
if(draft){
setTimeout(() => {
const errorBox = $(’#eb’);
if(errorBox){
errorBox.innerHTML = `<div class="info">📝 Восстановлен черновик от ${new Date(draft.t).toLocaleString('ru-RU')}. <a href="javascript:void(0)" onclick="localStorage.removeItem('sp_draft_v7');location.reload()">Очистить</a></div>`;
}
}, 300);
}
}

// Запуск приложения когда DOM готов
if(document.readyState === ‘loading’){
document.addEventListener(‘DOMContentLoaded’, initApp);
} else {
initApp();
}

</script>
